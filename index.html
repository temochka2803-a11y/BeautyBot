<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BeautyHub — площадка бьюти-мастеров</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#F7F2F4;
  --surface:#FFFFFF;
  --ink:#34202C;
  --ink-soft:#7C6670;
  --rose:#B94B6C;
  --rose-deep:#8C3B52;
  --gold:#C89B4A;
  --teal:#3E7A6F;
  --line:#EBDEE3;
  --danger:#B9464B;
  --shadow: 0 8px 24px rgba(60,20,35,0.08);
  --radius: 18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}

#frame{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  padding-bottom:78px;
}

/* header */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:18px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:8px;}
.brand .mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;
}
.brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:-0.2px;}
.brand .word em{font-style:italic;color:var(--rose);}
.hdr-icon{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px;}

.section-pad{padding:0 18px;}

/* chips */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;scroll-snap-type:x proximity;}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:100px;background:var(--surface);
  font-size:13px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);
  white-space:nowrap;transition:.15s;
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.filterbar{display:flex;gap:8px;padding:0 18px 12px;}
.selectbox{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;font-size:13px;font-weight:600;color:var(--ink);
}

/* master cards */
.mcard{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin:0 18px 14px;display:flex;gap:12px;align-items:flex-start;
}
.avatar{
  width:58px;height:58px;border-radius:16px;flex:0 0 58px;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:var(--bg);
}
.mcard-body{flex:1;min-width:0;}
.mcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.mcard-name{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;line-height:1.2;}
.mcard-city{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:100px;margin-top:6px;
}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
.rating-row{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12.5px;color:var(--ink-soft);}
.price-from{font-weight:700;color:var(--rose-deep);font-size:13px;}

.empty{
  text-align:center;color:var(--ink-soft);padding:60px 30px;font-size:14px;line-height:1.6;
}
.empty .big{font-size:34px;margin-bottom:10px;}

/* bottom nav */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
}
.navbar-inner{
  width:100%;max-width:430px;background:var(--surface);
  box-shadow:0 -6px 20px rgba(60,20,35,0.08);
  display:flex;border-top:1px solid var(--line);
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 0 9px;font-size:10.5px;font-weight:700;color:var(--ink-soft);position:relative;
}
.navbtn.active{color:var(--rose-deep);}
.navbtn .ic{font-size:19px;}
.navdot{
  position:absolute;top:6px;right:28%;width:8px;height:8px;border-radius:50%;background:var(--danger);
  border:2px solid var(--surface);
}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 18px;border-radius:14px;font-weight:700;font-size:14.5px;
  background:var(--ink);color:#fff;width:100%;
}
.btn.primary{background:linear-gradient(135deg,var(--rose),var(--rose-deep));}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn.teal{background:var(--teal);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #ecd0d1;}
.btn.small{padding:9px 12px;font-size:13px;border-radius:11px;width:auto;}
.btn:disabled{opacity:.45;}

.card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin:0 18px 14px;
}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);font-size:14px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}

.hero{
  padding:26px 18px 6px;
}
.hero h1{font-size:26px;margin:0 0 6px;line-height:1.15;letter-spacing:-.3px;}
.hero p{color:var(--ink-soft);font-size:14px;margin:0;line-height:1.5;}

.subnav{display:flex;gap:6px;padding:4px 18px 14px;overflow-x:auto;}
.subnav button{
  flex:0 0 auto;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);
}
.subnav button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.badge.pending{background:#FBEFD6;color:#8A5A1F;}
.badge.confirmed{background:#DDEDE6;color:#2E6B52;}
.badge.cancelled{background:#F3D8DE;color:#8C3B52;}
.badge.active{background:#DDEDE6;color:#2E6B52;}
.badge.inactive{background:#F3D8DE;color:#8C3B52;}
.badge.demo{background:#E4DCF3;color:#4B3B7A;}
.badge.completed{background:#E7E2DC;color:#6B5C52;}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.gallery img{width:100%;height:78px;object-fit:cover;border-radius:10px;background:var(--line);}

.svc-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
.svc-row:last-child{border-bottom:none;}
.svc-name{font-weight:600;font-size:14px;}
.svc-meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.svc-price{font-weight:700;color:var(--rose-deep);}

/* city picker (главный экран выбора города) */
.city-hero-badge{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;
  margin-bottom:12px;box-shadow:var(--shadow);
}
.search-input{
  display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow);
}
.search-input .search-ic{font-size:15px;opacity:.55;flex:0 0 auto;}
.search-input input{border:none;background:none;flex:1;font-size:14.5px;color:var(--ink);outline:none;padding:0;min-width:0;}
.search-input input::placeholder{color:var(--ink-soft);}
.city-list-card{padding:6px;max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.city-row{
  display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;
  cursor:pointer;transition:background .15s;border-bottom:1px solid var(--line);
}
.city-row:last-child{border-bottom:none;}
.city-row:active{background:var(--bg);}
.city-row-pin{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;
}
.city-row-body{flex:1;min-width:0;}
.city-row-name{font-weight:600;font-size:14.5px;}
.city-row-count{color:var(--ink-soft);font-size:12px;margin-top:1px;}
.city-row-arrow{color:var(--ink-soft);font-size:15px;flex:0 0 auto;}

.slot{
  padding:8px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
  text-align:center;font-size:12.5px;font-weight:700;
}
.slot.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.slot.taken{opacity:.35;text-decoration:line-through;}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}

.review{padding:12px 0;border-bottom:1px solid var(--line);}
.review:last-child{border-bottom:none;}
.review-top{display:flex;justify-content:space-between;align-items:center;}
.review-name{font-weight:700;font-size:13.5px;}
.review-date{font-size:11px;color:var(--ink-soft);}
.review-text{font-size:13.5px;color:var(--ink);margin-top:5px;line-height:1.5;}

.backbar{display:flex;align-items:center;gap:10px;padding:16px 18px 4px;}
.backbtn{width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;}

.toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:100px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;max-width:380px;text-align:center;
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

.pillnote{
  background:#F3E7EC;border:1px solid #EAD3DC;color:var(--rose-deep);
  padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.5;margin:0 18px 14px;
}
.divider{height:1px;background:var(--line);margin:14px 0;}
.notif-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.notif-item:last-child{border-bottom:none;}
.notif-ic{width:34px;height:34px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
.notif-text{font-size:13px;line-height:1.4;}
.notif-time{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--ink-soft);font-size:13px;}
.starpick{display:flex;gap:6px;font-size:26px;}
.starpick span{cursor:pointer;color:var(--line);}
.starpick span.on{color:var(--gold);}
.link-btn{color:var(--rose-deep);font-weight:700;font-size:13px;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:2px;}
.chat-msg{display:flex;flex-direction:column;max-width:78%;}
.chat-msg.in{align-items:flex-start;align-self:flex-start;}
.chat-msg.out{align-items:flex-end;align-self:flex-end;}
.chat-bubble{padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.chat-msg.in .chat-bubble{background:var(--bg);color:var(--ink);border-bottom-left-radius:4px;}
.chat-msg.out .chat-bubble{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-bottom-right-radius:4px;}
.chat-time{font-size:10.5px;color:var(--ink-soft);margin-top:3px;padding:0 2px;}
</style>
</head>

/* Персональные данные (shared:false) привязываются к Telegram ID текущего пользователя.
   Вне Telegram (тестирование в браузере) используется временный тестовый идентификатор. */
function ownerId(){
  return (state.tgUser && state.tgUser.id) ? String(state.tgUser.id) : 'anon-test-user';
}

/* ============ STORAGE HELPERS (Supabase-backed, повторяют сигнатуру window.storage) ============ */
async function sget(key, shared=false){
  try{
    const scopeKey = shared ? key : (ownerId()+':'+key);
    const { data, error } = await sb
      .from('app_storage').select('value')
      .eq('scope_key', scopeKey).eq('shared', shared).maybeSingle();
    if(error){ console.error('sget failed:', error.message, '| code:', error.code, '| details:', error.details, '| hint:', error.hint); return null; }
    if(!data) return null;
    return data.value;
  }catch(e){ console.error('sget threw:', e && e.message ? e.message : e); return null; }
}
async function sset(key, value, shared=false){
  try{
    const scopeKey = shared ? key : (ownerId()+':'+key);
    const { error } = await sb.from('app_storage')
      .upsert({ scope_key:scopeKey, shared, value, updated_at:new Date().toISOString() }, { onConflict:'scope_key,shared' });
    if(error) console.error('sset failed:', error.message, '| code:', error.code, '| details:', error.details, '| hint:', error.hint);
  }catch(e){ console.error('sset threw:', e && e.message ? e.message : e); }
}
async function slist(prefix, shared=false){
  try{
    const base = shared ? '' : (ownerId()+':');
    const fullPrefix = base + (prefix||'');
    const { data, error } = await sb.from('app_storage')
      .select('scope_key').eq('shared', shared).like('scope_key', fullPrefix+'%');
    if(error || !data) return [];
    return data.map(r => shared ? r.scope_key : r.scope_key.slice(base.length));
  }catch(e){ return []; }
}

function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function todayISO(offset=0){ const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',weekday:'short'});
}
function ratingOf(m){ return m.ratingCount ? (m.ratingSum/m.ratingCount) : 0; }
/* Сколько последовательных часовых ячеек сетки (TIMES) занимает запись, исходя из длительности
   услуги — грубое, но полезное приближение поверх фиксированной часовой сетки времени. */
function occupiedTimesForBooking(bk){
  const need = Math.max(1, Math.ceil((bk.duration||60)/60));
  const idx = TIMES.indexOf(bk.time);
  if(idx===-1) return [bk.time];
  return TIMES.slice(idx, idx+need);
}
/* Прошло ли время записи. Используется, чтобы прятать кнопки «Отменить» у записей,
   которые уже состоялись (или на которые клиент просто не пришёл) — отменять уже нечего. */
function isBookingPast(b){
  if(!b || !b.date || !b.time) return false;
  const dt = new Date(`${b.date}T${b.time}`);
  if(isNaN(dt.getTime())) return false;
  return dt.getTime() < Date.now();
}
function starsStr(avg){
  const r = Math.round(avg);
  return '★'.repeat(r) + '☆'.repeat(5-r);
}
function priceFrom(m){
  if(!m.services || !m.services.length) return null;
  return Math.min(...m.services.map(s=>s.price));
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Если у мастера есть аватарка (обычно подтянутая из Telegram-профиля при регистрации),
   показываем её как фоновую картинку; иначе — иконку специализации, как раньше. */
function avatarStyle(m){
  if(m && m.avatarUrl){
    return `background-image:url('${String(m.avatarUrl).replace(/'/g,'%27')}');background-size:cover;background-position:center;`;
  }
  return '';
}
function avatarInner(m, spec){
  return (m && m.avatarUrl) ? '' : (spec ? spec.icon : '');
}

/* Проверяет, не истёк ли пробный период мастера. Если да — один раз деактивирует профиль
   (он пропадает из каталога, как при обычной неоплаченной подписке) и отправляет мастеру
   уведомление с просьбой оплатить подписку: сообщением в чат приложения и — если настроена
   Edge Function notify-telegram — сообщением от бота в Telegram.
   Вызывается автоматически из loadMaster/loadAllMasters, поэтому отдельно её дёргать не нужно. */
async function checkTrialExpiry(m){
  if(!m || !m.isTrial || !m.trialEndsAt) return m;
  if(Date.now() < m.trialEndsAt) return m;

  const alreadyHandled = !!m.trialExpiredNotifiedAt;
  m.subscriptionActive = false;
  m.isTrial = false;
  m.trialExpiredNotifiedAt = m.trialExpiredNotifiedAt || Date.now();
  await saveMaster(m);

  if(!alreadyHandled){
    try{
      const chat = await loadChat(m.id);
      chat.push({
        id: uid(), from:'owner',
        text: '⏳ Пробный период закончился, профиль временно скрыт из каталога. Оплатите подписку во вкладке «Мастеру → Профиль» — как только оплата подтвердится, клиенты снова смогут вас найти.',
        createdAt: Date.now(), readByOwner:true, readByMaster:false
      });
      await saveChat(m.id, chat);
      await addChatToIndex(m.id);
      if(m.telegramId){
        await notifyTelegram(m.telegramId,
          `⏳ Пробный период BeautyHub закончился.\nВаш профиль «${m.name}» временно скрыт из каталога.\nОплатите подписку в приложении (вкладка «Мастеру»), чтобы клиенты снова могли вас найти и записаться.`);
      }
    }catch(e){
      console.warn('checkTrialExpiry notify failed:', e);
    }
  }
  return m;
}

/* Уведомляет всех, кто стоит в листе ожидания мастера, что появилось новое свободное время
   (мастер открыл слоты или у кого-то отменилась запись), и очищает список — кто не успеет
   записаться, всегда может встать в лист ожидания заново. */
async function notifyWaitlist(masterId){
  try{
    const list = await loadWaitlist(masterId);
    if(!list.length) return;
    const m = await loadMaster(masterId);
    const text = `🔔 У мастера «${m?m.name:''}» появилось новое свободное время!\nОткройте приложение и запишитесь — обычно разбирают быстро.`;
    for(const w of list){
      if(w.clientTelegramId) await notifyTelegram(w.clientTelegramId, text);
    }
    await saveWaitlist(masterId, []);
  }catch(e){ console.warn('notifyWaitlist failed:', e); }
}

/* Автоматическая отправка уведомления через Telegram-бота.
   Вызывает Supabase Edge Function 'notify-telegram', которая на сервере
   (там, где безопасно хранить секретный токен бота) шлёт сообщение через Bot API.
   Если функция ещё не задеплоена — просто возвращает false, вызывающий код
   сам решает, что делать дальше (например, показать резервный способ отправки). */
async function notifyTelegram(chatId, text){
  if(!sb || !chatId) return false;
  try{
    const { data, error } = await sb.functions.invoke('notify-telegram', { body: { chatId: String(chatId), text } });
    if(error){ console.warn('notifyTelegram: функция недоступна или вернула ошибку —', error.message||error); return false; }
    return !!(data && data.ok);
  }catch(e){
    console.warn('notifyTelegram threw:', e && e.message ? e.message : e);
    return false;
  }
}

/* ============ INIT ============ */
/* Резервный способ достать start_param: некоторые версии Telegram (особенно Desktop/Web)
   в момент самого первого рендера ещё не успевают заполнить initDataUnsafe.start_param,
   зато параметр уже есть в адресной строке как #tgWebAppStartParam=... или ?startapp=... —
   на всякий случай проверяем оба места. */
function readStartParamFromLocation(){
  try{
    const hash = (window.location.hash || '').replace(/^#/, '');
    const search = (window.location.search || '').replace(/^\?/, '');
    const params = new URLSearchParams(hash + '&' + search);
    return params.get('tgWebAppStartParam') || params.get('startapp') || null;
  }catch(e){ return null; }
}

function detectTelegramIdentity(){
  try{
    const tg = window.Telegram && window.Telegram.WebApp;
    if(tg && tg.initData && tg.initData.length > 0){
      tg.ready(); tg.expand();
      state.isTelegramContext = true;
      state.tgUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
      const idStr = state.tgUser ? String(state.tgUser.id) : null;
      state.isOwner = !!idStr && OWNER_TELEGRAM_IDS.includes(idStr);
      // Ссылка-приглашение мастера: t.me/<bot>?startapp=book_<masterId> -> Telegram кладёт это в start_param.
      state._startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || readStartParamFromLocation() || null;
    } else {
      state.isTelegramContext = false;
      state.isOwner = false;
      // Для тестирования в обычном браузере: ?startapp=book_<id> в адресной строке
      const urlParam = new URLSearchParams(window.location.search).get('startapp');
      state._startParam = urlParam || readStartParamFromLocation() || null;
    }
  }catch(e){
    state.isTelegramContext = false;
    state.isOwner = false;
    state._startParam = null;
  }
}

async function init(){
  if(SUPABASE_INIT_ERROR){
    renderSetupError(SUPABASE_INIT_ERROR);
    return;
  }
  detectTelegramIdentity();
  await seedIfEmpty();
  state.myMasterId = await sget('my-master-id', false);
  if(state.myMasterId){ state.myMaster = await loadMaster(state.myMasterId); }
  state.userRole = await sget('my-role', false) || null;
  if(state.myMasterId && state.userRole !== 'master'){
    // Если у устройства уже есть профиль мастера, роль всегда «мастер», даже если раньше выбрали иначе.
    state.userRole = 'master';
    await sset('my-role', 'master', false);
  }
  state.clientName = await sget('my-client-name', false) || '';
  state.clientContact = await sget('my-client-contact', false) || '';
  state.favorites = await sget('my-favorites', false) || [];
  // Prefill client name from Telegram profile if available and not set yet
  if(state.isTelegramContext && state.tgUser && !state.clientName){
    const full = [state.tgUser.first_name, state.tgUser.last_name].filter(Boolean).join(' ');
    if(full) state.clientName = full;
  }
  // Пришли по персональной ссылке мастера (t.me/бот?startapp=book_<id>) — сразу открываем его страницу записи.
  if(state._startParam && state._startParam.startsWith('book_')){
    const linkedMasterId = state._startParam.slice('book_'.length);
    const linkedMaster = await loadMaster(linkedMasterId);
    if(linkedMaster){
      if(!state.userRole){ state.userRole = 'client'; await sset('my-role', 'client', false); }
      state.view = 'catalog';
      state.selectedMasterId = linkedMasterId;
      state.masterDetailTab = 'book';
    } else {
      setTimeout(()=>showToast('Не удалось найти мастера по ссылке — возможно, профиль удалён'), 300);
    }
  }
  // Пришли по реферальной ссылке клиента (t.me/бот?startapp=ref_<clientKey>) — засчитываем приглашение.
  if(state._startParam && state._startParam.startsWith('ref_')){
    try{
      const refKey = state._startParam.slice('ref_'.length);
      const myKey = ownerId();
      if(refKey && refKey !== myKey){
        const alreadyReferred = await sget('my-referred-by', false);
        if(!alreadyReferred){
          await sset('my-referred-by', refKey, false);
          const refs = await sget('referrals:'+refKey, true) || [];
          if(!refs.includes(myKey)){ refs.push(myKey); await sset('referrals:'+refKey, refs, true); }
          const priority = await sget('priority-clients', true) || [];
          let changed = false;
          if(!priority.includes(myKey)){ priority.push(myKey); changed = true; }
          if(!priority.includes(refKey)){ priority.push(refKey); changed = true; }
          if(changed) await sset('priority-clients', priority, true);
          if(!state.userRole){ state.userRole = 'client'; await sset('my-role', 'client', false); }
          setTimeout(()=>showToast('Вы пришли по приглашению — вы и ваша подруга теперь приоритетные клиенты ⭐'), 300);
        }
      }
    }catch(e){ console.warn('referral handling failed:', e); }
  }
  state.loading = false;
  render();
}

/* Ловит любую ошибку внутри асинхронных экранов и показывает её текстом
   вместо того, чтобы экран молча завис на "Загрузка…" навсегда. */
async function safeFill(fn){
  try{
    await fn();

    console.error('Ошибка при отрисовке экрана:', e);
    const content = document.getElementById('content');
    if(content){

        <div style="margin-top:16px;"><button class="btn ghost small" onclick="render()">Попробовать снова</button></div>

    }
  }
}

function goto(view){

  state._adminPreviewReturn = false; // обычная навигация по низу экрана — выходим из режима «просмотр как клиент»
  state.view = view;
  if(view==='catalog') state.selectedMasterId=null;
  if(view==='master') state.forcePaywall=false;
  if(view==='admin'){ state.adminScreen='dashboard'; state.adminChatMasterId=null; state.adminEditingId=null; }
  render();
}

async function fillCatalog(){
  const allMasters = await loadAllMasters();
  const liveMasters = allMasters.filter(m=>m.subscriptionActive && !m.isDemo && !m.disabledByAdmin && m.moderationStatus==='approved' && !(m.vacationUntil && m.vacationUntil>=todayISO(0)));

  if(!state.filters.city){ return renderCityStep(liveMasters); }
  if(state.catalogStep==='specs'){ return renderSpecStep(liveMasters); }
  return renderListStep(liveMasters);
}

/* --- STEP 1: choose city --- */
function renderCityStep(masters){
  const counts = {};
  masters.forEach(m=>{ counts[m.city] = (counts[m.city]||0)+1; });
  const allCities = Object.keys(counts);
  const isLong = allCities.length > 8;

  // Короткий список — оставляем по популярности (как раньше), длинный — сортируем по алфавиту,
  // чтобы город было легче найти взглядом, и добавляем поиск + быстрые чипы самых частых городов.
  const popular = allCities.slice().sort((a,b)=>counts[b]-counts[a]).slice(0,6);
  const displayCities = isLong
    ? allCities.slice().sort((a,b)=>a.localeCompare(b,'ru'))
    : allCities.slice().sort((a,b)=>counts[b]-counts[a]);

  const hero = `<div class="hero">
    <div class="city-hero-badge">📍</div>
    <h1>В каком вы городе?</h1>
    <p>Покажем мастеров маникюра, бровей, ресниц, тату и пирсинга рядом с вами${masters.length?` — сейчас на платформе ${masters.length} мастер${masters.length===1?'':masters.length<5?'а':'ов'}`:''}.</p>
  </div>`;

  const searchBox = isLong ? `<div class="section-pad">
    <div class="search-input">
      <span class="search-ic">🔍</span>
      <input id="citySearch" placeholder="Начните вводить город…" autocomplete="off" oninput="filterCityList(this.value)">
    </div>
  </div>` : '';

  const popularChips = isLong && popular.length>1 ? `<div class="chiprow" style="padding-top:10px;">
    ${popular.map(c=>`<button class="chip" onclick="chooseCity('${escapeHtml(c).replace(/'/g,"\\'")}')">📍 ${escapeHtml(c)}</button>`).join('')}
  </div>` : '';

  const cityRows = displayCities.map(c=>`<div class="city-row" data-city="${escapeHtml(c.toLowerCase())}" onclick="chooseCity('${escapeHtml(c).replace(/'/g,"\\'")}')">
      <div class="city-row-pin">📍</div>
      <div class="city-row-body">
        <div class="city-row-name">${escapeHtml(c)}</div>
        <div class="city-row-count">${counts[c]} мастер${counts[c]===1?'':counts[c]<5?'а':'ов'}</div>
      </div>
      <div class="city-row-arrow">→</div>
    </div>`).join('');

  const cityList = displayCities.length ? `<div class="card city-list-card">
      <div id="cityListInner">${cityRows}</div>
      <div id="cityListEmpty" class="empty" style="display:none;padding:24px 10px;">Ничего не нашлось — попробуйте ввести город вручную ниже.</div>
    </div>` : `<div class="empty" style="padding:20px 30px"><div class="big">🏙️</div>Мастеров пока нет ни в одном городе.</div>`;

  const manual = `<div class="section-pad">
    <div class="field"><label>${isLong?'Не нашли свой город?':'Или введите город вручную'}</label><input id="cityManual" placeholder="Например, Екатеринбург"></div>
    <button class="btn ghost" onclick="chooseCityManual()">Найти мастеров в этом городе</button>
  </div>`;

  const becomeMasterLink = state.userRole==='client' ? `<div class="section-pad" style="text-align:center;"><button class="link-btn" onclick="becomeMaster()">Вы мастер? Разместите свой профиль →</button></div>` : '';

  document.getElementById('content').innerHTML = hero + searchBox + popularChips + cityList + manual + becomeMasterLink;
}
function filterCityList(q){
  const query = q.trim().toLowerCase();
  const rows = document.querySelectorAll('#cityListInner .city-row');
  let visible = 0;
  rows.forEach(el=>{
    const match = !query || el.dataset.city.includes(query);
    el.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const emptyEl = document.getElementById('cityListEmpty');
  if(emptyEl) emptyEl.style.display = (query && visible===0) ? 'block' : 'none';
}
window.filterCityList = filterCityList;
function chooseCity(c){
  state.filters.city = c;
  state.filters.spec = 'all';
  state.catalogStep = 'specs';
  fillCatalog();
}
function chooseCityManual(){
  const v = document.getElementById('cityManual').value.trim();
  if(!v){ showToast('Введите название города'); return; }
  chooseCity(v);
}
window.chooseCity=chooseCity; window.chooseCityManual=chooseCityManual;

/* --- STEP 3: master list for city + specialization --- */
function renderListStep(masters){
  const inCity = masters.filter(m=>m.city===state.filters.city);
  let list = inCity.filter(m=> state.filters.spec==='all' || m.specialization===state.filters.spec);
  if(state.filters.minRating) list = list.filter(m=>ratingOf(m) >= state.filters.minRating);
  if(state.filters.maxPrice) list = list.filter(m=>{ const pf=priceFrom(m); return pf==null || pf<=state.filters.maxPrice; });
  if(state.filters.availableSoon) list = list.filter(hasSlotsSoon);

  if(state.filters.sort==='rating') list.sort((a,b)=>ratingOf(b)-ratingOf(a));
  else if(state.filters.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  else if(state.filters.sort==='price') list.sort((a,b)=>(priceFrom(a)||0)-(priceFrom(b)||0));

  const cityBar = `<div class="backbar"><button class="backbtn" onclick="backToSpecs()">←</button><div style="font-weight:700">📍 ${escapeHtml(state.filters.city)} · ${state.filters.spec==='all'?'Все специалисты':SPECS[state.filters.spec].label}</div></div>`;

  const chips = `<div class="chiprow">
    <button class="chip ${state.filters.spec==='all'?'active':''}" onclick="chooseSpec('all')">Все</button>
    ${Object.entries(SPECS).map(([k,v])=>`<button class="chip ${state.filters.spec===k?'active':''}" onclick="chooseSpec('${k}')">${v.icon} ${v.label}</button>`).join('')}
  </div>`;

  const filterbar = `<div class="filterbar">
    <select class="selectbox" onchange="setSort(this.value)">
      <option value="rating" ${state.filters.sort==='rating'?'selected':''}>По рейтингу</option>
      <option value="price" ${state.filters.sort==='price'?'selected':''}>По цене</option>
      <option value="name" ${state.filters.sort==='name'?'selected':''}>По имени</option>
    </select>
    <button class="selectbox" style="flex:0 0 auto;font-weight:700;" onclick="changeCity()">Сменить город</button>
  </div>`;

  const filterbar2 = `<div class="chiprow" style="padding-top:0;">
    <button class="chip ${state.filters.minRating>=4?'active':''}" onclick="toggleMinRating()">★ 4+</button>
    <button class="chip ${state.filters.availableSoon?'active':''}" onclick="toggleAvailableSoon()">🗓️ Свободен сегодня/завтра</button>
    <input type="number" inputmode="numeric" placeholder="Цена до, ₽" value="${state.filters.maxPrice||''}" style="flex:0 0 120px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;" onchange="setMaxPrice(this.value)">
  </div>`;

  let cardsHtml;
  if(!list.length){
    cardsHtml = `<div class="empty"><div class="big">🪄</div>В этой категории пока нет мастеров в вашем городе.<br>Попробуйте другую специализацию.</div>`;
  } else {
    cardsHtml = list.map(m=>{
      const spec = SPECS[m.specialization];
      const avg = ratingOf(m);
      const pf = priceFrom(m);
      const favOn = isFavorite(m.id);
      return `<div class="mcard">
        <div class="avatar" style="cursor:pointer;${avatarStyle(m)}" onclick="openMaster('${m.id}')">${avatarInner(m,spec)}</div>
        <div class="mcard-body" style="cursor:pointer;" onclick="openMaster('${m.id}')">
          <div class="mcard-top">
            <div>
              <div class="mcard-name">${escapeHtml(m.name)}</div>
              <div class="mcard-city">📍 ${escapeHtml(m.city)}</div>
            </div>
            ${pf!=null?`<div class="price-from">от ${pf}₽</div>`:''}
          </div>
          <span class="tag" style="background:${specBg(m.specialization)};color:${specFg(m.specialization)}">${spec.icon} ${spec.label}</span>
          <div class="rating-row"><span class="stars">${starsStr(avg)}</span> ${avg? avg.toFixed(1):'нет оценок'} ${m.ratingCount?`· ${m.ratingCount} отзыв.`:''}</div>
        </div>
        <button class="link-btn" style="font-size:19px;padding:0 2px;align-self:flex-start;color:${favOn?'var(--rose-deep)':'var(--ink-soft)'}" onclick="toggleFavorite('${m.id}')">${favOn?'♥':'♡'}</button>
      </div>`;
    }).join('');
  }

  document.getElementById('content').innerHTML = cityBar + chips + filterbar + filterbar2 + cardsHtml;
}
function hasSlotsSoon(m){
  const d0 = todayISO(0), d1 = todayISO(1);
  return !!((m.slots && m.slots[d0] && m.slots[d0].length) || (m.slots && m.slots[d1] && m.slots[d1].length));
}

async function fillMasterDetail(){
  const m = await loadMaster(state.selectedMasterId);
  if(!m){ document.getElementById('content').innerHTML = `<div class="empty">Мастер не найден</div>`; return; }
  const reviews = await loadReviews(m.id);
  const bookings = await loadBookings(m.id);
  const waitlist = await loadWaitlist(m.id);
  const spec = SPECS[m.specialization];
  const avg = ratingOf(m);

  // Право на отзыв: у клиента должна быть ЗАВЕРШЁННАЯ (подтверждённая и прошедшая по дате)
  // запись именно к этому мастеру, за которую он ещё не оставлял отзыв.
  const myBookingRefs = (await sget('my-client-bookings', false) || []).filter(r=>r.masterId===m.id);
  const today = todayISO(0);
  const reviewedBookingIds = new Set(reviews.filter(r=>r.bookingId).map(r=>r.bookingId));
  const eligibleBookings = [];
  for(const ref of myBookingRefs){
    const bk = bookings.find(b=>b.id===ref.bookingId);
    if(bk && bk.status==='confirmed' && bk.date<=today && !reviewedBookingIds.has(bk.id)){
      eligibleBookings.push(bk);
    }
  }
  state._eligibleReviewBookings = eligibleBookings;

  const back = state._adminPreviewReturn
    ? `<div class="backbar"><button class="backbtn" onclick="backFromAdminPreview()">←</button><div style="font-weight:700">${escapeHtml(m.name)}</div></div>
       <div class="pillnote" style="margin:0 18px 10px;background:#E4DCF3;border-color:#D6C6EE;color:#4B3B7A;">👁 Вы смотрите профиль глазами клиента. <button class="link-btn" style="margin-left:4px" onclick="backFromAdminPreview()">Вернуться в кабинет владельца</button></div>`
    : `<div class="backbar"><button class="backbtn" onclick="backToCatalog()">←</button><div style="font-weight:700">${escapeHtml(m.name)}</div></div>`;

  const header = `<div class="card" style="display:flex;gap:12px;align-items:center;">

      <div class="rating-row" style="margin-top:6px;"><span class="stars">${starsStr(avg)}</span> ${avg?avg.toFixed(1):'нет оценок'} ${m.ratingCount?`· ${m.ratingCount} отзыв.`:''}</div>
    </div>
    <button class="link-btn" style="font-size:24px;color:${isFavorite(m.id)?'var(--rose-deep)':'var(--ink-soft)'}" onclick="toggleFavorite('${m.id}')">${isFavorite(m.id)?'♥':'♡'}</button>
  </div>`;

    <button class="${state.masterDetailTab==='services'?'active':''}" onclick="setDTab('services')">Услуги</button>
    <button class="${state.masterDetailTab==='portfolio'?'active':''}" onclick="setDTab('portfolio')">Работы</button>
    <button class="${state.masterDetailTab==='reviews'?'active':''}" onclick="setDTab('reviews')">Отзывы (${reviews.length})</button>
    <button class="${state.masterDetailTab==='book'?'active':''}" onclick="setDTab('book')">Записаться</button>
  </div>`;

  let body='';
  if(state.masterDetailTab==='about'){
    body = `<div class="card"><p style="margin:0;font-size:14px;line-height:1.6;color:var(--ink)">${escapeHtml(m.bio)||'Мастер пока не добавил описание.'}</p></div>`;
  } else if(state.masterDetailTab==='services'){
    body = `<div class="card">${
      m.services.length? m.services.map(s=>`<div class="svc-row"><div><div class="svc-name">${escapeHtml(s.name)}</div><div class="svc-meta">${s.duration} мин</div></div><div class="svc-price">${s.price}₽</div></div>`).join('')

async function uploadReviewPhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('rvUploadStatus');
  if(statusEl) statusEl.textContent = 'Загружаем…';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `reviews/${uid()}.${ext}`;
    const { error: upErr } = await sb.storage.from('portfolios').upload(path, file, { upsert:false, contentType: file.type || 'image/jpeg' });
    if(upErr) throw upErr;
    const { data } = sb.storage.from('portfolios').getPublicUrl(path);
    const url = data && data.publicUrl;
    if(!url) throw new Error('Не удалось получить ссылку на фото');
    state._pendingReviewPhoto = url;
    if(statusEl) statusEl.textContent = 'Фото добавлено ✓';
    fillMasterDetail();
  }catch(e){
    console.error('Review photo upload failed', e);
    if(statusEl) statusEl.textContent = 'Не получилось загрузить фото (возможно, не настроено хранилище Supabase Storage) — можно оставить отзыв без фото.';
  }
}
window.uploadReviewPhoto = uploadReviewPhoto;

async function submitReview(masterId){
  const name = document.getElementById('rvName').value.trim();
  const text = document.getElementById('rvText').value.trim();
  const rating = state._pickedStar||0;
  const bookingIdEl = document.getElementById('rvBookingId');
  const bookingId = bookingIdEl ? bookingIdEl.value : null;

  await sset('my-client-name', name, false);

function renderBookingForm(m, bookings, waitlist){
  if(!m.services.length) return `<div class="card"><div class="empty" style="padding:20px 0">Мастер ещё не добавил услуги для записи</div></div>`;
  const b = state.booking || {serviceId:m.services[0].id, date:null, time:null};
  state.booking = b;

  const serviceOpts = m.services.map(s=>`<option value="${s.id}" ${b.serviceId===s.id?'selected':''}>${escapeHtml(s.name)} — ${s.price}₽</option>`).join('');

  const days = Array.from({length:10},(_,i)=>todayISO(i));
  const dayChips = days.map(d=>{
    const has = (m.slots && m.slots[d] && m.slots[d].length);
    return `<button class="chip ${b.date===d?'active':''}" ${has?'':'style="opacity:.35;pointer-events:none;"'} onclick="pickDate('${d}')">${fmtDate(d)}</button>`;
  }).join('');

  let slotsHtml = '';
  if(b.date){
    const daySlots = (m.slots && m.slots[b.date]) || [];
    const takenTimes = bookings.filter(bk=>bk.date===b.date && bk.status!=='cancelled').flatMap(occupiedTimesForBooking);
    slotsHtml = `<div class="slotgrid">${daySlots.map(t=>{
      const taken = takenTimes.includes(t);
      return `<div class="slot ${b.time===t?'on':''} ${taken?'taken':''}" onclick="${taken?'':`pickTime('${t}')`}">${t}</div>`;
    }).join('')}</div>`;
    if(!daySlots.length) slotsHtml = `<div class="empty" style="padding:10px 0">На эту дату нет свободного времени</div>`;
  }

  const onWaitlist = (waitlist||[]).some(w=>w.clientKey===ownerId());
  const waitlistCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">🔔 Нет подходящего времени?</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Встаньте в лист ожидания — как только у мастера появится новое свободное время (откроет слоты или у кого-то отменится запись), мы вам сразу напишем.</div>
    ${onWaitlist
      ? `<div class="pillnote" style="margin:0 0 10px;padding-left:0;padding-right:0;background:none;border:none;">✅ Вы в листе ожидания.</div><button class="btn ghost small" onclick="leaveWaitlist('${m.id}')">Выйти из списка</button>`
      : `<button class="btn ghost" onclick="joinWaitlist('${m.id}')">Встать в лист ожидания</button>`}
  </div>`;

  return `<div class="card">
    <div class="field"><label>Услуга</label><select id="bkService" onchange="setBookField('serviceId', this.value)">${serviceOpts}</select></div>
    <div class="field"><label>Дата</label><div class="chiprow" style="padding:0;overflow-x:auto;">${dayChips}</div></div>
    ${b.date?`<div class="field"><label>Время</label>${slotsHtml}</div>`:''}
    <div class="field"><label>Ваше имя</label><input id="bkName" value="${escapeHtml(state.clientName)}" placeholder="Имя"></div>
    <div class="field"><label>Телефон / Telegram</label><input id="bkContact" value="${escapeHtml(state.clientContact)}" placeholder="@username или телефон"></div>
    <button class="btn primary" onclick="submitBooking('${m.id}')" ${(!b.date||!b.time)?'disabled':''}>Отправить заявку на запись</button>
    <div class="pillnote" style="margin:10px 0 0;">После отправки заявка придёт мастеру. Как только он подтвердит запись, вы увидите статус во вкладке «Мои записи».</div>
  </div>
  ${waitlistCard}`;
}

async function submitBooking(masterId){
  const name = document.getElementById('bkName').value.trim();
  const contact = document.getElementById('bkContact').value.trim();
  if(!name || !contact){ showToast('Укажите имя и контакт для связи'); return; }

  // Простая защита от спама: не больше 5 заявок за 10 минут с этого устройства/аккаунта
  const recentSubmits = (await sget('my-booking-attempts', false) || []).filter(ts => Date.now()-ts < 10*60*1000);
  if(recentSubmits.length >= 5){
    showToast('Слишком много заявок подряд. Попробуйте немного позже.');
    return;
  }

  await sset('my-client-name', name, false);
  await sset('my-client-contact', contact, false);
  state.clientName=name; state.clientContact=contact;

  const m = await loadMaster(masterId);
  const service = m.services.find(s=>s.id===state.booking.serviceId);

  // Перечитываем самые свежие записи прямо перед сохранением, чтобы минимизировать
  // окно гонки, если кто-то другой записался на этот же слот почти одновременно.
  const bookings = await loadBookings(masterId);
  const wantTimes = occupiedTimesForBooking({time:state.booking.time, duration:service.duration||60});
  const alreadyTaken = bookings.some(b=>b.status!=='cancelled' && b.date===state.booking.date && occupiedTimesForBooking(b).some(t=>wantTimes.includes(t)));
  if(alreadyTaken){
    showToast('Увы, это время только что заняли. Выберите другое.');
    state.booking.time = null;
    fillMasterDetail();
    return;
  }

  const booking = {
    id:uid(), masterId, serviceId:service.id, serviceName:service.name, price:service.price,
    duration: service.duration||60,
    date:state.booking.date, time:state.booking.time,
    clientName:name, clientContact:contact, status:'pending', createdAt:Date.now(),
    clientTelegramId: (state.tgUser && state.tgUser.id) ? String(state.tgUser.id) : null
  };
  bookings.push(booking);
  await saveBookings(masterId, bookings);

  recentSubmits.push(Date.now());
  await sset('my-booking-attempts', recentSubmits, false);

  const mine = await sget('my-client-bookings', false) || [];
  mine.push({bookingId:booking.id, masterId});
  await sset('my-client-bookings', mine, false);

  state.booking=null;
  showToast('Заявка отправлена мастеру! Ожидайте подтверждения.');
  state.masterDetailTab='about';
  fillMasterDetail();

  // Мгновенное уведомление мастеру о новой заявке (в чат приложения + от бота в Telegram).
  try{
    const chat = await loadChat(masterId);
    chat.push({
      id: uid(), from:'owner',
      text: `🗓️ Новая заявка на запись!\n${service.name} · ${fmtDate(booking.date)} в ${booking.time}\nКлиент: ${name} (${contact})`,
      createdAt: Date.now(), readByOwner:true, readByMaster:false
    });
    await saveChat(masterId, chat);
    await addChatToIndex(masterId);
    if(m.telegramId){
      await notifyTelegram(m.telegramId,
        `🗓️ Новая заявка на запись!\n\nУслуга: ${service.name}\nКогда: ${fmtDate(booking.date)} в ${booking.time}\nКлиент: ${name}\nКонтакт: ${contact}\n\nПодтвердите или отклоните её во вкладке «Мастеру → Записи».`);
    }
  }catch(e){ console.warn('booking notify failed:', e); }
}
window.submitBooking = submitBooking;

async function fillMyBookings(){
  const mine = await sget('my-client-bookings', false) || [];
  const hero = `<div class="hero"><h1>Мои записи</h1><p>Статусы ваших заявок к мастерам.</p></div>`;

  const refLink = `https://t.me/${BOT_USERNAME}?startapp=ref_${ownerId()}`;
  const referrals = await sget('referrals:'+ownerId(), true) || [];
  const referralCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">👯 Пригласите подругу</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Отправьте эту ссылку — когда подруга откроет приложение по ней, вы обе станете приоритетными клиентами у мастеров (это отметка для мастера, помогает при прочих равных).${referrals.length?` Уже приглашено: ${referrals.length}.`:''}</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input readonly value="${refLink}" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--ink-soft);" onclick="this.select()">
      <button class="btn primary small" style="width:auto;padding:0 16px;white-space:nowrap;" onclick="copyText('${refLink}')">Скопировать</button>
    </div>
  </div>`;

  if(!mine.length){
    document.getElementById('content').innerHTML = hero + referralCard + `<div class="empty"><div class="big">🗓️</div>Пока нет записей.<br>Найдите мастера в каталоге и оставьте заявку.</div>`;
    return;
  }
  const rows=[];
  for(const entry of mine.slice().reverse()){
    const bookings = await loadBookings(entry.masterId);
    const bk = bookings.find(b=>b.id===entry.bookingId);
    if(!bk) continue;
    const m = await loadMaster(entry.masterId);
    const spec = m?SPECS[m.specialization]:null;
    const past = isBookingPast(bk);
    const canCancel = (bk.status==='pending' || bk.status==='confirmed') && !past;
    const isCompleted = bk.status==='confirmed' && past;
    const statusLabel = isCompleted ? 'Состоялась' : (bk.status==='pending'?'Ожидает':bk.status==='confirmed'?'Подтверждено':'Отменено');
    const statusClass = isCompleted ? 'completed' : bk.status;
    rows.push(`<div class="card">
      <div class="mcard-top">
        <div>
          <div class="mcard-name">${escapeHtml(bk.serviceName)}</div>
          <div class="mcard-city">${spec?spec.icon+' ':''}${m?escapeHtml(m.name):'Мастер'} · 📍 ${m?escapeHtml(m.city):''}</div>
        </div>
        <span class="badge ${statusClass}">${statusLabel}</span>
      </div>
      <div class="divider"></div>
      <div style="font-size:13.5px;color:var(--ink-soft)">📅 ${fmtDate(bk.date)} в ${bk.time} · ${bk.price}₽</div>
      ${canCancel ? `<div style="margin-top:10px;"><button class="btn danger small" onclick="clientCancelBooking('${entry.masterId}','${bk.id}')">Отменить запись</button></div>` : ''}
      ${isCompleted && m ? `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn ghost small" onclick="repeatBooking('${entry.masterId}','${bk.serviceId}')">🔁 Повторить запись</button>
        <button class="btn ghost small" onclick="goToReview('${entry.masterId}')">⭐ Оставить отзыв</button>
      </div>` : ''}
    </div>`);
  }
  document.getElementById('content').innerHTML = hero + referralCard + rows.join('');
}

async function clientCancelBooking(masterId, bookingId){
  const sure = window.confirm('Отменить эту запись? Мастер получит уведомление.');
  if(!sure) return;
  const bookings = await loadBookings(masterId);
  const bk = bookings.find(b=>b.id===bookingId);
  if(!bk) return;
  bk.status = 'cancelled';
  bk.cancelledBy = 'client';
  await saveBookings(masterId, bookings);
  showToast('Запись отменена');
  fillMyBookings();

  // Мгновенное уведомление мастеру (в чат приложения + от бота в Telegram).
  try{
    const m = await loadMaster(masterId);
    const chat = await loadChat(masterId);
    chat.push({
      id: uid(), from:'owner',
      text: `❌ Клиент отменил запись.\n${bk.serviceName} · ${fmtDate(bk.date)} в ${bk.time}\nКлиент: ${bk.clientName}`,
      createdAt: Date.now(), readByOwner:true, readByMaster:false
    });
    await saveChat(masterId, chat);
    await addChatToIndex(masterId);
    if(m && m.telegramId){
      await notifyTelegram(m.telegramId,
        `❌ Клиент отменил запись.\n\nУслуга: ${bk.serviceName}\nКогда была: ${fmtDate(bk.date)} в ${bk.time}\nКлиент: ${bk.clientName}\n\nЭтот слот теперь снова свободен.`);
    }
  }catch(e){ console.warn('cancel notify failed:', e); }
  notifyWaitlist(masterId); // слот освободился — сообщим тем, кто в листе ожидания
}
window.clientCancelBooking = clientCancelBooking;

async function finishRegistration(){
  const name = document.getElementById('regName').value.trim();
  const spec = document.getElementById('regSpec').value;
  const city = document.getElementById('regCity').value.trim();
  const address = document.getElementById('regAddress').value.trim();
  const bio = document.getElementById('regBio').value.trim();
  if(!name || !city){ showToast('Укажите как минимум имя и город'); return; }
  const id = uid();
  // Автоматически подтягиваем аватарку из Telegram-профиля мастера (если разрешено его настройками приватности).
  const avatarUrl = (state.tgUser && state.tgUser.photo_url) ? state.tgUser.photo_url : null;
  const master = {
    id, specialization:spec, name, city, address, bio,
    services:[], portfolio:[], slots:{},
    subscriptionActive:false, subscriptionUntil:null,
    ratingSum:0, ratingCount:0, createdAt:Date.now(), isDemo:false, disabledByAdmin:false,
    telegramId: (state.tgUser && state.tgUser.id) ? String(state.tgUser.id) : null,
    avatarUrl,
    paymentClaimStatus: null, paymentClaimMethod: null, paymentClaimAt: null,
    moderationStatus: 'pending', // pending | approved | rejected
    moderationReason: null,
    paymentHistory: [], // [{ method, confirmedAt, subscriptionUntil }]
    isTrial: false, trialEndsAt: null
  };
  await saveMaster(master);
  await addMasterToIndex(id);
  await saveBookings(id, []);
  await saveReviews(id, []);
  await sset('my-master-id', id, false);
  state.myMasterId = id; state.myMaster = master;
  state.userRole = 'master';
  await sset('my-role', 'master', false);
  showToast('Профиль создан! Он отправлен на проверку модератору.');
  fillMasterArea();
}
window.finishRegistration = finishRegistration;

async function renderMasterDashboard(m, isDemo){
  if(!isDemo && m.moderationStatus==='pending'){
    return renderModerationPending(m);
  }
  if(!isDemo && m.moderationStatus==='rejected'){
    return renderModerationRejected(m);
  }
  if(!isDemo && (!m.subscriptionActive || state.forcePaywall)){
    return renderPaywall(m);
  }
  const bookings = isDemo? [] : await loadBookings(m.id);
  const pending = bookings.filter(b=>b.status==='pending').length;

  // Отмечаем «был онлайн» — не чаще раза в час, чтобы не плодить лишние записи в базе.
  // Используется владельцем для алерта об оттоке (платящий мастер, который давно не заходил).
  if(!isDemo && (!m.lastSeenAt || Date.now()-m.lastSeenAt > 3600000)){
    m.lastSeenAt = Date.now();
    saveMaster(m); // не блокируем рендер ожиданием сохранения
  }

  let chat = [];
  if(!isDemo){
    chat = await loadChat(m.id);
    if(state.masterTab==='chat'){
      // Открыл вкладку «Чат» — помечаем сообщения владельца прочитанными
      let changed = false;
      chat.forEach(msg=>{ if(msg.from==='owner' && !msg.readByMaster){ msg.readByMaster = true; changed = true; } });
      if(changed) await saveChat(m.id, chat);
    }
  }
  const chatUnread = chat.filter(msg=>msg.from==='owner' && !msg.readByMaster).length;
  state._pendingCount = pending + chatUnread;

  const demoBanner = isDemo? `<div class="pillnote" style="background:#E4DCF3;border-color:#D6C6EE;color:#4B3B7A;">Вы в демо-режиме. Изменения не сохраняются. <button class="link-btn" style="margin-left:4px" onclick="exitDemo()">Выйти из демо</button></div>` : '';

  let subInfo = '';
  if(!isDemo){
    if(m.isTrial && m.trialEndsAt){
      const msLeft = m.trialEndsAt - Date.now();
      const hoursLeft = Math.max(0, Math.ceil(msLeft/3600000));
      subInfo = `<div class="card" style="background:#FBEFD6;border:1px solid #F3DFA8;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:700;font-size:13.5px;color:#8A5A1F;">🎁 Пробный доступ активен</div>
            <div style="font-size:12px;color:#8A5A1F;margin-top:2px;">Осталось примерно ${hoursLeft} ч — профиль виден клиентам бесплатно</div>
          </div>
        </div>
        <button class="btn primary small" style="margin-top:10px;width:100%;" onclick="state.forcePaywall=true; fillMasterArea();">Оплатить сейчас, чтобы не пропасть из каталога</button>
      </div>`;
    } else {
      subInfo = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div><div style="font-weight:700;font-size:13.5px;">Подписка активна</div><div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">До ${fmtDate(m.subscriptionUntil)}</div></div>
        <span class="badge active">Активна</span>
      </div>`;
    }
  }

  const tabs = `<div class="subnav">
    <button class="${state.masterTab==='profile'?'active':''}" onclick="setMTab('profile')">Профиль</button>
    <button class="${state.masterTab==='services'?'active':''}" onclick="setMTab('services')">Услуги</button>
    <button class="${state.masterTab==='portfolio'?'active':''}" onclick="setMTab('portfolio')">Работы</button>
    <button class="${state.masterTab==='schedule'?'active':''}" onclick="setMTab('schedule')">Расписание</button>
    <button class="${state.masterTab==='bookings'?'active':''}" onclick="setMTab('bookings')">Записи${pending?` (${pending})`:''}</button>
    <button class="${state.masterTab==='clients'?'active':''}" onclick="setMTab('clients')">👥 Клиенты</button>
    <button class="${state.masterTab==='chat'?'active':''}" onclick="setMTab('chat')">💬 Чат${chatUnread?` (${chatUnread})`:''}</button>
  </div>`;

  let body='';
  if(state.masterTab==='profile') body = renderMProfile(m, isDemo);
  else if(state.masterTab==='services') body = renderMServices(m, isDemo);
  else if(state.masterTab==='portfolio') body = renderMPortfolio(m, isDemo);
  else if(state.masterTab==='schedule') body = renderMSchedule(m, isDemo);
  else if(state.masterTab==='bookings') body = renderMBookings(m, bookings, isDemo);
  else if(state.masterTab==='clients') body = await renderMClients(m, isDemo, bookings);
  else if(state.masterTab==='chat') body = renderMChat(m, isDemo, chat);

  const dashHeader = `<div class="hero" style="padding-top:20px;padding-bottom:0;display:flex;align-items:center;gap:12px;">
    <div class="avatar" style="width:44px;height:44px;font-size:20px;border-radius:14px;${avatarStyle(m)}">${avatarInner(m,SPECS[m.specialization])}</div>
    <h1 style="font-size:22px;margin:0;">${escapeHtml(m.name)}</h1>
  </div>`;
  document.getElementById('content').innerHTML = dashHeader + demoBanner + subInfo + tabs + body;
}

function renderMChat(m, isDemo, chat){
  if(isDemo){
    return `<div class="card"><div class="empty" style="padding:20px 0">💬 Чат с владельцем платформы доступен после создания настоящего профиля — в демо-режиме он отключён.</div></div>`;
  }
  const bubbles = (chat && chat.length) ? chat.map(msg=>`
    <div class="chat-msg ${msg.from==='master'?'out':'in'}">
      <div class="chat-bubble">${escapeHtml(msg.text)}</div>
      <div class="chat-time">${new Date(msg.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') : `<div class="empty" style="padding:30px 10px;">💬 Напишите владельцу платформы — например, попросите помочь доработать профиль, задайте вопрос по подписке или предложите идею.</div>`;
  return `
  <div class="card" style="padding:12px;">
    <div class="chat-wrap" id="chatScroll">${bubbles}</div>
  </div>
  <div class="section-pad" style="display:flex;gap:8px;align-items:flex-end;">
    <textarea id="chatInput" placeholder="Напишите сообщение владельцу…" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:44px;max-height:120px;"></textarea>
    <button class="btn primary" style="width:auto;padding:0 18px;height:44px;" onclick="sendChatFromMaster()">➤</button>
  </div>
  <div class="pillnote">Сообщение сохранится в приложении и сразу откроет чат с владельцем платформы в Telegram с готовым текстом — нажмите там «отправить», чтобы он получил уведомление мгновенно.</div>`;
}
async function sendChatFromMaster(){
  const input = document.getElementById('chatInput');
  const text = (input && input.value || '').trim();
  if(!text){ showToast('Введите текст сообщения'); return; }
  const m = await loadMaster(state.myMasterId);
  if(!m) return;
  const chat = await loadChat(m.id);
  chat.push({ id:uid(), from:'master', text, createdAt:Date.now(), readByMaster:true, readByOwner:false });
  await saveChat(m.id, chat);
  await addChatToIndex(m.id);

  const tgText = `💬 Сообщение от мастера «${m.name}» (BeautyHub):\n${text}`;

  // 1) Пробуем автоматическое уведомление через бота (если настроена Edge Function notify-telegram).
  let sentAuto = false;
  for(const ownerId of OWNER_TELEGRAM_IDS){
    const ok = await notifyTelegram(ownerId, tgText);
    sentAuto = sentAuto || ok;
  }

  // 2) Если автоматическая отправка не сработала (функция ещё не задеплоена) — резервный способ:
  //    открыть чат с владельцем в Telegram с готовым текстом.
  if(!sentAuto){
    const link = 'https://t.me/' + OWNER_TELEGRAM_USERNAME + '?text=' + encodeURIComponent(tgText);
    if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink){
      window.Telegram.WebApp.openTelegramLink(link);
    } else {
      window.open(link, '_blank');
    }
  }
  showToast(sentAuto ? 'Сообщение отправлено владельцу в Telegram' : 'Сообщение сохранено, чат с владельцем открыт в Telegram');
  fillMasterArea();
}
window.sendChatFromMaster = sendChatFromMaster;

function copyText(text){
  const done = ()=> showToast('Скопировано!');
  const fail = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ showToast('Не удалось скопировать, скопируйте вручную'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else { fail(); }
}
window.copyText = copyText;

async function uploadPortfolioPhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const statusEl = document.getElementById('pfUploadStatus');
  if(statusEl) statusEl.textContent = 'Загружаем…';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${state.myMasterId}/${uid()}.${ext}`;
    const { error: upErr } = await sb.storage.from('portfolios').upload(path, file, { upsert:false, contentType: file.type || 'image/jpeg' });
    if(upErr) throw upErr;
    const { data } = sb.storage.from('portfolios').getPublicUrl(path);
    const url = data && data.publicUrl;
    if(!url) throw new Error('Не удалось получить ссылку на фото');
    const m = await loadMaster(state.myMasterId);
    m.portfolio.push({id:uid(), url, caption:''});
    await saveMaster(m);
    showToast('Фото загружено');
    (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
  }catch(e){
    console.error('Portfolio upload failed', e);
    if(statusEl) statusEl.textContent = 'Не получилось загрузить файл напрямую (возможно, не настроено хранилище Supabase Storage) — воспользуйтесь полем со ссылкой ниже.';
    else showToast('Не удалось загрузить фото, используйте ссылку');
  }
}
window.uploadPortfolioPhoto = uploadPortfolioPhoto;

async function toggleSlot(t){
  const m = await loadMaster(state.myMasterId);
  m.slots = m.slots || {};
  const d = state.masterScheduleDate;
  m.slots[d] = m.slots[d] || [];
  const wasOpen = m.slots[d].includes(t);
  if(wasOpen) m.slots[d] = m.slots[d].filter(x=>x!==t);
  else m.slots[d].push(t);
  await saveMaster(m);
  (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
  if(!wasOpen) notifyWaitlist(m.id); // открыли новое время — сообщим листу ожидания
}
window.toggleSlot = toggleSlot;

function timesInRange(start, end){
  return TIMES.filter(t => t>=start && t<=end);
}
async function applyScheduleTemplate(kind){
  const m = await loadMaster(state.myMasterId);
  m.slots = m.slots || {};
  const days = Array.from({length:30},(_,i)=>todayISO(i));
  for(const d of days){
    const dow = new Date(d+'T00:00:00').getDay(); // 0=вс, 6=сб
    const isWeekend = (dow===0 || dow===6);
    if(kind==='weekdays'){
      if(!isWeekend) m.slots[d] = timesInRange('10:00','19:00');
    } else if(kind==='everyday'){
      m.slots[d] = timesInRange('10:00','19:00');
    }
  }
  await saveMaster(m);
  showToast('Расписание применено на месяц вперёд');
  (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
  notifyWaitlist(m.id); // открылось много нового времени — сообщим листу ожидания
}
window.applyScheduleTemplate = applyScheduleTemplate;

async function clearScheduleDay(){
  const m = await loadMaster(state.myMasterId);

async function renderMClients(m, isDemo, bookings){
  if(isDemo){
    return `<div class="card"><div class="empty" style="padding:20px 0">👥 Здесь появится список ваших клиентов: кто и когда записывался, заметки и рассылка — доступно после создания настоящего профиля.</div></div>`;
  }
  const notes = await sget('client-notes:'+m.id, true) || {};
  const priorityClients = await sget('priority-clients', true) || [];
  const map = new Map();
  bookings.forEach(b=>{
    const key = b.clientTelegramId || b.clientContact;
    if(!key) return;
    if(!map.has(key)) map.set(key, {key, name:b.clientName, contact:b.clientContact, telegramId:b.clientTelegramId, visits:0, lastDate:null, spent:0});
    const c = map.get(key);
    c.visits++;
    if(!c.lastDate || b.date>c.lastDate) c.lastDate = b.date;
    if(b.status==='confirmed' && isBookingPast(b)) c.spent += (b.price||0);
  });
  const list = Array.from(map.values()).sort((a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''));
  list.forEach(c=>{ c.note = notes[c.key] || ''; });
  state._clientList = list; // для доступа по индексу из onclick без экранирования спецсимволов в ключах

  const withTelegram = list.filter(c=>c.telegramId).length;
  const broadcastCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">📢 Написать всем клиентам</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Сообщение придёт от бота всем клиентам, у которых есть Telegram (сейчас это ${withTelegram} из ${list.length}). Удобно для «освободилось время завтра» или «у меня новая услуга».</div>
    <textarea id="broadcastText" placeholder="Например: Привет! Завтра в 14:00 освободилось окошко, если нужно — записывайтесь 🙂" style="min-height:70px;"></textarea>
    <button class="btn primary small" style="margin-top:8px;" onclick="broadcastToClients('${m.id}')" ${withTelegram?'':'disabled'}>Отправить всем (${withTelegram})</button>
  </div>`;

  if(!list.length){
    return broadcastCard + `<div class="card"><div class="empty" style="padding:10px 0">Пока нет клиентов — они появятся здесь после первых записей.</div></div>`;
  }

  const rows = list.map((c,i)=>`<div class="card">
    <div class="mcard-top">
      <div>
        <div class="mcard-name" style="font-size:14.5px;">${escapeHtml(c.name)} ${priorityClients.includes(c.key)?'<span class="badge active" style="margin-left:4px;">⭐ приоритетный</span>':''}</div>
        <div class="mcard-city">📞 ${escapeHtml(c.contact)}</div>
      </div>
      ${c.telegramId?`<button class="btn ghost small" style="width:auto;padding:0 12px;" onclick="messageOneClient(${i})">✉️</button>`:''}
    </div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;">🗓️ ${c.visits} визит${c.visits===1?'':c.visits<5?'а':'ов'} · последний ${fmtDate(c.lastDate)}${c.spent?` · ${c.spent}₽ потрачено`:''}</div>
    <div class="divider"></div>
    <textarea id="clientNote_${i}" placeholder="Заметка (например: аллергия на такой-то состав, любит крепкий кофе...)" style="min-height:44px;font-size:12.5px;" onblur="saveClientNote('${m.id}', ${i})">${escapeHtml(c.note)}</textarea>
  </div>`).join('');

  return broadcastCard + rows;
}

async function broadcastToClients(masterId){
  const el = document.getElementById('broadcastText');
  const text = (el && el.value || '').trim();
  if(!text){ showToast('Введите текст сообщения'); return; }
  const list = state._clientList || [];
  const targets = list.filter(c=>c.telegramId);
  if(!targets.length){ showToast('Нет клиентов с Telegram для рассылки'); return; }
  const m = await loadMaster(masterId);
  let sent = 0;
  for(const c of targets){
    const ok = await notifyTelegram(c.telegramId, `💌 Сообщение от мастера «${m.name}»:\n${text}`);
    if(ok) sent++;
  }
  showToast(`Отправлено ${sent} из ${targets.length}`);
  if(el) el.value = '';
}
window.broadcastToClients = broadcastToClients;

async function setBookingStatus(bookingId, status){
  const bookings = await loadBookings(state.myMasterId);
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  b.status = status;
  if(status==='cancelled') b.cancelledBy = 'master';
  await saveBookings(state.myMasterId, bookings);
  showToast(status==='confirmed' ? 'Запись подтверждена — клиент увидит статус в «Моих записях»' : 'Запись отменена, клиент будет уведомлён');
  fillMasterArea();

  // Мгновенное уведомление клиенту в Telegram (если у него сохранён telegramId).
  if(b.clientTelegramId){
    const m = await loadMaster(state.myMasterId);
    const masterName = m ? m.name : 'мастер';
    const text = status==='confirmed'
      ? `✅ Ваша запись подтверждена!\n${b.serviceName} · ${fmtDate(b.date)} в ${b.time}\nМастер: ${masterName}`
      : `❌ Мастер отменил вашу запись.\n${b.serviceName} · ${fmtDate(b.date)} в ${b.time}\nМастер: ${masterName}\n\nВы можете выбрать другое время в приложении.`;
    notifyTelegram(b.clientTelegramId, text);
  }
  if(status==='cancelled') notifyWaitlist(state.myMasterId); // слот освободился — сообщим листу ожидания
}
window.setBookingStatus = setBookingStatus;

async function fillAdmin(){
  if(state.isTelegramContext){
    // Real Telegram session: identity already verified by Telegram ID, no password needed.
    if(!state.isOwner) return renderAdminDenied();
    if(state.adminScreen==='trends') return renderAdminTrends();
    if(state.adminScreen==='broadcast') return renderAdminBroadcast();
    if(state.adminScreen==='chatpicker') return renderAdminChatPicker();
    if(state.adminScreen==='chatlist') return renderAdminChatList();
    if(state.adminScreen==='chat' && state.adminChatMasterId) return renderAdminChatThread(state.adminChatMasterId);
    if(state.adminEditingId) return renderAdminEdit(state.adminEditingId);
    return renderAdminDashboard();
  }
  // Opened outside Telegram (e.g. testing in a browser) — fall back to demo password.
  if(!state.adminAuthed) return renderAdminLogin();
  if(state.adminScreen==='trends') return renderAdminTrends();
  if(state.adminScreen==='broadcast') return renderAdminBroadcast();
  if(state.adminScreen==='chatpicker') return renderAdminChatPicker();
  if(state.adminScreen==='chatlist') return renderAdminChatList();
  if(state.adminScreen==='chat' && state.adminChatMasterId) return renderAdminChatThread(state.adminChatMasterId);
  if(state.adminEditingId) return renderAdminEdit(state.adminEditingId);
  return renderAdminDashboard();
}

function exportMastersCSV(){
  const masters = state._adminMastersCache || [];
  if(!masters.length){ showToast('Нет данных для экспорта'); return; }
  const headers = ['Имя','Город','Специализация','Статус подписки','Дата регистрации','Telegram ID','Рейтинг','Отзывов'];
  const rows = masters.map(m=>[
    m.name, m.city, (SPECS[m.specialization]&&SPECS[m.specialization].label)||m.specialization,
    m.subscriptionActive ? (m.isTrial?'Пробный период':'Оплачено') : 'Не оплачено',
    new Date(m.createdAt).toLocaleDateString('ru-RU'),
    m.telegramId||'', ratingOf(m).toFixed(1), m.ratingCount||0
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beautyhub-masters-${todayISO(0)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  showToast('Файл готов — проверьте загрузки браузера');
}
window.exportMastersCSV = exportMastersCSV;

/* ============ DASHBOARD С ДИНАМИКОЙ ============ */
function pluralDays(n){
  const mod10 = n%10, mod100 = n%100;
  if(mod10===1 && mod100!==11) return 'день';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'дня';
  return 'дней';
}
/* Простой бар-чарт на чистом SVG — без сторонних библиотек, чтобы не тянуть зависимости
   в отдающийся клиенту index.html. Один снимок статистики = один столбик. */
function renderTrendChart(snapshots, key, color){
  const w = 320, h = 84, pad = 3;
  const values = snapshots.map(s => Number(s[key]) || 0);
  const max = Math.max(1, ...values);
  const n = values.length;
  const barW = (w - pad*2) / n;
  const bars = values.map((v,i)=>{
    const bh = Math.max(2, (v/max) * (h - pad*2));
    const x = pad + i*barW;
    const y = h - pad - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,barW-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" style="fill:${color};"></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">${bars}</svg>`;
}
async function renderAdminTrends(){

  const recentDates = dates.slice(-30);

  for(const d of recentDates){
    const s = await sget('stats-daily:'+d, true);
    if(s) snapshots.push(s);
  }

  const back = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='dashboard'; fillAdmin();">←</button><div style="font-weight:700">Динамика</div></div>`;

    document.getElementById('content').innerHTML = back + `<div class="empty"><div class="big">📈</div>Пока нет данных для графика.<br>Первый снимок статистики уже сохранён сегодня — откройте кабинет владельца завтра, и здесь появится вторая точка.</div>`;
    return;
  }

  const last = snapshots[snapshots.length-1];
  const first = snapshots[0];
  const deltaMasters = last.totalMasters - first.totalMasters;
  const deltaMrr = last.mrr - first.mrr;
  const summary = snapshots.length>1
    ? `<div class="pillnote" style="margin:0 18px 14px;">За последние ${snapshots.length} ${pluralDays(snapshots.length)}: мастеров ${deltaMasters>=0?'+':''}${deltaMasters}, MRR ${deltaMrr>=0?'+':''}${deltaMrr}₽.</div>`
    : `<div class="pillnote" style="margin:0 18px 14px;">Пока сохранён только один снимок — график начнёт складываться со второго дня.</div>`;

  document.getElementById('content').innerHTML = back + summary + `
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">💰 MRR, оценка (₽/мес)</div>
    ${renderTrendChart(snapshots, 'mrr', 'var(--rose-deep)')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.mrr}₽</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">👥 Всего мастеров</div>
    ${renderTrendChart(snapshots, 'totalMasters', 'var(--rose)')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.totalMasters}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">🆓 На пробном периоде</div>
    ${renderTrendChart(snapshots, 'onTrial', '#C9A15A')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.onTrial}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">🔴 Ожидают оплаты (churn-риск)</div>
    ${renderTrendChart(snapshots, 'inactive', 'var(--danger)')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.inactive}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">⏳ На модерации</div>
    ${renderTrendChart(snapshots, 'pendingModeration', '#8C6BB1')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.pendingModeration}</div>
  </div>
  <div class="section-pad" style="font-size:11.5px;color:var(--ink-soft);">Один столбик = один день. Данные копятся начиная с ${fmtDate(first.date)}. Снимок сохраняется автоматически при открытии этого кабинета — для полностью автономного сбора данных (даже если вы не заходите в приложение) настройте DAILY_DIGEST_SETUP.md.</div>`;
}

async function renderAdminChatThread(masterId){
  const m = await loadMaster(masterId);
  if(!m){
    document.getElementById('content').innerHTML = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='chatlist'; fillAdmin();">←</button></div><div class="empty">Мастер не найден</div>`;
    return;
  }
  const chat = await loadChat(masterId);
  let changed = false;
  chat.forEach(msg=>{ if(msg.from==='master' && !msg.readByOwner){ msg.readByOwner = true; changed = true; } });
  if(changed) await saveChat(masterId, chat);

  const spec = SPECS[m.specialization];
  const bubbles = chat.length ? chat.map(msg=>`
    <div class="chat-msg ${msg.from==='owner'?'out':'in'}">
      <div class="chat-bubble">${escapeHtml(msg.text)}</div>
      <div class="chat-time">${new Date(msg.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') : `<div class="empty" style="padding:30px 10px;">Переписки пока нет.</div>`;

  document.getElementById('content').innerHTML = `
  <div class="backbar"><button class="backbtn" onclick="state.adminScreen='chatlist'; fillAdmin();">←</button><div style="font-weight:700">${spec.icon} ${escapeHtml(m.name)}</div></div>
  <div class="card" style="padding:12px;">
    <div class="chat-wrap">${bubbles}</div>
  </div>
  <div class="section-pad" style="display:flex;gap:8px;align-items:flex-end;">
    <textarea id="ownerChatInput" placeholder="Ответить мастеру…" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:44px;max-height:120px;"></textarea>
    <button class="btn primary" style="width:auto;padding:0 18px;height:44px;" onclick="sendChatFromOwner('${masterId}')">➤</button>
  </div>
  <div class="pillnote">Ответ сохранится в приложении — мастер увидит его во вкладке «Мастеру → Чат» и заметит бейдж с количеством новых сообщений при следующем открытии.</div>`;
}
window.renderAdminChatThread = renderAdminChatThread;

async function sendChatFromOwner(masterId){
  const input = document.getElementById('ownerChatInput');
  const text = (input && input.value || '').trim();
  if(!text){ showToast('Введите текст ответа'); return; }
  const chat = await loadChat(masterId);
  chat.push({ id:uid(), from:'owner', text, createdAt:Date.now(), readByOwner:true, readByMaster:false });
  await saveChat(masterId, chat);
  await addChatToIndex(masterId);

  // Автоматическое уведомление мастеру в Telegram (нужна задеплоенная Edge Function notify-telegram).
  // У владельца нет прямой t.me-ссылки на мастера, поэтому без бота ответ мастер увидит только при следующем входе в приложение.
  const m = await loadMaster(masterId);
  let sentAuto = false;
  if(m && m.telegramId){
    sentAuto = await notifyTelegram(m.telegramId, `💬 Ответ от владельца платформы BeautyHub:\n${text}`);
  }
  showToast(sentAuto
    ? 'Ответ отправлен мастеру в Telegram'
    : 'Ответ сохранён. Мастер увидит его в приложении (для мгновенной отправки в Telegram настройте бот-уведомления — см. TELEGRAM_BOT_SETUP.md)');
  renderAdminChatThread(masterId);
}
window.sendChatFromOwner = sendChatFromOwner;

async function adminDeleteMaster(id){

async function adminSaveEdit(id){
  const m = await loadMaster(id);
  m.name = document.getElementById('admName').value.trim() || m.name;
  m.specialization = document.getElementById('admSpec').value;
  m.city = document.getElementById('admCity').value.trim() || m.city;
  m.address = document.getElementById('admAddress').value.trim();
  m.bio = document.getElementById('admBio').value.trim();
  const subVal = document.getElementById('admSub').value;
  m.subscriptionActive = subVal==='active';
  if(m.subscriptionActive){
    if(!m.subscriptionUntil || m.isTrial) m.subscriptionUntil = todayISO(30);
    m.isTrial = false;
    m.trialEndsAt = null;
  }
  m.moderationStatus = document.getElementById('admModeration').value;
  await saveMaster(m);
  state.adminEditingId=null;
  showToast('Изменения сохранены');
  fillAdmin();
}
window.adminSaveEdit = adminSaveEdit;

/* ============ SAFETY NET ============
   Если что-то всё же упадёт при загрузке (опечатка при редактировании и т.п.),
   показываем понятную ошибку вместо белого экрана. */
window.addEventListener('error', function(e){
  const app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = `<div style="padding:60px 24px;text-align:center;font-family:sans-serif;">
      <div style="font-size:40px;margin-bottom:14px;">⚠️</div>
      <div style="font-weight:700;font-size:16px;color:#34202C;margin-bottom:8px;">Ошибка при загрузке приложения</div>
      <div style="font-size:12.5px;color:#7C6670;word-break:break-word;">${(e.message||'').toString().replace(/</g,'&lt;')}</div>
    </div>`;
  }
});

/* То же самое, но для ошибок внутри async-функций (Promise), которые никто не
   поймал — например, если экран завис на "Загрузка..." из-за необработанного
   исключения. Показываем сообщение в контенте, не давая экрану виснуть молча. */
window.addEventListener('unhandledrejection', function(e){
  console.error('Необработанная ошибка:', e.reason);
  const content = document.getElementById('content');
  const target = content || document.getElementById('app');
  if(target){
    const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    target.innerHTML = `<div style="padding:50px 24px;text-align:center;">
      <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:700;font-size:15px;color:var(--ink,#34202C);margin-bottom:8px;">Что-то пошло не так</div>
      <div style="font-size:12.5px;color:var(--ink-soft,#7C6670);word-break:break-word;">${msg.toString().replace(/</g,'&lt;')}</div>
      <div style="margin-top:16px;"><button class="btn ghost small" onclick="render()">Попробовать снова</button></div>
    </div>`;
  }
});

init();
