<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BeautyHub — площадка бьюти-мастеров</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#FCEEF6;
  --surface:#FFFFFF;
  --ink:#180F1C;
  --ink-soft:#8A8290;
  --rose:#EC1876;
  --rose-deep:#8B3EF0;
  --gold:#C89B4A;
  --teal:#1E9E63;
  --line:#F3E4EE;
  --danger:#E23D5C;
  --pink-tint:#FCE1EE;
  --accent-grad: linear-gradient(90deg, #EC1876, #8B3EF0);
  --shadow: 0 10px 28px rgba(140,30,100,0.12);
  --radius: 26px;
  --gap: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: linear-gradient(165deg, #FCDCED 0%, #F1E0F8 42%, #FCFAFD 78%);
  background-attachment: fixed;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Inter',sans-serif; font-weight:800; letter-spacing:-.5px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}

#frame{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:transparent;
  position:relative;
  padding-bottom:86px;
}

/* header */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:18px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:8px;}
.brand .mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;
}
.brand .word{font-family:'Inter',sans-serif;font-size:19px;letter-spacing:-0.3px;}
.brand .word em{font-style:italic;color:var(--rose);}
.hdr-icon{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px;}

.section-pad{padding:0 18px;}

/* chips */
.chiprow{display:flex;gap:var(--gap);overflow-x:auto;padding:2px 18px 12px;scroll-snap-type:x proximity;}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:100px;background:var(--surface);
  font-size:13px;font-weight:600;color:var(--ink-soft);border:1px solid var(--line);
  white-space:nowrap;transition:.15s;
}
.chip.active{background:var(--accent-grad);color:#fff;border-color:transparent;}

.filterbar{display:flex;gap:var(--gap);padding:0 18px 12px;}
.selectbox{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;font-size:13px;font-weight:600;color:var(--ink);
}

/* master cards */
.mcard{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin:0 18px var(--gap);display:flex;gap:var(--gap);align-items:flex-start;
}
.avatar{
  width:58px;height:58px;border-radius:16px;flex:0 0 58px;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:var(--bg);
}
.mcard-body{flex:1;min-width:0;}
.mcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.mcard-name{font-family:'Inter',sans-serif;font-size:16.5px;line-height:1.2;letter-spacing:-.2px;}
.mcard-city{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:100px;margin-top:6px;
}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
.rating-row{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12.5px;color:var(--ink-soft);}
.price-from{font-weight:700;color:var(--rose-deep);font-size:13px;}

.empty{
  text-align:center;color:var(--ink-soft);padding:60px 30px;font-size:14px;line-height:1.6;
}
.empty .big{
  font-size:30px;margin-bottom:var(--gap);width:72px;height:72px;border-radius:50%;
  background:var(--pink-tint);display:flex;align-items:center;justify-content:center;margin-left:auto;margin-right:auto;
}

/* bottom nav */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;padding:0 10px 10px;
}
.navbar-inner{
  width:100%;max-width:430px;background:var(--surface);
  box-shadow:0 -6px 24px rgba(60,20,35,0.14);
  display:flex;border-radius:24px;padding:6px;gap:4px;
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 0 8px;font-size:10.5px;font-weight:700;color:var(--ink-soft);position:relative;
  border-radius:18px;
}
.navbtn.active{color:var(--rose);}
.navbtn.active::before{
  content:'';position:absolute;inset:0;
  background:var(--pink-tint);border-radius:18px;z-index:-1;
}
.navbtn .ic{font-size:19px;position:relative;z-index:1;}
.navbtn > *{position:relative;z-index:1;}
.navdot{
  position:absolute;top:6px;right:28%;width:8px;height:8px;border-radius:50%;background:var(--danger);
  border:2px solid var(--surface);
}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:15px 18px;border-radius:100px;font-weight:700;font-size:14.5px;
  background:var(--ink);color:#fff;width:100%;
}
.btn.primary{background:linear-gradient(135deg,var(--rose),var(--rose-deep));}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn.teal{background:var(--teal);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #ecd0d1;}
.btn.small{padding:9px 14px;font-size:13px;border-radius:100px;width:auto;}
.btn:disabled{opacity:.45;}

.card{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;margin:0 18px var(--gap);
}
.field{margin-bottom:var(--gap);}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);
  background:var(--bg);font-size:14px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:flex;gap:var(--gap);}
.row2 .field{flex:1;}

.hero{
  padding:26px 18px 6px;
}
.hero h1{font-size:26px;margin:0 0 6px;line-height:1.15;letter-spacing:-.3px;}
.hero p{color:var(--ink-soft);font-size:14px;margin:0;line-height:1.5;}

.subnav{display:flex;gap:10px;padding:4px 18px 14px;overflow-x:auto;}
.subnav button{
  flex:0 0 auto;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);
}
.subnav button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;}
.badge.pending{background:#FBEFD6;color:#8A5A1F;}
.badge.confirmed{background:#DDEDE6;color:#2E6B52;}
.badge.cancelled{background:#F3D8DE;color:#8C3B52;}
.badge.active{background:#DDEDE6;color:#2E6B52;}
.badge.inactive{background:#F3D8DE;color:#8C3B52;}
.badge.demo{background:#E4DCF3;color:#4B3B7A;}
.badge.completed{background:#E7E2DC;color:#6B5C52;}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.gallery img{width:100%;height:78px;object-fit:cover;border-radius:10px;background:var(--line);}

.svc-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
.svc-row:last-child{border-bottom:none;}
.svc-name{font-weight:600;font-size:14px;}
.svc-meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.svc-price{font-weight:700;color:var(--rose-deep);}

/* city picker (главный экран выбора города) */
.city-hero-badge{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;
  margin-bottom:12px;box-shadow:var(--shadow);
}
.search-input{
  display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow);
}
.search-input .search-ic{font-size:15px;opacity:.55;flex:0 0 auto;}
.search-input input{border:none;background:none;flex:1;font-size:14.5px;color:var(--ink);outline:none;padding:0;min-width:0;}
.search-input input::placeholder{color:var(--ink-soft);}
.city-list-card{padding:6px;max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.city-row{
  display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;
  cursor:pointer;transition:background .15s;border-bottom:1px solid var(--line);
}
.city-row:last-child{border-bottom:none;}
.city-row:active{background:var(--bg);}
.city-row-pin{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;
}
.city-row-body{flex:1;min-width:0;}
.city-row-name{font-weight:600;font-size:14.5px;}
.city-row-count{color:var(--ink-soft);font-size:12px;margin-top:1px;}
.city-row-arrow{color:var(--ink-soft);font-size:15px;flex:0 0 auto;}

.slot{
  padding:8px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
  text-align:center;font-size:12.5px;font-weight:700;
}
.slot.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.slot.taken{opacity:.35;text-decoration:line-through;}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}

.review{padding:12px 0;border-bottom:1px solid var(--line);}
.review:last-child{border-bottom:none;}
.review-top{display:flex;justify-content:space-between;align-items:center;}
.review-name{font-weight:700;font-size:13.5px;}
.review-date{font-size:11px;color:var(--ink-soft);}
.review-text{font-size:13.5px;color:var(--ink);margin-top:5px;line-height:1.5;}

.backbar{display:flex;align-items:center;gap:var(--gap);padding:16px 18px 4px;}
.backbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px;}

.toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:100px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;max-width:380px;text-align:center;
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

.pillnote{
  background:#F3E7EC;border:1px solid #EAD3DC;color:var(--rose-deep);
  padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.5;margin:0 18px 14px;
}
.divider{height:1px;background:var(--line);margin:14px 0;}
.notif-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.notif-item:last-child{border-bottom:none;}
.notif-ic{width:34px;height:34px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
.notif-text{font-size:13px;line-height:1.4;}
.notif-time{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--ink-soft);font-size:13px;}
.starpick{display:flex;gap:6px;font-size:26px;}
.starpick span{cursor:pointer;color:var(--line);}
.starpick span.on{color:var(--gold);}
.link-btn{color:var(--rose-deep);font-weight:700;font-size:13px;}

/* chat */
.chat-wrap{display:flex;flex-direction:column;gap:var(--gap);max-height:52vh;overflow-y:auto;padding:2px;}
.chat-msg{display:flex;flex-direction:column;max-width:78%;}
.chat-msg.in{align-items:flex-start;align-self:flex-start;}
.chat-msg.out{align-items:flex-end;align-self:flex-end;}
.chat-bubble{padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.chat-msg.in .chat-bubble{background:var(--bg);color:var(--ink);border-bottom-left-radius:4px;}
.chat-msg.out .chat-bubble{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-bottom-right-radius:4px;}
.chat-time{font-size:10.5px;color:var(--ink-soft);margin-top:3px;padding:0 2px;}

/* master hub screen (из референса дизайна — доступно для переиспользования) */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:0 18px 4px;}
.statcard{background:var(--surface);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow);}
.statcard .n{font-size:20px;font-weight:800;}
.statcard .l{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:4px;}
.linkrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.linkic{width:42px;height:42px;border-radius:13px;background:var(--pink-tint);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 42px;}
.linkbody{flex:1;min-width:0;}
.linkname{font-size:14px;font-weight:800;}
.linkmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.linkarrow{color:#C9BEC5;font-size:18px;}
.countdot{background:var(--accent-grad);color:#fff;font-size:11px;font-weight:800;border-radius:100px;padding:3px 9px;flex:0 0 auto;}
.pinkfield{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pink-tint);border-radius:14px;padding:12px 14px;}
.pinkfield .v{font-size:12.5px;font-weight:700;color:var(--rose-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Чекбокс-переключатель (единый стиль на случай настроек вида "показывать/не показывать") */
.checkrow{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;}
.checkrow input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;
  border:1.5px solid var(--line);border-radius:7px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;position:relative;transition:.15s;
}
.checkrow input[type="checkbox"]:checked{background:var(--accent-grad);border-color:transparent;}
.checkrow input[type="checkbox"]:checked::after{
  content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.checkrow label{font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;}

/* Сегментированный переключатель периода (пилюли, активная — градиент) */
.segctrl{display:flex;gap:var(--gap);overflow-x:auto;padding:2px 18px 14px;}
.segctrl button{
  flex:0 0 auto;padding:10px 16px;border-radius:100px;font-size:13px;font-weight:700;
  background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);white-space:nowrap;
}
.segctrl button.active{background:var(--accent-grad);color:#fff;border-color:transparent;}

/* Крупная статистика по центру карточки (например "Чистая прибыль") */
.bigstat{text-align:center;padding:8px 0;}
.bigstat .n{font-size:34px;font-weight:800;font-family:'Inter',sans-serif;}
.bigstat .l{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
.bigstat .sub{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.statrow:last-child{border-bottom:none;}
.statrow .v{font-weight:700;}
.statrow .v.neg{color:var(--danger);}

/* Модальное подтверждение (например удаление профиля) — по образцу референса */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,10,20,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal-card{
  background:var(--surface);border-radius:var(--radius);padding:24px 22px;
  max-width:380px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3);
}
.modal-card h3{color:var(--danger);font-size:18px;margin:0 0 10px;font-family:'Inter',sans-serif;font-weight:800;}
.modal-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;}
</style>
</head>

<script>
/* ============ CONFIG ============ */
const OWNER_TELEGRAM_IDS = ['8078091086']; // владелец платформы — доступ к кабинету только с этого Telegram-аккаунта
const OWNER_TELEGRAM_USERNAME = 'whitespirited'; // ваш @username в Telegram (без @) — сюда попадут мастера с кнопки «Отправить квитанцию»

const NEWS_CHANNEL_USERNAME = 'beautyhub_place'; // ⚠️ ЗАПОЛНИТЕ: username новостного канала приложения (без @), если он у вас есть.

// ⚠️ Мониторинг ошибок (Sentry). Зарегистрируйтесь на sentry.io (есть бесплатный тариф),

if(SENTRY_DSN !== 'YOUR_SENTRY_DSN' && window.Sentry){

    window.Sentry.init({
      dsn: SENTRY_DSN,
      environment: 'production',
      tracesSampleRate: 0.1, // трейсим 10% запросов — достаточно для картины, не раздувает квоту бесплатного тарифа
    });

}
function reportError(err, context){

  if(window.Sentry && SENTRY_DSN !== 'YOUR_SENTRY_DSN'){

}

// клиентов) и про то, в какой юрисдикции вы работаете.
// ============================================================
const TERMS_OF_SERVICE = `Пользуясь BeautyHub, вы соглашаетесь со следующими условиями.

1. ЧТО ТАКОЕ BEAUTYHUB
BeautyHub — приложение-платформа внутри Telegram, которое соединяет клиентов и мастеров/салонов индустрии красоты. Мы не оказываем услуги красоты сами и не являемся стороной договора между клиентом и мастером — мы предоставляем инструмент для записи и учёта.

2. ОПЛАТА УСЛУГ МАСТЕРА

/* ============ STORAGE HELPERS (Supabase-backed, повторяют сигнатуру window.storage) ============ */
async function sget(key, shared=false){
  try{
    const scopeKey = shared ? key : (ownerId()+':'+key);
    const { data, error } = await sb
      .from('app_storage').select('value')
      .eq('scope_key', scopeKey).eq('shared', shared).maybeSingle();
    if(error){ console.error('sget failed:', error.message, '| code:', error.code, '| details:', error.details, '| hint:', error.hint); return null; }
    if(!data) return null;
    return data.value;
  }catch(e){ console.error('sget threw:', e && e.message ? e.message : e); return null; }
}
async function sset(key, value, shared=false){
  try{
    const scopeKey = shared ? key : (ownerId()+':'+key);
    const { error } = await sb.from('app_storage')
      .upsert({ scope_key:scopeKey, shared, value, updated_at:new Date().toISOString() }, { onConflict:'scope_key,shared' });
    if(error) console.error('sset failed:', error.message, '| code:', error.code, '| details:', error.details, '| hint:', error.hint);
  }catch(e){ console.error('sset threw:', e && e.message ? e.message : e); }
}
async function slist(prefix, shared=false){
  try{
    const base = shared ? '' : (ownerId()+':');
    const fullPrefix = base + (prefix||'');
    const { data, error } = await sb.from('app_storage')
      .select('scope_key').eq('shared', shared).like('scope_key', fullPrefix+'%');
    if(error || !data) return [];
    return data.map(r => shared ? r.scope_key : r.scope_key.slice(base.length));
  }catch(e){ return []; }
}

function occupiedTimesForBooking(bk, bufferMinutes){
  const need = Math.max(1, Math.ceil(((bk.duration||60) + (bufferMinutes||0))/60));
  const idx = TIMES.indexOf(bk.time);
  if(idx===-1) return [bk.time];
  return TIMES.slice(idx, idx+need);
}

  if(!b || !b.date || !b.time) return false;
  const dt = new Date(`${b.date}T${b.time}`);
  if(isNaN(dt.getTime())) return false;
  return dt.getTime() < Date.now();
}

/* Проверяет, не истёк ли пробный период мастера. Если да — один раз деактивирует профиль
   (он пропадает из каталога, как при обычной неоплаченной подписке) и отправляет мастеру
   уведомление с просьбой оплатить подписку: сообщением в чат приложения и — если настроена
   Edge Function notify-telegram — сообщением от бота в Telegram.
   Вызывается автоматически из loadMaster/loadAllMasters, поэтому отдельно её дёргать не нужно. */
async function checkTrialExpiry(m){
  if(!SUBSCRIPTION_ENABLED) return m; // подписка временно отключена — никого не деактивируем по истечении триала
  if(!m || !m.isTrial || !m.trialEndsAt) return m;
  if(Date.now() < m.trialEndsAt) return m;

  const alreadyHandled = !!m.trialExpiredNotifiedAt;
  m.subscriptionActive = false;
  m.isTrial = false;
  m.trialEndsAt = null;
  m.trialExpiredNotifiedAt = m.trialExpiredNotifiedAt || Date.now();
  await saveMaster(m);

  if(!alreadyHandled){
    try{
      const chat = await loadChat(m.id);
      chat.push({
        id: uid(), from:'owner',
        text: '⏳ Пробный период закончился, профиль временно скрыт из каталога. Оплатите подписку во вкладке «Мастеру → Профиль» — как только оплата подтвердится, клиенты снова смогут вас найти.',
        createdAt: Date.now(), readByOwner:true, readByMaster:false
      });
      await saveChat(m.id, chat);
      await addChatToIndex(m.id);
      if(m.telegramId){
        await notifyTelegram(m.telegramId,
          `⏳ Пробный период BeautyHub закончился.\nВаш профиль «${m.name}» временно скрыт из каталога.\nОплатите подписку в приложении (вкладка «Мастеру»), чтобы клиенты снова могли вас найти и записаться.`);
      }
    }catch(e){
      console.warn('checkTrialExpiry notify failed:', e);
    }
  }
  return m;
}

/* ============ ПРЯМОЙ ЧАТ КЛИЕНТ ↔ МАСТЕР (до записи и после) ============
   Отдельно от чата клиента с владельцем (visitor-chat) и мастера с владельцем (chat:<masterId>).
   Ключ треда — masterId + clientKey (telegramId клиента), чтобы у каждой пары мастер/клиент
   была своя переписка. */
async function loadClientMasterChat(masterId, clientKey){ return await sget('cm-chat:'+masterId+':'+clientKey, true) || []; }
async function saveClientMasterChat(masterId, clientKey, arr){ await sset('cm-chat:'+masterId+':'+clientKey, arr, true); }
async function addClientMasterChatToIndex(masterId, clientKey){
  const ids = await sget('cm-chat-index:'+masterId, true) || [];
  if(!ids.includes(clientKey)){ ids.push(clientKey); await sset('cm-chat-index:'+masterId, ids, true); }
}

async function renderClientMasterChat(m){
  if(!state.tgUser){
    return `<div class="card"><div class="empty" style="padding:20px 0">💬 Чат доступен при открытии приложения через Telegram.</div></div>`;
  }
  const clientKey = String(state.tgUser.id);
  const chat = await loadClientMasterChat(m.id, clientKey);
  let changed = false;
  chat.forEach(msg=>{ if(msg.from==='master' && !msg.readByClient){ msg.readByClient = true; changed = true; } });
  if(changed) await saveClientMasterChat(m.id, clientKey, chat);

  const bubbles = chat.length ? chat.map(msg=>`
    <div class="chat-msg ${msg.from==='client'?'out':'in'}">
      <div class="chat-bubble">${escapeHtml(msg.text)}</div>
      <div class="chat-time">${new Date(msg.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') : `<div class="empty" style="padding:30px 10px;">💬 Есть вопрос до записи — например, про свободное время или материалы? Напишите мастеру напрямую.</div>`;

  return `
  <div class="card" style="padding:12px;">
    <div class="chat-wrap">${bubbles}</div>
  </div>
  <div class="section-pad" style="display:flex;gap:8px;align-items:flex-end;">
    <textarea id="cmChatInput" placeholder="Написать мастеру…" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:44px;max-height:120px;"></textarea>
    <button class="btn primary" style="width:auto;padding:0 18px;height:44px;" onclick="sendClientMasterChat('${m.id}')">➤</button>
  </div>`;
}

async function sendClientMasterChat(masterId){
  const input = document.getElementById('cmChatInput');
  const text = (input && input.value || '').trim();
  if(!text){ showToast('Введите сообщение'); return; }
  if(!state.tgUser){ showToast('Чат доступен только через Telegram'); return; }

  // Простая защита от спама: не больше 15 сообщений за 5 минут с этого аккаунта
  const recentMsgs = (await sget('my-chat-attempts', false) || []).filter(ts => Date.now()-ts < 5*60*1000);
  if(recentMsgs.length >= 15){
    showToast('Слишком много сообщений подряд. Попробуйте немного позже.');
    return;
  }

  const clientKey = String(state.tgUser.id);
  const chat = await loadClientMasterChat(masterId, clientKey);
  chat.push({
    id: uid(), from:'client', text, createdAt:Date.now(), readByClient:true, readByMaster:false,
    clientName: state.clientName || [state.tgUser.first_name,state.tgUser.last_name].filter(Boolean).join(' ') || 'Клиент'
  });
  await saveClientMasterChat(masterId, clientKey, chat);
  await addClientMasterChatToIndex(masterId, clientKey);

  recentMsgs.push(Date.now());
  await sset('my-chat-attempts', recentMsgs, false);

  const m = await loadMaster(masterId);
  if(m && m.telegramId){
    const who = chat[chat.length-1].clientName;
    await notifyTelegram(m.telegramId, `💬 Сообщение от клиента ${who}:\n${text}\n\nОтветить можно во вкладке «Мастеру → Клиенты».`);
  }
  showToast('Сообщение отправлено');
  fillMasterDetail();
}
window.sendClientMasterChat = sendClientMasterChat;

/* Возвращает актуальные баннеры для аудитории ('clients' | 'masters'), с учётом дат
   действия и того, что человек уже закрыл этот баннер у себя (не показываем повторно). */
async function getActiveBanners(audience){
  const all = await loadBanners();
  const today = todayISO(0);
  const dismissed = await sget('dismissed-banners', false) || [];
  return all.filter(b=>
    b.active !== false &&
    (b.audience==='all' || b.audience===audience) &&
    (!b.startDate || b.startDate<=today) &&
    (!b.endDate || b.endDate>=today) &&
    !dismissed.includes(b.id)
  );
}

/* Счётчик просмотров профиля для мини-аналитики мастера. Не считаем собственные заходы мастера
   на свою страницу и заходы владельца в режиме «просмотр как клиент» — иначе цифры будут врать. */
async function trackProfileView(m){
  try{
    if(!m || m.isDemo) return;
    if(state.myMasterId === m.id) return;
    if(state._adminPreviewReturn) return;
    const key = 'profile-views:'+m.id;
    const cur = await sget(key, true) || 0;
    await sset(key, cur+1, true);

    // Источник перехода — по какой ссылке клиент попал в приложение в этой сессии
    const sp = state._startParam || '';
    const source = sp.startsWith('book_'+m.id) ? 'link'
      : (sp.startsWith('ref_') || sp.startsWith('mref_')) ? 'referral'
      : 'catalog';
    const srcKey = 'profile-views-sources:'+m.id;
    const sources = await sget(srcKey, true) || {};
    sources[source] = (sources[source]||0) + 1;
    await sset(srcKey, sources, true);
  }catch(e){ /* тихо игнорируем — счётчик не критичен для работы приложения */ }
}

/* Уведомляет всех, кто стоит в листе ожидания мастера, что появилось новое свободное время
   (мастер открыл слоты или у кого-то отменилась запись), и очищает список — кто не успеет
   записаться, всегда может встать в лист ожидания заново. */
async function notifyWaitlist(masterId){
  try{
    const list = await loadWaitlist(masterId);
    if(!list.length) return;
    const m = await loadMaster(masterId);
    const text = `🔔 У мастера «${m?m.name:''}» появилось новое свободное время!\nОткройте приложение и запишитесь — обычно разбирают быстро.`;
    for(const w of list){
      if(w.clientTelegramId) await notifyTelegram(w.clientTelegramId, text);
    }
    await saveWaitlist(masterId, []);
  }catch(e){ console.warn('notifyWaitlist failed:', e); }
}

/* Автоматическая отправка уведомления через Telegram-бота.
   Вызывает Supabase Edge Function 'notify-telegram', которая на сервере
   (там, где безопасно хранить секретный токен бота) шлёт сообщение через Bot API.
   Если функция ещё не задеплоена — просто возвращает false, вызывающий код
   сам решает, что делать дальше (например, показать резервный способ отправки). */
async function notifyTelegram(chatId, text){
  if(!sb || !chatId) return false;
  try{
    const { data, error } = await sb.functions.invoke('notify-telegram', { body: { chatId: String(chatId), text } });
    if(error){ console.warn('notifyTelegram: функция недоступна или вернула ошибку —', error.message||error); return false; }
    return !!(data && data.ok);
  }catch(e){
    console.warn('notifyTelegram threw:', e && e.message ? e.message : e);
    return false;
  }
}

async function sdelete(key, shared=false){
  try{
    const scopeKey = shared ? key : (ownerId()+':'+key);
    await sb.from('app_storage').delete().eq('scope_key', scopeKey).eq('shared', shared);
  }catch(e){ /* row may not exist */ }

/* Резервный способ достать start_param: некоторые версии Telegram (особенно Desktop/Web)
   в момент самого первого рендера ещё не успевают заполнить initDataUnsafe.start_param,
   зато параметр уже есть в адресной строке как #tgWebAppStartParam=... или ?startapp=... —
   на всякий случай проверяем оба места. */
function readStartParamFromLocation(){
  try{
    const hash = (window.location.hash || '').replace(/^#/, '');
    const search = (window.location.search || '').replace(/^\?/, '');
    const params = new URLSearchParams(hash + '&' + search);
    return params.get('tgWebAppStartParam') || params.get('startapp') || null;
  }catch(e){ return null; }
}

async function detectTelegramIdentity(){
  try{
    const tg = window.Telegram && window.Telegram.WebApp;
    if(tg && tg.initData && tg.initData.length > 0){
      tg.ready(); tg.expand();
      state.isTelegramContext = true;
      state.tgUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
      const idStr = state.tgUser ? String(state.tgUser.id) : null;
      const isMainOwner = !!idStr && OWNER_TELEGRAM_IDS.includes(idStr);
      let supportRole = null;
      if(!isMainOwner && idStr){
        const adminRoles = await sget('admin-roles', true) || {};
        supportRole = adminRoles[idStr] || null;
      }
      state.isOwner = isMainOwner || !!supportRole;
      state.adminRole = isMainOwner ? 'owner' : supportRole; // 'owner' | 'support' | null
      // Ссылка-приглашение мастера: t.me/<bot>?startapp=book_<masterId> -> Telegram кладёт это в start_param.
      state._startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || readStartParamFromLocation() || null;
    } else {
      state.isTelegramContext = false;
      state.isOwner = false;
      state.adminRole = null;
      // Для тестирования в обычном браузере: ?startapp=book_<id> в адресной строке
      const urlParam = new URLSearchParams(window.location.search).get('startapp');
      state._startParam = urlParam || readStartParamFromLocation() || null;
    }
  }catch(e){
    state.isTelegramContext = false;
    state.isOwner = false;
    state.adminRole = null;
    state._startParam = null;
  }
}

async function init(){
  if(SUPABASE_INIT_ERROR){
    renderSetupError(SUPABASE_INIT_ERROR);
    return;
  }
  await detectTelegramIdentity();
  await seedIfEmpty();
  state.myMasterId = await sget('my-master-id', false);
  if(state.myMasterId){ state.myMaster = await loadMaster(state.myMasterId); }
  state.userRole = await sget('my-role', false) || null;
  if(state.myMasterId && state.userRole !== 'master'){
    // Если у устройства уже есть профиль мастера, роль всегда «мастер», даже если раньше выбрали иначе.
    state.userRole = 'master';
    await sset('my-role', 'master', false);
  }
  state.clientName = await sget('my-client-name', false) || '';
  state.clientContact = await sget('my-client-contact', false) || '';
  state.favorites = await sget('my-favorites', false) || [];
  // Prefill client name from Telegram profile if available and not set yet
  if(state.isTelegramContext && state.tgUser && !state.clientName){
    const full = [state.tgUser.first_name, state.tgUser.last_name].filter(Boolean).join(' ');
    if(full) state.clientName = full;
  }
  // Пришли по персональной ссылке мастера (t.me/бот?startapp=book_<id>) — сразу открываем его страницу записи.
  if(state._startParam && state._startParam.startsWith('book_')){
    const linkedMasterId = state._startParam.slice('book_'.length);
    const linkedMaster = await loadMaster(linkedMasterId);
    if(linkedMaster){
      if(!state.userRole){ state.userRole = 'client'; await sset('my-role', 'client', false); }
      state.view = 'catalog';
      state.selectedMasterId = linkedMasterId;
      state.masterDetailTab = 'book';
    } else {
      setTimeout(()=>showToast('Не удалось найти мастера по ссылке — возможно, профиль удалён'), 300);
    }
  }
  // Пришли по реферальной ссылке клиента (t.me/бот?startapp=ref_<clientKey>) — засчитываем приглашение.
  if(state._startParam && state._startParam.startsWith('ref_')){
    try{
      const refKey = state._startParam.slice('ref_'.length);
      const myKey = ownerId();
      if(refKey && refKey !== myKey){
        const alreadyReferred = await sget('my-referred-by', false);
        if(!alreadyReferred){
          await sset('my-referred-by', refKey, false);
          const refs = await sget('referrals:'+refKey, true) || [];
          if(!refs.includes(myKey)){ refs.push(myKey); await sset('referrals:'+refKey, refs, true); }
          const priority = await sget('priority-clients', true) || [];
          let changed = false;
          if(!priority.includes(myKey)){ priority.push(myKey); changed = true; }
          if(!priority.includes(refKey)){ priority.push(refKey); changed = true; }
          if(changed) await sset('priority-clients', priority, true);
          if(!state.userRole){ state.userRole = 'client'; await sset('my-role', 'client', false); }
          setTimeout(()=>showToast('Вы пришли по приглашению — вы и ваша подруга теперь приоритетные клиенты ⭐'), 300);
        }
      }
    }catch(e){ console.warn('referral handling failed:', e); }
  }
  // Пришли по реферальной ссылке мастера (t.me/бот?startapp=mref_<masterId>) — запоминаем,
  // кто пригласил, чтобы начислить бонус обоим при одобрении новой анкеты модератором.
  if(state._startParam && state._startParam.startsWith('mref_')){
    try{
      const refMasterId = state._startParam.slice('mref_'.length);
      if(refMasterId && refMasterId !== state.myMasterId){
        const already = await sget('my-referred-by-master', false);
        if(!already){
          await sset('my-referred-by-master', refMasterId, false);
          setTimeout(()=>showToast('Вы пришли по приглашению коллеги — разместите профиль и оба получите бонусные дни доступа 🎁'), 300);
        }
      }
    }catch(e){ console.warn('master referral handling failed:', e); }
  }
  // Вернулись после оплаты подписки через ЮKassa (t.me/бот?startapp=paid_<masterId>) — вебхук
  // обычно успевает активировать подписку за секунды, но на всякий случай подсказываем обновить.
  if(state._startParam && state._startParam.startsWith('paid_')){
    setTimeout(()=>showToast('Проверяем статус оплаты… Если подписка не появилась сразу — подождите немного и нажмите «Обновить статус оплаты»'), 300);
  }
  trackVisit(); // не блокируем рендер ожиданием записи в историю заходов
  state.loading = false;
  render();
}

/* ============ ИСТОРИЯ ЗАХОДОВ (для владельца) ============
   Фиксируем каждого уникального пользователя Telegram, который открыл приложение —
   имя, username, роль на момент захода, когда впервые и когда в последний раз заходил,
   сколько раз всего. Владелец может увидеть список и перейти в личку в Telegram. */
async function trackVisit(){
  try{
    if(!state.tgUser) return; // вне Telegram (тест в браузере) — нечего отслеживать
    const id = String(state.tgUser.id);
    const key = 'visitor:'+id;
    const existing = await sget(key, true);
    const role = state.isOwner ? 'owner' : (state.userRole || 'unknown');
    const record = {
      id,
      firstName: state.tgUser.first_name || '',
      lastName: state.tgUser.last_name || '',
      username: state.tgUser.username || null,
      role,
      firstSeen: existing ? existing.firstSeen : Date.now(),
      lastSeen: Date.now(),
      visitCount: existing ? (existing.visitCount||0) + 1 : 1,
    };
    await sset(key, record, true);
    const idx = await sget('visitors-index', true) || [];
    if(!idx.includes(id)){ idx.push(id); await sset('visitors-index', idx, true); }
  }catch(e){ console.warn('trackVisit failed:', e); }
}

/* Ловит любую ошибку внутри асинхронных экранов и показывает её текстом
   вместо того, чтобы экран молча завис на "Загрузка…" навсегда. */
async function safeFill(fn){
  try{
    await fn();
  }catch(e){
    console.error('Ошибка при отрисовке экрана:', e);
    const content = document.getElementById('content');
    if(content){

        <div style="font-size:12.5px;color:var(--ink-soft);word-break:break-word;">${escapeHtml((e && e.message) ? e.message : String(e))}</div>
        <div style="margin-top:16px;"><button class="btn ghost small" onclick="render()">Попробовать снова</button></div>

/* --- STEP 1: choose city --- */
async function renderCityStep(masters){
  const bannersHtml = renderBannersHtml(await getActiveBanners('clients'));
  const counts = {};
  masters.forEach(m=>{ counts[m.city] = (counts[m.city]||0)+1; });
  const allCities = Object.keys(counts);
  const isLong = allCities.length > 8;

  // Короткий список — оставляем по популярности (как раньше), длинный — сортируем по алфавиту,
  // чтобы город было легче найти взглядом, и добавляем поиск + быстрые чипы самых частых городов.
  const popular = allCities.slice().sort((a,b)=>counts[b]-counts[a]).slice(0,6);
  const displayCities = isLong
    ? allCities.slice().sort((a,b)=>a.localeCompare(b,'ru'))
    : allCities.slice().sort((a,b)=>counts[b]-counts[a]);

  const hero = `<div class="hero">
    <div class="city-hero-badge">📍</div>
    <h1>В каком вы городе?</h1>
    <p>Покажем мастеров маникюра, бровей, ресниц, тату и пирсинга рядом с вами${masters.length?` — сейчас на платформе ${masters.length} мастер${masters.length===1?'':masters.length<5?'а':'ов'}`:''}.</p>
  </div>`;

  const searchBox = isLong ? `<div class="section-pad">
    <div class="search-input">
      <span class="search-ic">🔍</span>
      <input id="citySearch" placeholder="Начните вводить город…" autocomplete="off" oninput="filterCityList(this.value)">
    </div>
  </div>` : '';

  const popularChips = isLong && popular.length>1 ? `<div class="chiprow" style="padding-top:10px;">
    ${popular.map(c=>`<button class="chip" onclick="chooseCity('${escapeHtml(c).replace(/'/g,"\\'")}')">📍 ${escapeHtml(c)}</button>`).join('')}
  </div>` : '';

  const cityRows = displayCities.map(c=>`<div class="city-row" data-city="${escapeHtml(c.toLowerCase())}" onclick="chooseCity('${escapeHtml(c).replace(/'/g,"\\'")}')">
      <div class="city-row-pin">📍</div>
      <div class="city-row-body">
        <div class="city-row-name">${escapeHtml(c)}</div>
        <div class="city-row-count">${counts[c]} мастер${counts[c]===1?'':counts[c]<5?'а':'ов'}</div>
      </div>
      <div class="city-row-arrow">→</div>
    </div>`).join('');

  const cityList = displayCities.length ? `<div class="card city-list-card">
      <div id="cityListInner">${cityRows}</div>
      <div id="cityListEmpty" class="empty" style="display:none;padding:24px 10px;">Ничего не нашлось — попробуйте ввести город вручную ниже.</div>
    </div>` : `<div class="empty" style="padding:20px 30px"><div class="big">🏙️</div>Мастеров пока нет ни в одном городе.</div>`;

function filterCityList(q){
  const query = q.trim().toLowerCase();
  const rows = document.querySelectorAll('#cityListInner .city-row');
  let visible = 0;
  rows.forEach(el=>{
    const match = !query || el.dataset.city.includes(query);
    el.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const emptyEl = document.getElementById('cityListEmpty');
  if(emptyEl) emptyEl.style.display = (query && visible===0) ? 'block' : 'none';
}

function renderListStep(masters){
  const inCity = masters.filter(m=>m.city===state.filters.city);
  let list = inCity.filter(m=> state.filters.spec==='all' || m.specialization===state.filters.spec);
  if(state.filters.minRating) list = list.filter(m=>ratingOf(m) >= state.filters.minRating);
  if(state.filters.maxPrice) list = list.filter(m=>{ const pf=priceFrom(m); return pf==null || pf<=state.filters.maxPrice; });
  if(state.filters.availableSoon) list = list.filter(hasSlotsSoon);

  if(state.filters.sort==='rating') list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || ratingOf(b)-ratingOf(a));
  else if(state.filters.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  else if(state.filters.sort==='price') list.sort((a,b)=>(priceFrom(a)||0)-(priceFrom(b)||0));

  const cityBar = `<div class="backbar"><button class="backbtn" onclick="backToSpecs()">←</button><div style="font-weight:700">📍 ${escapeHtml(state.filters.city)} · ${state.filters.spec==='all'?'Все специалисты':SPECS[state.filters.spec].label}</div></div>`;

    <button class="chip ${state.filters.spec==='all'?'active':''}" onclick="chooseSpec('all')">Все</button>

  </div>`;

  const filterbar = `<div class="filterbar">
    <select class="selectbox" onchange="setSort(this.value)">
      <option value="rating" ${state.filters.sort==='rating'?'selected':''}>По рейтингу</option>
      <option value="price" ${state.filters.sort==='price'?'selected':''}>По цене</option>
      <option value="name" ${state.filters.sort==='name'?'selected':''}>По имени</option>
    </select>

  </div>`;

  const filterbar2 = `<div class="chiprow" style="padding-top:0;">
    <button class="chip ${state.filters.minRating>=4?'active':''}" onclick="toggleMinRating()">★ 4+</button>

let _mastersMapInstance = null;
function renderMastersMap(masters){
  const el = document.getElementById('mastersMap');
  if(!el || typeof L === 'undefined') return;
  if(_mastersMapInstance){ _mastersMapInstance.remove(); _mastersMapInstance = null; }
  const center = [masters[0].lat, masters[0].lng];
  const map = L.map('mastersMap').setView(center, 12);
  _mastersMapInstance = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
  masters.forEach(m=>{
    const spec = SPECS[m.specialization];
    const marker = L.marker([m.lat, m.lng]).addTo(map);
    const pf = priceFrom(m);
    const avgR = ratingOf(m);
    marker.bindPopup(`<b>${spec?spec.icon:''} ${escapeHtml(m.name)}</b><br>${avgR?avgR.toFixed(1)+' ★':'нет оценок'}${pf!=null?' · от '+pf+'₽':''}<br><a href="#" onclick="openMaster('${m.id}');return false;">Открыть профиль →</a>`);
  });
  if(masters.length>1){
    const bounds = L.latLngBounds(masters.map(m=>[m.lat,m.lng]));
    map.fitBounds(bounds, {padding:[30,30]});
  }
}

async function fillMasterDetail(){
  const m = await loadMaster(state.selectedMasterId);
  if(!m){ document.getElementById('content').innerHTML = `<div class="empty">Мастер не найден</div>`; return; }
  trackProfileView(m); // не блокируем рендер ожиданием записи счётчика
  const reviews = await loadReviews(m.id);
  const bookings = await loadBookings(m.id);
  const waitlist = await loadWaitlist(m.id);
  const spec = SPECS[m.specialization];
  const avg = ratingOf(m);

  // Право на отзыв: у клиента должна быть ЗАВЕРШЁННАЯ (подтверждённая и прошедшая по дате)
  // запись именно к этому мастеру, за которую он ещё не оставлял отзыв.
  const myBookingRefs = (await sget('my-client-bookings', false) || []).filter(r=>r.masterId===m.id);
  const today = todayISO(0);
  const reviewedBookingIds = new Set(reviews.filter(r=>r.bookingId).map(r=>r.bookingId));
  const eligibleBookings = [];
  for(const ref of myBookingRefs){
    const bk = bookings.find(b=>b.id===ref.bookingId);
    if(bk && bk.status==='confirmed' && bk.date<=today && !reviewedBookingIds.has(bk.id)){
      eligibleBookings.push(bk);
    }
  }
  state._eligibleReviewBookings = eligibleBookings;

  const back = state._adminPreviewReturn
    ? `<div class="backbar"><button class="backbtn" onclick="backFromAdminPreview()">←</button><div style="font-weight:700">${escapeHtml(m.name)}</div></div>

      <div class="rating-row" style="margin-top:6px;"><span class="stars">${starsStr(avg)}</span> ${avg?avg.toFixed(1):'нет оценок'} ${m.ratingCount?`· ${m.ratingCount} отзыв.`:''}</div>

/* Сжимает изображение перед загрузкой в Supabase Storage — уменьшает до maxDim по большей
   стороне и пережимает в JPEG с заданным качеством. Экономит место на бесплатном тарифе
   и ускоряет загрузку для клиента. Если сжатие почему-то не удалось — используем оригинал. */
async function compressImage(file, maxDim=1280, quality=0.8){
  try{
    if(!file.type || !file.type.startsWith('image/')) return file;
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if(width>maxDim || height>maxDim){
      const scale = maxDim / Math.max(width, height);
      width = Math.round(width*scale);
      height = Math.round(height*scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, width, height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    if(!blob || blob.size >= file.size) return file; // сжатое не меньше — не рискуем, берём оригинал
    return new File([blob], (file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'});
  }catch(e){
    console.warn('compressImage failed, using original file:', e);
    return file;
  }
}

async function uploadReviewPhoto(input){
  const file0 = input.files && input.files[0];
  if(!file0) return;
  const statusEl = document.getElementById('rvUploadStatus');
  if(statusEl) statusEl.textContent = 'Сжимаем и загружаем…';
  try{
    const file = await compressImage(file0);
    const ext = 'jpg';
    const path = `reviews/${uid()}.${ext}`;
    const { error: upErr } = await sb.storage.from('portfolios').upload(path, file, { upsert:false, contentType: file.type || 'image/jpeg' });
    if(upErr) throw upErr;
    const { data } = sb.storage.from('portfolios').getPublicUrl(path);
    const url = data && data.publicUrl;
    if(!url) throw new Error('Не удалось получить ссылку на фото');
    state._pendingReviewPhoto = url;
    if(statusEl) statusEl.textContent = 'Фото добавлено ✓';
    fillMasterDetail();
  }catch(e){
    console.error('Review photo upload failed', e);
    if(statusEl) statusEl.textContent = 'Не получилось загрузить фото (возможно, не настроено хранилище Supabase Storage) — можно оставить отзыв без фото.';
  }
}

/* ============ ПОДАРОЧНЫЙ СЕРТИФИКАТ ============
   Оплата — напрямую мастеру (как предоплата за запись), платформа деньги не принимает.
   Покупатель создаёт сертификат с кодом → переводит деньги мастеру → мастер подтверждает
   получение → сертификат становится активным → получатель вводит код при записи. */
function genCertCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function createGiftCertificate(masterId){
  const amount = Number(document.getElementById('giftAmount').value);
  const recipient = document.getElementById('giftRecipient').value.trim();
  const message = document.getElementById('giftMessage').value.trim();
  if(!amount || amount<500 || !recipient){ showToast('Укажите сумму (от 500₽) и имя получателя'); return; }
  const m = await loadMaster(masterId);
  if(!m) return;
  const code = genCertCode();
  const cert = {
    id: uid(), code, amount, recipientName: recipient, message: message||null,
    buyerName: state.clientName || (state.tgUser?[state.tgUser.first_name,state.tgUser.last_name].filter(Boolean).join(' '):'') || 'Покупатель',
    buyerTelegramId: state.tgUser ? String(state.tgUser.id) : null,
    status: 'pending_payment', createdAt: Date.now(), redeemedAt:null, redeemedBookingId:null
  };
  const certs = await sget('gift-certificates:'+masterId, true) || [];
  certs.push(cert);
  await sset('gift-certificates:'+masterId, certs, true);

  if(m.telegramId){
    notifyTelegram(m.telegramId, `🎁 Новый подарочный сертификат!\nКод: ${code}\nСумма: ${amount}₽\nДля: ${recipient}\n\nПодтвердите получение оплаты во вкладке «Мастеру → Профиль».`);
  }
  state._giftCertOpen = false;
  showToast(`Сертификат создан! Код: ${code}`);
  document.getElementById('content').innerHTML = `<div class="card" style="text-align:center;padding:30px 18px;">
    <div style="font-size:30px;">🎁</div>
    <div style="font-weight:800;font-size:22px;margin-top:10px;letter-spacing:2px;">${code}</div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;">Сохраните этот код — переведите ${amount}₽ мастеру напрямую (реквизиты — как для предоплаты, уточните у мастера в чате) и сообщите код. После подтверждения мастером сертификат станет активным.</div>
    <button class="btn ghost small" style="margin-top:16px;" onclick="fillMasterDetail()">Готово</button>
  </div>`;
}

  const certs = await sget('gift-certificates:'+masterId, true) || [];

  cert.status = 'active';
  await sset('gift-certificates:'+masterId, certs, true);

/* Клиент дошёл до выбора времени, но мог не отправить заявку — фиксируем это,
   чтобы мастер видел «был интерес, но не записались» и мог сам написать. */
async function trackAbandonedView(){
  try{
    const m = await loadMaster(state.selectedMasterId);
    if(!m) return;
    const service = m.services.find(s=>s.id===state.booking.serviceId);
    if(!service || !state.booking.date || !state.booking.time) return;
    const key = 'abandoned-views:'+m.id;
    const list = await sget(key, true) || [];
    const clientKey = ownerId();
    // Не дублируем запись, если тот же клиент уже отмечен по этой дате/времени недавно
    const existing = list.find(v=>v.clientKey===clientKey && v.date===state.booking.date && v.time===state.booking.time && !v.converted);
    if(existing){ existing.viewedAt = Date.now(); }
    else {
      list.push({
        id: uid(), clientKey,
        clientName: state.clientName || (state.tgUser?[state.tgUser.first_name,state.tgUser.last_name].filter(Boolean).join(' '):'') || 'Клиент',
        clientTelegramId: state.tgUser ? String(state.tgUser.id) : null,
        serviceName: service.name, date: state.booking.date, time: state.booking.time,
        viewedAt: Date.now(), converted: false
      });
    }
    while(list.length>200) list.shift();
    await sset(key, list, true);
  }catch(e){ console.warn('trackAbandonedView failed:', e); }
}

async function submitBooking(masterId){
  const name = document.getElementById('bkName').value.trim();
  const contact = document.getElementById('bkContact').value.trim();
  if(!name || !contact){ showToast('Укажите имя и контакт для связи'); return; }

  // Простая защита от спама: не больше 5 заявок за 10 минут с этого устройства/аккаунта
  const recentSubmits = (await sget('my-booking-attempts', false) || []).filter(ts => Date.now()-ts < 10*60*1000);
  if(recentSubmits.length >= 5){
    showToast('Слишком много заявок подряд. Попробуйте немного позже.');
    return;
  }

  await sset('my-client-name', name, false);
  await sset('my-client-contact', contact, false);
  state.clientName=name; state.clientContact=contact;

  const m = await loadMaster(masterId);
  const service = m.services.find(s=>s.id===state.booking.serviceId);
  const extraServiceIds = state.booking.extraServiceIds || [];
  const extraServicesObj = m.services.filter(s=>extraServiceIds.includes(s.id) && s.id!==service.id);
  const combinedPrice = service.price + extraServicesObj.reduce((s,x)=>s+x.price,0);
  const combinedDuration = (service.duration||60) + extraServicesObj.reduce((s,x)=>s+(x.duration||60),0);
  const combinedName = [service.name, ...extraServicesObj.map(x=>x.name)].join(' + ');

  const staffId = state.booking.staffId || null;
  const staffMember = staffId ? (m.staff||[]).find(s=>s.id===staffId) : null;

  // Перечитываем самые свежие записи прямо перед сохранением, чтобы минимизировать
  // окно гонки, если кто-то другой записался на этот же слот почти одновременно.
  const bookings = await loadBookings(masterId);
  const wantTimes = occupiedTimesForBooking({time:state.booking.time, duration:combinedDuration}, m.bufferMinutes);
  const alreadyTaken = bookings.some(b=>b.status!=='cancelled' && b.date===state.booking.date && (b.staffId||null)===staffId && occupiedTimesForBooking(b, m.bufferMinutes).some(t=>wantTimes.includes(t)));
  if(alreadyTaken){
    showToast('Увы, это время только что заняли. Выберите другое.');
    state.booking.time = null;
    fillMasterDetail();
    return;
  }

  const depositAmount = Number(m.depositRequired) > 0 ? Number(m.depositRequired) : 0;
  const clientHealthNotes = await sget('my-health-notes', false) || '';
  const booking = {
    id:uid(), masterId, serviceId:service.id, serviceName:combinedName, price:combinedPrice,
    duration: combinedDuration,
    staffId, staffName: staffMember ? staffMember.name : null,
    extraServices: extraServicesObj.map(x=>({id:x.id, name:x.name, price:x.price, duration:x.duration||60})),
    date:state.booking.date, time:state.booking.time,
    clientName:name, clientContact:contact, status:'pending', createdAt:Date.now(),
    clientTelegramId: (state.tgUser && state.tgUser.id) ? String(state.tgUser.id) : null,
    clientNotes: clientHealthNotes || null,
    giftCertCode: state.booking.giftCertCode || null,
    giftCertAmount: state.booking.giftCertAmount || null,
    bookedForSomeoneElse: !!state._bookForSomeoneElse,
    // Предоплата идёт мастеру напрямую (на его СБП/карту) — платформа деньги не принимает
    // и не может подтвердить перевод автоматически, поэтому мастер подтверждает получение сам.
    depositAmount, depositStatus: depositAmount>0 ? 'awaiting_confirmation' : null
  };
  bookings.push(booking);
  if(booking.giftCertCode){
    try{
      const certs = await sget('gift-certificates:'+masterId, true) || [];
      const cert = certs.find(c=>c.code===booking.giftCertCode);
      if(cert){ cert.status='redeemed'; cert.redeemedAt=Date.now(); cert.redeemedBookingId=booking.id; await sset('gift-certificates:'+masterId, certs, true); }
    }catch(e){ console.warn('certificate redeem failed:', e); }
  }
  try{
    const avKey = 'abandoned-views:'+masterId;
    const avList = await sget(avKey, true) || [];
    const avMatch = avList.find(v=>v.clientKey===ownerId() && v.date===booking.date && v.time===booking.time && !v.converted);
    if(avMatch){ avMatch.converted = true; await sset(avKey, avList, true); }
  }catch(e){ console.warn('mark abandoned view converted failed:', e); }
  await saveBookings(masterId, bookings);

  recentSubmits.push(Date.now());
  await sset('my-booking-attempts', recentSubmits, false);

  const mine = await sget('my-client-bookings', false) || [];
  mine.push({bookingId:booking.id, masterId});
  await sset('my-client-bookings', mine, false);

  state.booking=null;
  state._bookForSomeoneElse=false;
  showToast(depositAmount>0
    ? `Заявка отправлена мастеру. Он подтвердит получение предоплаты ${depositAmount}₽ и запись.`
    : 'Заявка отправлена мастеру! Ожидайте подтверждения.');
  state.masterDetailTab='about';
  fillMasterDetail();

  // Мгновенное уведомление мастеру о новой заявке (в чат приложения + от бота в Telegram).
  try{
    const depositNote = depositAmount>0 ? `\n\n💰 Клиент указал, что перевёл предоплату ${depositAmount}₽ вам напрямую — проверьте поступление и подтвердите в заявке.` : '';
    const chat = await loadChat(masterId);
    chat.push({
      id: uid(), from:'owner',
      text: `🗓️ Новая заявка на запись!\n${service.name} · ${fmtDate(booking.date)} в ${booking.time}\nКлиент: ${name} (${contact})${depositNote}`,
      createdAt: Date.now(), readByOwner:true, readByMaster:false
    });
    await saveChat(masterId, chat);
    await addChatToIndex(masterId);
    if(m.telegramId){
      await notifyTelegram(m.telegramId,
        `🗓️ Новая заявка на запись!\n\nУслуга: ${service.name}\nКогда: ${fmtDate(booking.date)} в ${booking.time}\nКлиент: ${name}\nКонтакт: ${contact}${depositNote}\n\nПодтвердите или отклоните её во вкладке «Мастеру → Записи».`);
    }
  }catch(e){ console.warn('booking notify failed:', e); }
}
window.submitBooking = submitBooking;

async function fillMyBookings(){
  const mine = await sget('my-client-bookings', false) || [];
  const hero = `<div class="hero"><h1>Мои записи</h1><p>Статусы ваших заявок к мастерам.</p></div>`;

  const myHealthNotes = await sget('my-health-notes', false) || '';
  const selfNotesCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">📝 Заметка о себе</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Аллергии, чувствительность, предпочтения по материалам — заполните один раз, и мастер увидит это при каждой новой записи.</div>

    <button class="btn ghost small" style="margin-top:8px;" onclick="saveMyHealthNotes()">Сохранить</button>
  </div>`;

  const refLink = `https://t.me/${BOT_USERNAME}?startapp=ref_${ownerId()}`;
  const referrals = await sget('referrals:'+ownerId(), true) || [];
  const referralCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">👯 Пригласите подругу</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Отправьте эту ссылку — когда подруга откроет приложение по ней, вы обе станете приоритетными клиентами у мастеров (это отметка для мастера, помогает при прочих равных).${referrals.length?` Уже приглашено: ${referrals.length}.`:''}</div>
    <div class="pinkfield">
      <span class="v">${refLink}</span>
      <button class="btn ghost small" style="width:auto;padding:9px 16px;white-space:nowrap;flex:0 0 auto;" onclick="copyText('${refLink}')">Скопировать</button>
    </div>
  </div>`;

  if(!mine.length){
    document.getElementById('content').innerHTML = hero + selfNotesCard + referralCard + `<div class="empty"><div class="big">🗓️</div>Пока нет записей.<br>Найдите мастера в каталоге и оставьте заявку.</div>`;
    return;
  }
  const rows=[];
  const visitCounts = {}; // masterId -> число состоявшихся визитов этого клиента (для программы лояльности)
  for(const entry of mine){
    const bookings = await loadBookings(entry.masterId);

      visitCounts[entry.masterId] = (visitCounts[entry.masterId]||0) + 1;
    }
  }
  for(const entry of mine.slice().reverse()){
    const bookings = await loadBookings(entry.masterId);
    const bk = bookings.find(b=>b.id===entry.bookingId);
    if(!bk) continue;
    const m = await loadMaster(entry.masterId);
    const spec = m?SPECS[m.specialization]:null;
    const past = isBookingPast(bk);
    const canCancel = (bk.status==='pending' || bk.status==='confirmed') && !past;
    const isCompleted = bk.status==='confirmed' && past;
    const statusLabel = isCompleted ? 'Состоялась' : (bk.status==='pending'?'Ожидает':bk.status==='confirmed'?'Подтверждено':'Отменено');
    const statusClass = isCompleted ? 'completed' : bk.status;
    rows.push(`<div class="card">
      <div class="mcard-top">
        <div>
          <div class="mcard-name">${escapeHtml(bk.serviceName)}</div>
          <div class="mcard-city">${spec?spec.icon+' ':''}${m?escapeHtml(m.name):'Мастер'} · 📍 ${m?escapeHtml(m.city):''}</div>
        </div>
        <span class="badge ${statusClass}">${statusLabel}</span>
      </div>
      <div class="divider"></div>
      <div style="font-size:13.5px;color:var(--ink-soft)">📅 ${fmtDate(bk.date)} в ${bk.time} · ${bk.price}₽</div>
      ${bk.depositAmount?`<div style="font-size:12.5px;margin-top:4px;color:${bk.depositStatus==='confirmed'?'var(--teal)':'var(--gold)'};">${bk.depositStatus==='confirmed'?'✅ Мастер подтвердил получение предоплаты':'⏳ Мастер ещё не подтвердил получение предоплаты '+bk.depositAmount+'₽'}</div>`:''}
      ${(isCompleted && m && m.loyaltyEvery && m.loyaltyReward) ? (()=>{
        const visits = visitCounts[entry.masterId]||0;
        const rem = visits % m.loyaltyEvery;
        return rem===0
          ? `<div style="font-size:12px;font-weight:700;color:var(--teal);margin-top:6px;">🎁 У вас накопился бонус: ${escapeHtml(m.loyaltyReward)} — напомните мастеру при следующем визите</div>`
          : `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">🎁 До «${escapeHtml(m.loyaltyReward)}» у этого мастера: ещё ${m.loyaltyEvery-rem} визит(ов)</div>`;
      })() : ''}
      ${(!past && bk.status!=='cancelled' && m) ? `<div class="section-pad" style="padding:8px 0 0;"><button class="btn ghost small" onclick="exportBookingToICS('${entry.masterId}','${bk.id}')">📅 Добавить в календарь</button></div>` : ''}
      ${canCancel ? `<div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn ghost small" style="flex:1" onclick="toggleReschedule('${bk.id}')">${state.reschedulingBookingId===bk.id?'Отмена':'🔁 Перенести'}</button>
        <button class="btn danger small" style="flex:1" onclick="clientCancelBooking('${entry.masterId}','${bk.id}')">Отменить</button>
      </div>` : ''}
      ${(canCancel && state.reschedulingBookingId===bk.id && m) ? renderRescheduleWidget(m, bk, bookings) : ''}
      ${isCompleted && m ? `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn ghost small" onclick="repeatBooking('${entry.masterId}','${bk.serviceId}')">🔁 Повторить запись</button>
        <button class="btn ghost small" onclick="goToReview('${entry.masterId}')">⭐ Оставить отзыв</button>
      </div>` : ''}
      ${(bk.status!=='cancelled' && m) ? `<div style="margin-top:8px;">
        <button class="btn ghost small" style="color:var(--danger);" onclick='openReportModal({type:"booking",masterId:"${entry.masterId}",bookingId:"${bk.id}",label:"Запись: ${escapeHtml(bk.serviceName)} у мастера ${escapeHtml(m.name)}"})'>🚩 Пожаловаться</button>
      </div>` : ''}
    </div>`);
  }
  document.getElementById('content').innerHTML = hero + selfNotesCard + referralCard + rows.join('');
}

function renderRescheduleWidget(m, bk, bookings){
  const days = [];
  for(let i=0;i<14;i++) days.push(todayISO(i));
  const selDate = state.rescheduleDate || bk.date;
  const staffId = bk.staffId || null;
  const slotsSrc = staffId ? ((m.staffSlots&&m.staffSlots[staffId])||{}) : (m.slots||{});
  const dayChips = days.map(d=>{
    const has = (slotsSrc[d] && slotsSrc[d].length);
    return `<button class="chip ${selDate===d?'active':''}" ${has?'':'style="opacity:.35;pointer-events:none;"'} onclick="pickRescheduleDate('${d}')">${fmtDate(d)}</button>`;
  }).join('');
  const daySlots = slotsSrc[selDate] || [];
  const takenTimes = bookings.filter(b=>b.id!==bk.id && b.date===selDate && b.status!=='cancelled' && (b.staffId||null)===staffId).flatMap(b=>occupiedTimesForBooking(b, m.bufferMinutes));
  const slotsHtml = `<div class="slotgrid">${daySlots.map(t=>{
    const taken = takenTimes.includes(t);
    return `<div class="slot ${state.rescheduleTime===t?'on':''} ${taken?'taken':''}" onclick="${taken?'':`pickRescheduleTime('${t}')`}">${t}</div>`;
  }).join('')}</div>`;
  return `<div class="card" style="margin-top:10px;background:var(--bg);">
    <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;">Выберите новую дату и время</div>
    <div class="chiprow" style="padding:0 0 10px;">${dayChips}</div>
    ${slotsHtml}
    <button class="btn primary small" style="margin-top:10px;width:100%;" ${(state.rescheduleDate&&state.rescheduleTime)?'':'disabled'} onclick="confirmReschedule('${m.id}','${bk.id}')">Подтвердить перенос</button>
  </div>`;
}
window.renderRescheduleWidget = renderRescheduleWidget;

async function confirmReschedule(masterId, bookingId){

  const bk = bookings.find(b=>b.id===bookingId);
  if(!bk || !state.rescheduleDate || !state.rescheduleTime) return;
  const oldDate = bk.date, oldTime = bk.time;
  bk.date = state.rescheduleDate;
  bk.time = state.rescheduleTime;
  bk.status = 'pending'; // требует повторного подтверждения мастером
  bk.attendance = null;
  await saveBookings(masterId, bookings);
  state.reschedulingBookingId = null;
  state.rescheduleDate = null;
  state.rescheduleTime = null;
  showToast('Запись перенесена — ждём подтверждения мастера');
  fillMyBookings();

  try{
    const m = await loadMaster(masterId);
    const chat = await loadChat(masterId);
    chat.push({
      id: uid(), from:'owner',
      text: `🔁 Клиент перенёс запись!\n${bk.serviceName}\nБыло: ${fmtDate(oldDate)} в ${oldTime}\nСтало: ${fmtDate(bk.date)} в ${bk.time}\nКлиент: ${bk.clientName}\n\nПодтвердите новое время.`,
      createdAt: Date.now(), readByOwner:true, readByMaster:false
    });
    await saveChat(masterId, chat);
    await addChatToIndex(masterId);
    if(m && m.telegramId){
      await notifyTelegram(m.telegramId, `🔁 Клиент перенёс запись на ${fmtDate(bk.date)} в ${bk.time} (было ${fmtDate(oldDate)} в ${oldTime}). Подтвердите новое время во вкладке «Записи».`);
    }
  }catch(e){ console.warn('reschedule notify failed:', e); }
  notifyWaitlist(masterId); // старый слот освободился
}
window.confirmReschedule = confirmReschedule;

/* Воронка регистрации мастеров: фиксируем сам факт открытия формы, чтобы владелец видел
   не только успешные регистрации, но и тех, кто начал и не дошёл до конца (потенциальные лиды). */
async function trackFunnelStart(){
  try{
    const key = ownerId();
    const existing = await sget('funnel:'+key, true);
    if(existing && existing.completed) return; // уже зарегистрировался раньше — не переписываем
    await sset('funnel:'+key, {
      key, startedAt: (existing&&existing.startedAt) || Date.now(),
      completed:false, tgName: state.tgUser ? [state.tgUser.first_name,state.tgUser.last_name].filter(Boolean).join(' ') : null,
      telegramId: state.tgUser ? String(state.tgUser.id) : null
    }, true);
    const idx = await sget('funnel-index', true) || [];
    if(!idx.includes(key)){ idx.push(key); await sset('funnel-index', idx, true); }
  }catch(e){ console.warn('trackFunnelStart failed:', e); }
}

async function trackFunnelComplete(masterId){
  try{
    const key = ownerId();
    const existing = await sget('funnel:'+key, true) || { key, startedAt: Date.now() };
    existing.completed = true;
    existing.completedAt = Date.now();
    existing.masterId = masterId;
    await sset('funnel:'+key, existing, true);
  }catch(e){ console.warn('trackFunnelComplete failed:', e); }
}

async function finishRegistration(){
  const name = document.getElementById('regName').value.trim();
  const spec = document.getElementById('regSpec').value;
  const city = document.getElementById('regCity').value.trim();
  const noAddress = document.getElementById('regNoAddress').checked;
  const address = noAddress ? '' : document.getElementById('regAddress').value.trim();

  const contactPerson = accountType==='company' ? (document.getElementById('regContactPerson').value.trim() || null) : null;
  if(!name || !city){ showToast(accountType==='company' ? 'Укажите как минимум название компании и город' : 'Укажите как минимум имя и город'); return; }
  if(!document.getElementById('regConsent').checked){ showToast('Нужно принять условия использования и политику конфиденциальности'); return; }
  const id = uid();
  // Автоматически подтягиваем аватарку из Telegram-профиля мастера (если разрешено его настройками приватности).
  const avatarUrl = (state.tgUser && state.tgUser.photo_url) ? state.tgUser.photo_url : null;
  const referredByMasterId = await sget('my-referred-by-master', false) || null;
  const master = {
    id, specialization:spec, name, city, address, bio, noPhysicalAddress: noAddress,
    accountType, contactPerson,
    services:[], portfolio:[], slots:{},
    subscriptionActive:false, subscriptionUntil:null,
    ratingSum:0, ratingCount:0, createdAt:Date.now(), isDemo:false, disabledByAdmin:false,
    telegramId: (state.tgUser && state.tgUser.id) ? String(state.tgUser.id) : null,
    avatarUrl,
    referredByMasterId, referralBonusGranted: false,
    paymentClaimStatus: null, paymentClaimMethod: null, paymentClaimAt: null,
    moderationStatus: 'pending', // pending | approved | rejected
    moderationReason: null,
    paymentHistory: [], // [{ method, confirmedAt, subscriptionUntil }]
    isTrial: false, trialEndsAt: null
  };
  await saveMaster(master);
  await addMasterToIndex(id);
  await trackFunnelComplete(id);
  if(referredByMasterId){
    const refs = await sget('master-referrals:'+referredByMasterId, true) || [];
    if(!refs.includes(id)){ refs.push(id); await sset('master-referrals:'+referredByMasterId, refs, true); }

  await sset('my-master-id', id, false);
  state.myMasterId = id; state.myMaster = master;
  state.userRole = 'master';
  await sset('my-role', 'master', false);
  showToast('Профиль создан! Он отправлен на проверку модератору.');
  fillMasterArea();
}

  const bookings = isDemo? [] : await loadBookings(m.id);
  const pending = bookings.filter(b=>b.status==='pending').length;

  // Используется владельцем для алерта об оттоке (платящий мастер, который давно не заходил).

function renderMChat(m, isDemo, chat){
  if(isDemo){
    return `<div class="card"><div class="empty" style="padding:20px 0">💬 Чат с владельцем платформы доступен после создания настоящего профиля — в демо-режиме он отключён.</div></div>`;
  }
  const prefill = state._adPrefill ? 'Здравствуйте! Хочу разместить объявление/баннер в приложении — подскажите, пожалуйста, условия и как это оформить.' : '';
  state._adPrefill = false;
  const bubbles = (chat && chat.length) ? chat.map(msg=>`
    <div class="chat-msg ${msg.from==='master'?'out':'in'}">
      <div class="chat-bubble">${escapeHtml(msg.text)}</div>
      <div class="chat-time">${new Date(msg.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') : `<div class="empty" style="padding:30px 10px;">💬 Напишите владельцу платформы — например, попросите помочь доработать профиль, задайте вопрос по подписке или предложите идею.</div>`;
  return `
  <div class="card" style="padding:12px;">
    <div class="chat-wrap" id="chatScroll">${bubbles}</div>
  </div>
  <div class="section-pad" style="display:flex;gap:8px;align-items:flex-end;">
    <textarea id="chatInput" placeholder="Напишите сообщение владельцу…" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:44px;max-height:120px;">${escapeHtml(prefill)}</textarea>
    <button class="btn primary" style="width:auto;padding:0 18px;height:44px;" onclick="sendChatFromMaster()">➤</button>
  </div>
  <div class="pillnote">Сообщение сохранится в приложении и сразу откроет чат с владельцем платформы в Telegram с готовым текстом — нажмите там «отправить», чтобы он получил уведомление мгновенно.</div>`;
}
async function sendChatFromMaster(){
  const input = document.getElementById('chatInput');
  const text = (input && input.value || '').trim();
  if(!text){ showToast('Введите текст сообщения'); return; }
  const m = await loadMaster(state.myMasterId);
  if(!m) return;
  const chat = await loadChat(m.id);
  chat.push({ id:uid(), from:'master', text, createdAt:Date.now(), readByMaster:true, readByOwner:false });
  await saveChat(m.id, chat);
  await addChatToIndex(m.id);

  const tgText = `💬 Сообщение от мастера «${m.name}» (BeautyHub):\n${text}`;

  // 1) Пробуем автоматическое уведомление через бота (если настроена Edge Function notify-telegram).
  let sentAuto = false;
  for(const ownerId of OWNER_TELEGRAM_IDS){
    const ok = await notifyTelegram(ownerId, tgText);
    sentAuto = sentAuto || ok;
  }

  // 2) Если автоматическая отправка не сработала (функция ещё не задеплоена) — резервный способ:
  //    открыть чат с владельцем в Telegram с готовым текстом.
  if(!sentAuto){
    const link = 'https://t.me/' + OWNER_TELEGRAM_USERNAME + '?text=' + encodeURIComponent(tgText);
    if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink){
      window.Telegram.WebApp.openTelegramLink(link);
    } else {
      window.open(link, '_blank');
    }
  }
  showToast(sentAuto ? 'Сообщение отправлено владельцу в Telegram' : 'Сообщение сохранено, чат с владельцем открыт в Telegram');
  fillMasterArea();
}
window.sendChatFromMaster = sendChatFromMaster;

async function payViaYookassa(masterId){
  const btn = document.getElementById('ykPayBtn');
  const originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Готовим оплату…'; }
  try{
    const { data, error } = await sb.functions.invoke('create-payment', { body: { masterId } });
    if(error) throw new Error(error.message || 'Функция оплаты недоступна');
    if(!data || !data.ok || !data.confirmationUrl) throw new Error((data && data.error) || 'Не удалось создать платёж');
    const url = data.confirmationUrl;
    if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink){
      window.Telegram.WebApp.openLink(url);
    } else {
      window.open(url, '_blank');
    }
    showToast('Открыли страницу оплаты — после оплаты вернитесь в приложение и нажмите «Обновить статус оплаты»');
  }catch(e){
    console.error('payViaYookassa failed', e);
    showToast('Не удалось открыть онлайн-оплату. Попробуйте ещё раз или переведите вручную ниже.');
  }
  if(btn){ btn.disabled = false; btn.textContent = originalText; }
}
window.payViaYookassa = payViaYookassa;

function copyText(text){
  const done = ()=> showToast('Скопировано!');
  const fail = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ showToast('Не удалось скопировать, скопируйте вручную'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else { fail(); }
}
window.copyText = copyText;

async function saveMapCoords(masterId){
  const el = document.getElementById('pfCoords');
  const raw = el ? el.value.trim() : '';
  const m = await loadMaster(masterId);
  if(!raw){
    m.lat = null; m.lng = null;
    await saveMaster(m);
    showToast('Координаты убраны');
    (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
    return;
  }
  const parts = raw.split(',').map(s=>parseFloat(s.trim()));
  if(parts.length!==2 || parts.some(isNaN) || Math.abs(parts[0])>90 || Math.abs(parts[1])>180){
    showToast('Не удалось распознать координаты — формат: широта, долгота (например 55.75, 37.61)');
    return;
  }
  m.lat = parts[0]; m.lng = parts[1];
  await saveMaster(m);
  showToast('Координаты сохранены — вы появитесь на карте');
  (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
}
window.saveMapCoords = saveMapCoords;

function openDeleteMasterModal(masterId){

  </div>`;
  document.body.appendChild(overlay);

function closeDeleteMasterModal(){
  const el = document.getElementById('deleteMasterOverlay');
  if(el) el.remove();
}

async function confirmDeleteMaster(masterId){
  const input = document.getElementById('deleteConfirmInput');
  if(!input || input.value.trim() !== 'Удалить'){
    showToast('Введите слово «Удалить» точно, как указано');
    return;
  }
  await sset('master:'+masterId, null, true);
  const idx = await sget('masters-index', true) || [];
  await sset('masters-index', idx.filter(id=>id!==masterId), true);
  await sset('my-master-id', null, false);
  state.myMasterId = null;
  closeDeleteMasterModal();
  showToast('Профиль удалён');
  state.userRole = 'client';
  await sset('my-role', 'client', false);
  goto('catalog');
}

async function grantPackage(masterId, clientKey, i){
  const selectEl = document.getElementById('grantPkgSelect_'+i);
  const packageId = selectEl ? selectEl.value : null;
  if(!packageId) return;
  const m = await loadMaster(masterId);
  const pkg = (m.packages||[]).find(p=>p.id===packageId);
  if(!pkg) return;
  const clientPackages = await sget('client-packages:'+masterId, true) || {};
  clientPackages[clientKey] = clientPackages[clientKey] || [];
  clientPackages[clientKey].push({ packageId, remaining: pkg.visitsIncluded, purchasedAt: Date.now() });
  await sset('client-packages:'+masterId, clientPackages, true);
  showToast(`Пакет «${pkg.name}» выдан клиенту`);
  fillMasterArea();
}
window.grantPackage = grantPackage;

async function spendPackageVisit(masterId, clientKey, packageId, i){
  const clientPackages = await sget('client-packages:'+masterId, true) || {};
  const list = clientPackages[clientKey] || [];
  const cp = list.find(x=>x.packageId===packageId && x.remaining>0);
  if(!cp) return;
  cp.remaining = Math.max(0, cp.remaining-1);
  await sset('client-packages:'+masterId, clientPackages, true);
  showToast(cp.remaining>0 ? `Списан 1 визит, осталось ${cp.remaining}` : 'Пакет полностью использован');
  fillMasterArea();
}
window.spendPackageVisit = spendPackageVisit;

async function uploadPortfolioPhoto(input){
  const file0 = input.files && input.files[0];
  if(!file0) return;
  const statusEl = document.getElementById('pfUploadStatus');
  if(statusEl) statusEl.textContent = 'Сжимаем и загружаем…';
  try{
    const file = await compressImage(file0);
    const ext = 'jpg';
    const path = `${state.myMasterId}/${uid()}.${ext}`;
    const { error: upErr } = await sb.storage.from('portfolios').upload(path, file, { upsert:false, contentType: file.type || 'image/jpeg' });
    if(upErr) throw upErr;
    const { data } = sb.storage.from('portfolios').getPublicUrl(path);
    const url = data && data.publicUrl;
    if(!url) throw new Error('Не удалось получить ссылку на фото');
    const m = await loadMaster(state.myMasterId);
    m.portfolio.push({id:uid(), url, caption:''});
    await saveMaster(m);
    showToast('Фото загружено');
    (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
  }catch(e){
    console.error('Portfolio upload failed', e);
    if(statusEl) statusEl.textContent = 'Не получилось загрузить файл напрямую (возможно, не настроено хранилище Supabase Storage) — воспользуйтесь полем со ссылкой ниже.';
    else showToast('Не удалось загрузить фото, используйте ссылку');
  }
}
