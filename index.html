/* Возвращает ссылку на нужный объект расписания: если у компании заведены сотрудники —
   своё расписание на каждого (m.staffSlots[staffId]), иначе общее m.slots как раньше —
   полная обратная совместимость для частных мастеров и компаний без сотрудников. */
function activeStaffId(m){
  if(m.accountType==='company' && (m.staff||[]).length){
    return state.masterScheduleStaffId || m.staff[0].id;
  }
  return null;
}
function slotsRefFor(m, staffId){
  if(staffId){
    m.staffSlots = m.staffSlots || {};
    m.staffSlots[staffId] = m.staffSlots[staffId] || {};
    return m.staffSlots[staffId];
  }
  m.slots = m.slots || {};
  return m.slots;
}

function renderMSchedule(m, isDemo){
  const staffId = activeStaffId(m);
  const staffChips = (m.accountType==='company' && (m.staff||[]).length) ? `<div class="chiprow" style="padding:0 0 12px;">${m.staff.map(s=>`<button class="chip ${staffId===s.id?'active':''}" onclick="pickScheduleStaff('${s.id}')">${escapeHtml(s.name)}</button>`).join('')}</div>` : '';
  const days = Array.from({length:14},(_,i)=>todayISO(i));
  const dayChips = days.map(d=>`<button class="chip ${state.masterScheduleDate===d?'active':''}" onclick="pickScheduleDate('${d}')">${fmtDate(d)}</button>`).join('');
  const slotsRef = staffId ? ((m.staffSlots&&m.staffSlots[staffId])||{}) : (m.slots||{});
  const daySlots = slotsRef[state.masterScheduleDate] || [];
  const slotGrid = TIMES.map(t=>`<div class="slot ${daySlots.includes(t)?'on':''}" onclick="${isDemo?'':`toggleSlot('${t}')`}">${t}</div>`).join('');
  const templates = isDemo ? '' : `<div class="card">
    ${staffChips}
    <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">Быстрые шаблоны</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn ghost small" onclick="applyScheduleTemplate('weekdays')">Пн–Пт, 10:00–19:00, на месяц вперёд</button>
      <button class="btn ghost small" onclick="applyScheduleTemplate('everyday')">Каждый день, 10:00–19:00, на месяц вперёд</button>
      <button class="btn danger small" onclick="clearScheduleDay()">Сделать выбранный день выходным</button>
    </div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;">Шаблон не трогает дни, которые вы уже настроили вручную под другим расписанием — при необходимости поправьте отдельные дни ниже.</div>
  </div>`;
  return templates + `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">Выберите дату</div>
    <div class="chiprow" style="padding:0;overflow-x:auto;">${dayChips}</div>
    <div class="divider"></div>
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">Свободное время на ${fmtDate(state.masterScheduleDate)}</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px;">Нажмите на время, чтобы открыть/закрыть его для записи</div>
    <div class="slotgrid">${slotGrid}</div>
    ${isDemo?'<div class="pillnote" style="margin:12px 0 0;padding-left:0;padding-right:0;background:none;border:none;color:var(--ink-soft);">В демо-режиме расписание не сохраняется.</div>':''}
  </div>`;
}

window.pickScheduleStaff=pickScheduleStaff;
function pickScheduleDate(d){ state.masterScheduleDate=d; (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)(); }
window.pickScheduleDate=pickScheduleDate;
async function toggleSlot(t){
  const m = await loadMaster(state.myMasterId);
  const staffId = activeStaffId(m);
  const slots = slotsRefFor(m, staffId);
  const d = state.masterScheduleDate;
  slots[d] = slots[d] || [];
  const wasOpen = slots[d].includes(t);
  if(wasOpen) slots[d] = slots[d].filter(x=>x!==t);
  else slots[d].push(t);
  await saveMaster(m);
  (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
  if(!wasOpen) notifyWaitlist(m.id); // открыли новое время — сообщим листу ожидания
}
window.toggleSlot = toggleSlot;

function timesInRange(start, end){
  return TIMES.filter(t => t>=start && t<=end);
}
async function applyScheduleTemplate(kind){
  const m = await loadMaster(state.myMasterId);
  const staffId = activeStaffId(m);
  const slots = slotsRefFor(m, staffId);
  const days = Array.from({length:30},(_,i)=>todayISO(i));
  for(const d of days){
    const dow = new Date(d+'T00:00:00').getDay(); // 0=вс, 6=сб
    const isWeekend = (dow===0 || dow===6);
    if(kind==='weekdays'){
      if(!isWeekend) slots[d] = timesInRange('10:00','19:00');
    } else if(kind==='everyday'){
      slots[d] = timesInRange('10:00','19:00');
    }
  }
  await saveMaster(m);
  showToast('Расписание применено на месяц вперёд');
  (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
  notifyWaitlist(m.id); // открылось много нового времени — сообщим листу ожидания
}
window.applyScheduleTemplate = applyScheduleTemplate;

async function clearScheduleDay(){
  const m = await loadMaster(state.myMasterId);
  const staffId = activeStaffId(m);
  const slots = slotsRefFor(m, staffId);
  slots[state.masterScheduleDate] = [];
  await saveMaster(m);
  showToast('День сделан выходным');
  (state._forceEdit? fillMasterAreaEditMode : fillMasterArea)();
}
window.clearScheduleDay = clearScheduleDay;

    ${(isCompleted && !b.attendance)?`<div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn teal small" style="flex:1" onclick="markAttendance('${b.id}','came')">✅ Пришёл(ла)</button>
      <button class="btn danger small" style="flex:1" onclick="markAttendance('${b.id}','no-show')">❌ Не пришёл(ла)</button>
    </div>`:''}
    ${(isCompleted && b.attendance==='came')?`<div style="margin-top:10px;">
      <button class="btn ghost small" onclick="sendReceipt('${m.id}','${b.id}')">🧾 ${b.receiptSentAt?'Отправить чек ещё раз':'Отправить чек клиенту'}</button>
      ${b.receiptSentAt?`<div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">Отправлен ${new Date(b.receiptSentAt).toLocaleDateString('ru-RU')}</div>`:''}
    </div>`:''}
    ${b.status!=='cancelled' ? `<div style="margin-top:8px;">
      <button class="btn ghost small" style="color:var(--danger);" onclick='openReportModal({type:"booking",masterId:"${m.id}",bookingId:"${b.id}",label:"Клиент ${escapeHtml(b.clientName)}, запись ${escapeHtml(b.serviceName)}"})'>🚩 Пожаловаться на клиента</button>
    </div>` : ''}
  </div>`;
  }).join('');
  return financeCard + expensesCard + taxReportCard + exportBtn + rows;
}

async function sendReceipt(masterId, bookingId){
  const bookings = await loadBookings(masterId);
  const b = bookings.find(x=>x.id===bookingId);
  const m = await loadMaster(masterId);
  if(!b || !m) return;
  const text = `🧾 Квитанция об оплате\n\n`+
    `Мастер: ${m.name}\n`+
    `Услуга: ${b.serviceName}\n`+
    `Дата: ${fmtDate(b.date)} в ${b.time}\n`+
    `Сумма: ${b.price}₽\n\n`+
    `Спасибо, что выбираете нас! 💕`;
  if(b.clientTelegramId){
    await notifyTelegram(b.clientTelegramId, text);
    b.receiptSentAt = Date.now();
    await saveBookings(masterId, bookings);
    showToast('Чек отправлен клиенту');
  } else {
    copyText(text);
    showToast('У клиента нет Telegram — текст чека скопирован, отправьте вручную');
  }
  fillMasterArea();
}
window.sendReceipt = sendReceipt;

function exportMyBookingsCSV(){
  const bookings = state._myBookingsCache || [];
  if(!bookings.length){ showToast('Нет записей для экспорта'); return; }
  const headers = ['Клиент','Контакт','Услуга','Цена','Дата','Время','Статус','Явка'];
  const rows = bookings.map(b=>[
    b.clientName, b.clientContact, b.serviceName, b.price, b.date, b.time,
    b.status==='pending'?'Ожидает':b.status==='confirmed'?'Подтверждена':'Отменена',
    b.attendance==='came'?'Пришёл':b.attendance==='no-show'?'Не пришёл':''
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beautyhub-bookings-${todayISO(0)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
window.exportMyBookingsCSV = exportMyBookingsCSV;

async function exportBookingToICS(masterId, bookingId){
  const bookings = await loadBookings(masterId);
  const bk = bookings.find(b=>b.id===bookingId);
  const m = await loadMaster(masterId);
  if(!bk || !m) return;
  const start = new Date(bk.date+'T'+bk.time+':00');
  const end = new Date(start.getTime() + (bk.duration||60)*60000);
  const fmt = (d)=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const uidVal = bk.id+'@beautyhub';
  const desc = `Услуга: ${bk.serviceName}\\nЦена: ${bk.price}₽\\nМастер: ${m.name}`;
  const loc = [m.city, m.address].filter(Boolean).join(', ');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BeautyHub//RU','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:'+uidVal,
    'DTSTAMP:'+fmt(new Date()),
    'DTSTART:'+fmt(start),
    'DTEND:'+fmt(end),
    'SUMMARY:'+bk.serviceName+' — '+m.name,
    'DESCRIPTION:'+desc,
    'LOCATION:'+loc,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beautyhub-${bk.date}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
window.exportBookingToICS = exportBookingToICS;

async function exportTaxReport(masterId){
  const period = document.getElementById('taxPeriod').value;
  const bookings = await loadBookings(masterId);
  const now = new Date();
  const startDate = period==='year' ? `${now.getFullYear()}-01-01` : todayISO(-now.getDate()+1);
  const came = bookings.filter(b=>b.status==='confirmed' && isBookingPast(b) && b.attendance!=='no-show' && b.date>=startDate);
  const total = came.reduce((s,b)=>s+(b.price||0),0);
  const tax = Math.round(total*0.04);
  const periodLabel = period==='year' ? `${now.getFullYear()} год` : now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const lines = [
    `Отчёт по доходу — ${periodLabel}`,
    '',
    ...came.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`${fmtDate(b.date)} · ${b.serviceName} · ${b.price}₽`),
    '',
    `Итого визитов: ${came.length}`,
    `Итого доход: ${total}₽`,
    `К отложению на налог (НПД 4%): ${tax}₽`,
  ];
  const text = lines.join('\n');
  const blob = new Blob(['\uFEFF'+text], {type:'text/plain;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beautyhub-tax-report-${period}-${todayISO(0)}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  showToast('Отчёт скачан');
}
window.exportTaxReport = exportTaxReport;

/* ============ МИНИ-CRM: КЛИЕНТЫ + РАССЫЛКА ============ */
async function renderMClients(m, isDemo, bookings){
  if(isDemo){
    return `<div class="card"><div class="empty" style="padding:20px 0">👥 Здесь появится список ваших клиентов: кто и когда записывался, заметки и рассылка — доступно после создания настоящего профиля.</div></div>`;
  }
  const notesRaw = await sget('client-notes:'+m.id, true) || {};
  const priorityClients = await sget('priority-clients', true) || [];
  const map = new Map();
  bookings.forEach(b=>{
    const key = b.clientTelegramId || b.clientContact;
    if(!key) return;
    if(!map.has(key)) map.set(key, {key, name:b.clientName, contact:b.clientContact, telegramId:b.clientTelegramId, visits:0, firstDate:null, lastDate:null, spent:0});
    const c = map.get(key);
    c.visits++;
    if(!c.firstDate || b.date<c.firstDate) c.firstDate = b.date;
    if(!c.lastDate || b.date>c.lastDate) c.lastDate = b.date;
    if(b.status==='confirmed' && isBookingPast(b)) c.spent += (b.price||0);
  });
  const imported = await sget('imported-clients:'+m.id, true) || [];
  imported.forEach(ic=>{
    if(!ic.contact || map.has(ic.contact)) return;
    map.set(ic.contact, {key:ic.contact, name:ic.name, contact:ic.contact, telegramId:null, visits:0, firstDate:null, lastDate:null, spent:0, imported:true});
  });
  const list = Array.from(map.values()).sort((a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''));

  // Непрочитанные сообщения в прямых чатах клиент↔мастер (для бейджа на кнопке 💬)
  const clientChatUnread = {};
  try{
    const cmIndex = await sget('cm-chat-index:'+m.id, true) || [];
    for(const clientKey of cmIndex){
      const thread = await sget('cm-chat:'+m.id+':'+clientKey, true) || [];
      if(thread.some(msg=>msg.from==='client' && !msg.readByMaster)) clientChatUnread[clientKey] = true;
    }
  }catch(e){ console.warn('unread client chat check failed:', e); }

  const todayD = new Date(todayISO(0)+'T00:00:00');
  list.forEach(c=>{
    // Обратная совместимость: раньше client-notes хранил просто строку, теперь {note, tags}
    const raw = notesRaw[c.key];
    if(typeof raw === 'string'){ c.note = raw; c.tags = []; c.birthday = null; }
    else { c.note = (raw && raw.note) || ''; c.tags = (raw && raw.tags) || []; c.birthday = (raw && raw.birthday) || null; }

    // Скоро день рождения — сравниваем месяц/день, год не важен (может отсутствовать смысл возраста)
    c.birthdaySoon = false;
    if(c.birthday){
      const bd = new Date(c.birthday+'T00:00:00');
      const nextBd = new Date(todayD.getFullYear(), bd.getMonth(), bd.getDate());
      if(nextBd < todayD) nextBd.setFullYear(todayD.getFullYear()+1);
      const daysUntil = Math.round((nextBd - todayD) / 86400000);
      c.daysUntilBirthday = daysUntil;
      if(daysUntil>=0 && daysUntil<=14) c.birthdaySoon = true;
    }

    // «Давно не был» — если визитов ≥2, сравниваем с обычным интервалом между визитами;
    // если визит один — простой порог в 60 дней.
    c.winBack = false;
    if(c.lastDate){
      const daysSince = Math.floor((todayD - new Date(c.lastDate+'T00:00:00')) / 86400000);
      if(c.visits>=2 && c.firstDate!==c.lastDate){
        const avgGap = (new Date(c.lastDate+'T00:00:00') - new Date(c.firstDate+'T00:00:00')) / 86400000 / (c.visits-1);
        if(avgGap>0 && daysSince > avgGap*1.5 && daysSince>14) c.winBack = true;
      } else if(c.visits===1 && daysSince>60){
        c.winBack = true;
      }
    }
  });
  state._clientList = list; // для доступа по индексу из onclick без экранирования спецсимволов в ключах

  const allTags = Array.from(new Set(list.flatMap(c=>c.tags))).sort();
  const winBackCount = list.filter(c=>c.winBack).length;

  const withTelegram = list.filter(c=>c.telegramId).length;
  const broadcastCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">📢 Написать всем клиентам</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Сообщение придёт от бота всем клиентам, у которых есть Telegram (сейчас это ${withTelegram} из ${list.length}). Удобно для «освободилось время завтра» или «у меня новая услуга».</div>
    <textarea id="broadcastText" placeholder="Например: Привет! Завтра в 14:00 освободилось окошко, если нужно — записывайтесь 🙂" style="min-height:70px;"></textarea>
    <button class="btn primary small" style="margin-top:8px;" onclick="broadcastToClients('${m.id}')" ${withTelegram?'':'disabled'}>Отправить всем (${withTelegram})</button>
  </div>`;

  const winBackCard = winBackCount ? `<div class="card" style="background:#FBEFD6;border:1px solid #F3DFA8;">
    <div style="font-weight:700;font-size:13.5px;color:#8A5A1F;margin-bottom:4px;">⏰ Давно не были (${winBackCount})</div>
    <div style="font-size:12px;color:#8A5A1F;line-height:1.5;">Обычно приходят чаще — возможно, стоит написать и напомнить о себе. Ищите бейдж «⏰ давно не был(а)» в списке ниже.</div>
  </div>` : '';

  const birthdaySoonList = list.filter(c=>c.birthdaySoon).sort((a,b)=>a.daysUntilBirthday-b.daysUntilBirthday);
  const birthdayCard = birthdaySoonList.length ? `<div class="card" style="background:var(--pink-tint);border:1px solid rgba(236,24,118,0.28);">
    <div style="font-weight:700;font-size:13.5px;color:var(--rose-deep);margin-bottom:6px;">🎂 Скоро день рождения (${birthdaySoonList.length})</div>
    ${birthdaySoonList.map(c=>`<div style="font-size:12.5px;color:var(--rose-deep);padding:3px 0;">${escapeHtml(c.name)} — ${c.daysUntilBirthday===0?'сегодня!':c.daysUntilBirthday===1?'завтра':`через ${c.daysUntilBirthday} дн.`}</div>`).join('')}
  </div>` : '';

  // --- Брошенный просмотр: клиент дошёл до выбора времени, но не отправил заявку (прошло от 15 минут) ---
  const abandonedViews = (await sget('abandoned-views:'+m.id, true) || [])
    .filter(v=>!v.converted && (Date.now()-v.viewedAt) > 15*60000 && (Date.now()-v.viewedAt) < 7*24*3600000)
    .sort((a,b)=>b.viewedAt-a.viewedAt).slice(0,10);
  const abandonedViewsCard = abandonedViews.length ? `<div class="card" style="background:#FBEFD6;border:1px solid #F3DFA8;">
    <div style="font-weight:700;font-size:13.5px;color:#8A5A1F;margin-bottom:6px;">👀 Смотрели время записи, но не отправили заявку (${abandonedViews.length})</div>
    ${abandonedViews.map(v=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;">
      <div style="font-size:12.5px;color:#8A5A1F;">${escapeHtml(v.clientName)} — ${escapeHtml(v.serviceName)}, ${fmtDate(v.date)} ${v.time}</div>
      ${v.clientTelegramId?`<button class="btn ghost small" style="width:auto;padding:5px 10px;font-size:11px;" onclick="notifyTelegram('${v.clientTelegramId}','Здравствуйте! Заметил(а), что вы смотрели свободное время у меня — если ещё актуально, с радостью запишу вас 🙂'); showToast('Сообщение отправлено');">Написать</button>`:''}
    </div>`).join('')}
  </div>` : '';

  const importCard = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">📥 Импортировать базу клиентов</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;">Переносите базу из блокнота или другого сервиса — по одному клиенту на строке, формат «Имя, телефон или @username». Так вы сразу увидите их здесь.</div>
    <textarea id="importClientsText" placeholder="Анна, +79001234567&#10;Мария, @maria_beauty" style="min-height:80px;"></textarea>
    <button class="btn ghost small" style="margin-top:8px;" onclick="importClients('${m.id}')">Импортировать</button>
  </div>`;

  const exportCard = list.length ? `<div class="section-pad"><button class="btn ghost small" onclick="exportMyClientsCSV()">📤 Экспорт клиентов в CSV</button></div>` : '';

  const tagFilterBar = allTags.length ? `<div class="chiprow" style="padding-top:0;">
    <button class="chip" onclick="filterClientsByTag('')">Все</button>
    ${allTags.map(t=>`<button class="chip" onclick="filterClientsByTag('${escapeHtml(t).replace(/'/g,"\\'")}')">${escapeHtml(t)}</button>`).join('')}
  </div>` : '';

  if(!list.length){
    return broadcastCard + importCard + `<div class="card"><div class="empty" style="padding:10px 0">Пока нет клиентов — они появятся здесь после первых записей или импорта.</div></div>`;
  }

  const clientPackages = isDemo ? {} : (await sget('client-packages:'+m.id, true) || {});
  const masterPackages = m.packages || [];

  const rows = list.map((c,i)=>{
    let loyaltyHtml = '';
    if(m.loyaltyEvery && m.loyaltyReward){
      const rem = c.visits % m.loyaltyEvery;
      if(c.visits>0 && rem===0){
        loyaltyHtml = `<div style="font-size:12px;font-weight:700;color:var(--teal);margin-top:6px;">🎁 Пора выдать бонус: ${escapeHtml(m.loyaltyReward)}</div>`;
      } else if(c.visits>0){
        loyaltyHtml = `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">🎁 До бонуса «${escapeHtml(m.loyaltyReward)}»: ещё ${m.loyaltyEvery-rem} визит(ов)</div>`;
      }
    }
    const myPackages = clientPackages[c.key] || [];
    const packagesHtml = myPackages.length ? myPackages.map(cp=>{
      const pkg = masterPackages.find(p=>p.id===cp.packageId);
      if(!pkg) return '';
      return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px;background:var(--pink-tint);padding:6px 9px;border-radius:8px;">
        <span style="color:var(--rose-deep);">📦 ${escapeHtml(pkg.name)}: ${cp.remaining} визит(ов) осталось</span>
        ${cp.remaining>0?`<button class="link-btn" style="font-size:11px;" onclick="spendPackageVisit('${m.id}','${c.key}','${cp.packageId}', ${i})">Списать 1</button>`:''}
      </div>`;
    }).join('') : '';
    const grantPackageHtml = masterPackages.length ? `<div style="margin-top:6px;display:flex;gap:6px;">
      <select id="grantPkgSelect_${i}" style="flex:1;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;">${masterPackages.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select>
      <button class="btn ghost small" style="width:auto;padding:0 10px;font-size:11px;" onclick="grantPackage('${m.id}','${c.key}', ${i})">Выдать пакет</button>
    </div>` : '';
    return `<div class="card" data-tags="${escapeHtml(c.tags.join(',').toLowerCase())}">
    <div class="mcard-top">
      <div>
        <div class="mcard-name" style="font-size:14.5px;">${escapeHtml(c.name)} ${priorityClients.includes(c.key)?'<span class="badge active" style="margin-left:4px;">⭐ приоритетный</span>':''}${c.imported?'<span class="badge demo" style="margin-left:4px;">импорт</span>':''}${c.winBack?'<span class="badge pending" style="margin-left:4px;">⏰ давно не был(а)</span>':''}</div>
        <div class="mcard-city">📞 ${escapeHtml(c.contact)}</div>
      </div>
      ${c.telegramId?`<div style="display:flex;gap:6px;">
        <button class="btn ghost small" style="width:auto;padding:0 12px;position:relative;" onclick="openMasterClientChat('${m.id}','${c.key}')">💬${clientChatUnread[c.key]?`<span class="navdot" style="top:-2px;right:-2px;"></span>`:''}</button>
        <button class="btn ghost small" style="width:auto;padding:0 12px;" onclick="messageOneClient(${i})">✉️</button>
      </div>`:''}
    </div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;">🗓️ ${c.visits} визит${c.visits===1?'':c.visits<5?'а':'ов'}${c.lastDate?` · последний ${fmtDate(c.lastDate)}`:''}${c.spent?` · ${c.spent}₽ потрачено`:''}</div>
    ${loyaltyHtml}
    ${packagesHtml}
    ${grantPackageHtml}
    ${c.tags.length?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;">${c.tags.map(t=>`<span class="tag" style="background:var(--bg);color:var(--ink-soft);font-size:10.5px;">${escapeHtml(t)}</span>`).join('')}</div>`:''}
    <div class="divider"></div>
    <textarea id="clientNote_${i}" placeholder="Заметка (например: аллергия на такой-то состав, любит крепкий кофе...)" style="min-height:44px;font-size:12.5px;" onblur="saveClientNote('${m.id}', ${i})">${escapeHtml(c.note)}</textarea>

  document.querySelectorAll('#clientListRows [data-tags]').forEach(el=>{

function exportMyClientsCSV(){
  const list = state._clientList || [];
  if(!list.length){ showToast('Нет клиентов для экспорта'); return; }
  const headers = ['Имя','Контакт','Визитов','Последний визит','Потрачено','Теги','Заметка'];
  const rows = list.map(c=>[c.name, c.contact, c.visits, c.lastDate||'', c.spent, c.tags.join('; '), c.note]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beautyhub-clients-${todayISO(0)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
window.exportMyClientsCSV = exportMyClientsCSV;

async function importClients(masterId){
  const el = document.getElementById('importClientsText');
  const raw = (el && el.value || '').trim();
  if(!raw){ showToast('Вставьте список клиентов, по одному на строке'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const existing = await sget('imported-clients:'+masterId, true) || [];
  const existingContacts = new Set(existing.map(c=>c.contact));
  let added = 0;
  for(const line of lines){
    const parts = line.split(',').map(p=>p.trim());
    const name = parts[0] || 'Клиент';
    const contact = parts[1] || '';
    if(!contact || existingContacts.has(contact)) continue;
    existing.push({name, contact, importedAt:Date.now()});
    existingContacts.add(contact);
    added++;
  }
  await sset('imported-clients:'+masterId, existing, true);
  showToast(added ? `Импортировано клиентов: ${added}` : 'Ничего нового не добавлено (возможно, уже есть в базе)');
  if(el) el.value='';
  fillMasterArea();
}
window.importClients = importClients;

async function saveClientNote(masterId, i){
  const c = (state._clientList||[])[i];
  if(!c) return;
  const noteEl = document.getElementById('clientNote_'+i);
  const tagsEl = document.getElementById('clientTags_'+i);
  const birthdayEl = document.getElementById('clientBirthday_'+i);
  const text = noteEl ? noteEl.value.trim() : '';
  const tags = tagsEl ? tagsEl.value.split(',').map(t=>t.trim()).filter(Boolean) : [];
  const birthday = birthdayEl ? birthdayEl.value : '';
  const notes = await sget('client-notes:'+masterId, true) || {};
  notes[c.key] = { note:text, tags, birthday: birthday || null };
  await sset('client-notes:'+masterId, notes, true);
}

async function broadcastToClients(masterId){
  const el = document.getElementById('broadcastText');
  const text = (el && el.value || '').trim();
  if(!text){ showToast('Введите текст сообщения'); return; }
  const list = state._clientList || [];
  const targets = list.filter(c=>c.telegramId);
  if(!targets.length){ showToast('Нет клиентов с Telegram для рассылки'); return; }
  const m = await loadMaster(masterId);
  let sent = 0;
  for(const c of targets){
    const ok = await notifyTelegram(c.telegramId, `💌 Сообщение от мастера «${m.name}»:\n${text}`);
    if(ok) sent++;
  }
  showToast(`Отправлено ${sent} из ${targets.length}`);
  if(el) el.value = '';
}

async function setBookingStatus(bookingId, status){
  const bookings = await loadBookings(state.myMasterId);
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  b.status = status;
  if(status==='cancelled') b.cancelledBy = 'master';
  await saveBookings(state.myMasterId, bookings);
  showToast(status==='confirmed' ? 'Запись подтверждена — клиент увидит статус в «Моих записях»' : 'Запись отменена, клиент будет уведомлён');
  fillMasterArea();

  // Мгновенное уведомление клиенту в Telegram (если у него сохранён telegramId).
  if(b.clientTelegramId){
    const m = await loadMaster(state.myMasterId);
    const masterName = m ? m.name : 'мастер';
    const text = status==='confirmed'
      ? `✅ Ваша запись подтверждена!\n${b.serviceName} · ${fmtDate(b.date)} в ${b.time}\nМастер: ${masterName}`
      : `❌ Мастер отменил вашу запись.\n${b.serviceName} · ${fmtDate(b.date)} в ${b.time}\nМастер: ${masterName}\n\nВы можете выбрать другое время в приложении.`;
    notifyTelegram(b.clientTelegramId, text);
  }
  if(status==='cancelled') notifyWaitlist(state.myMasterId); // слот освободился — сообщим листу ожидания
}
window.setBookingStatus = setBookingStatus;

function exportMastersCSV(){
  const masters = state._adminMastersCache || [];
  if(!masters.length){ showToast('Нет данных для экспорта'); return; }
  const headers = ['Имя','Город','Специализация','Статус подписки','Дата регистрации','Telegram ID','Рейтинг','Отзывов'];
  const rows = masters.map(m=>[
    m.name, m.city, (SPECS[m.specialization]&&SPECS[m.specialization].label)||m.specialization,
    m.subscriptionActive ? (m.isTrial?'Пробный период':'Оплачено') : 'Не оплачено',
    new Date(m.createdAt).toLocaleDateString('ru-RU'),
    m.telegramId||'', ratingOf(m).toFixed(1), m.ratingCount||0
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `beautyhub-masters-${todayISO(0)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  showToast('Файл готов — проверьте загрузки браузера');
}
window.exportMastersCSV = exportMastersCSV;

async function renderAdminFunnel(){
  const keys = await sget('funnel-index', true) || [];

  for(const k of keys){

    if(e) entries.push(e);
  }
  entries.sort((a,b)=>b.startedAt-a.startedAt);
  const total = entries.length;

  const abandoned = entries.filter(e=>!e.completed);
  const rate = total ? Math.round((completed/total)*100) : 0;

  const back = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='dashboard'; fillAdmin();">←</button><div style="font-weight:700">Воронка регистрации</div></div>`;

      <div><div style="font-size:20px;font-weight:700;font-family:'Inter',sans-serif;color:var(--teal)">${completed}</div><div style="font-size:10.5px;color:var(--ink-soft);">завершили</div></div>
      <div><div style="font-size:20px;font-weight:700;font-family:'Inter',sans-serif;color:var(--rose-deep)">${rate}%</div><div style="font-size:10.5px;color:var(--ink-soft);">конверсия</div></div>
    </div>
  </div>`;

  const abandonedRows = abandoned.slice(0,50).map(e=>{
    const contactBtn = e.telegramId
      ? `<button class="link-btn" style="font-size:12px;" onclick="notifyTelegram('${e.telegramId}','Здравствуйте! Заметили, что вы начали регистрацию мастера на BeautyHub, но не закончили — если остались вопросы, с радостью помогу 🙂'); showToast('Сообщение отправлено');">Написать</button>`

      <div class="mcard-name" style="font-size:13.5px;">${escapeHtml(e.tgName||'Без имени')}</div>
      <div style="font-size:11.5px;color:var(--ink-soft);">начал(а) ${new Date(e.startedAt).toLocaleDateString('ru-RU')}</div>

  document.getElementById('content').innerHTML = back + summary + abandonedList;

    else if(b.startDate && b.startDate>today){ statusLabel='Запланирован'; statusClass='pending'; }
    else if(b.endDate && b.endDate<today){ statusLabel='Истёк'; statusClass='inactive'; }
    return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
      <div style="flex:1;">
        <div style="font-weight:700;font-size:13px;">${escapeHtml(b.emoji||'📣')} ${escapeHtml(b.text)}</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">
          ${b.audience==='all'?'Всем':b.audience==='clients'?'Клиентам':'Мастерам'}
          ${b.startDate?` · с ${fmtDate(b.startDate)}`:''}${b.endDate?` · по ${fmtDate(b.endDate)}`:''}
        </div>
      </div>
      <span class="badge ${statusClass}">${statusLabel}</span>
    </div>
    <div class="divider"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn ghost small" onclick="toggleBannerActive('${b.id}')">${b.active===false?'Включить':'Выключить'}</button>
      <button class="btn danger small" onclick="deleteBanner('${b.id}')">Удалить</button>
    </div>
  </div>`;
  }).join('') : `<div class="empty"><div class="big">📣</div>Пока нет баннеров.</div>`;

  document.getElementById('content').innerHTML = back + intro + form + `<div style="padding:14px 18px 8px;font-weight:700;font-size:13.5px;">Все баннеры</div>` + list;
}

async function createBanner(){

async function toggleBannerActive(id){
  const banners = await loadBanners();

}

async function deleteBanner(id){

  const banners = (await loadBanners()).filter(b=>b.id!==id);

const REPORT_REASONS = ['Мастер не пришёл/не вышел на связь', 'Клиент не пришёл без предупреждения', 'Грубость/хамство', 'Подозрение на мошенничество', 'Спам или реклама', 'Другое'];

async function submitReport(context){
  const reason = document.getElementById('reportReason').value;
  const comment = document.getElementById('reportComment').value.trim();
  const report = {
    id: uid(), ...context, reason, comment,
    fromTelegramId: state.tgUser ? String(state.tgUser.id) : null,
    fromName: state.tgUser ? [state.tgUser.first_name,state.tgUser.last_name].filter(Boolean).join(' ') : 'Гость',
    createdAt: Date.now(), status: 'new',
  };
  const list = await sget('reports', true) || [];
  list.push(report);
  await sset('reports', list, true);
  const el = document.getElementById('reportModalOverlay');
  if(el) el.remove();
  showToast('Жалоба отправлена владельцу');
}

/* Полный бэкап базы — выгружает все SHARED записи (мастера, записи, отзывы, чаты и т.д.)
   одним JSON-файлом. Личные данные конкретных пользователей (shared:false) не включаются —
   это не персональный бэкап конкретного человека, а бэкап платформы. */
async function exportFullBackup(){
  showToast('Собираем бэкап, это может занять немного времени…');
  try{
    const { data, error } = await sb.from('app_storage').select('scope_key,shared,value,updated_at').eq('shared', true);
    if(error) throw error;
    const backup = {
      exportedAt: new Date().toISOString(),
      app: 'BeautyHub',
      rowCount: data.length,
      rows: data
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `beautyhub-backup-${todayISO(0)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast(`Бэкап готов: ${data.length} записей`);
    logAdminAction('export_backup', `${data.length} записей`);
  }catch(e){
    console.error('backup failed', e);
    showToast('Не удалось собрать бэкап — попробуйте ещё раз');
  }
}
window.exportFullBackup = exportFullBackup;

/* ============ ОБНАРУЖЕНИЕ ДУБЛЕЙ МАСТЕРОВ (эвристика) ============ */
async function renderAdminDuplicates(){
  const back = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='dashboard'; fillAdmin();">←</button><div style="font-weight:700">Возможные дубли</div></div>`;
  const intro = `<div class="pillnote" style="margin:0 18px 14px;">Эвристика, не доказательство — сигнал для ручной проверки. Группируем профили с одинаковым Telegram-аккаунтом, а также с совпадающими именем и городом.</div>`;

  const masterIds = await sget('masters-index', true) || [];
  const masters = [];
  for(const id of masterIds){
    const m = await sget('master:'+id, true);
    if(m && !m.isDemo) masters.push(m);
  }

  // Группировка по Telegram ID — самый надёжный сигнал (один и тот же аккаунт стоит за 2+ профилями)
  const byTelegram = {};
  masters.forEach(m=>{ if(m.telegramId){ (byTelegram[m.telegramId]=byTelegram[m.telegramId]||[]).push(m); } });

  // Более слабый сигнал: совпадение имени и города (разные Telegram-аккаунты, но похоже на дубль)
  const byNameCity = {};
  masters.forEach(m=>{
    const key = (m.name||'').trim().toLowerCase()+'|'+(m.city||'').trim().toLowerCase();
    if(key.length>1) (byNameCity[key]=byNameCity[key]||[]).push(m);
  });

  const groups = [];
  Object.values(byTelegram).forEach(g=>{ if(g.length>1) groups.push({reason:'Один Telegram-аккаунт на несколько профилей', masters:g}); });
  Object.values(byNameCity).forEach(g=>{
    if(g.length>1 && !groups.some(existing=>existing.masters.some(m=>g.includes(m)))){
      groups.push({reason:'Совпадают имя и город', masters:g});
    }
  });

  const rows = groups.length ? groups.map(g=>`<div class="card">
    <div style="font-weight:700;font-size:13px;color:var(--danger);margin-bottom:8px;">⚠️ ${escapeHtml(g.reason)}</div>
    ${g.masters.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);">
      <div><div style="font-size:13px;font-weight:600;">${escapeHtml(m.name)}</div><div style="font-size:11px;color:var(--ink-soft);">${escapeHtml(m.city||'')} · создан ${new Date(m.createdAt||0).toLocaleDateString('ru-RU')}</div></div>
      <button class="btn ghost small" onclick="adminEditMaster('${m.id}')">Открыть</button>
    </div>`).join('')}
  </div>`).join('') : `<div class="empty"><div class="big">✅</div>Похожих профилей не найдено.</div>`;

  document.getElementById('content').innerHTML = back + intro + rows;
}
window.renderAdminDuplicates = renderAdminDuplicates;

async function renderAdminFraudCheck(){
  const back = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='dashboard'; fillAdmin();">←</button><div style="font-weight:700">Проверка накруток отзывов</div></div>`;
  const intro = `<div class="pillnote" style="margin:0 18px 14px;">Простая эвристика, не доказательство — сигнал для ручной проверки, а не автоматический бан. Смотрим на всплески одинаковых по времени отзывов и отзывы без привязки к реальной записи.</div>`;

  const masterIds = await sget('masters-index', true) || [];
  const flagged = [];
  for(const id of masterIds){
    const m = await sget('master:'+id, true);
    if(!m || m.isDemo) continue;
    const reviews = await loadReviews(id);
    if(reviews.length < 3) continue;

    // Всплеск: 3+ отзыва в пределах одного часа друг от друга
    const sorted = reviews.slice().sort((a,b)=>a.createdAt-b.createdAt);
    let burstFound = false, burstCount = 0;
    for(let i=0;i<sorted.length;i++){
      const windowReviews = sorted.filter(r=>Math.abs(r.createdAt-sorted[i].createdAt) < 3600000);
      if(windowReviews.length>=3){ burstFound=true; burstCount=Math.max(burstCount, windowReviews.length); }
    }
    const noBookingCount = reviews.filter(r=>!r.bookingId).length;

    if(burstFound || noBookingCount>0){
      flagged.push({ m, burstFound, burstCount, noBookingCount, totalReviews: reviews.length });
    }
  }

  const rows = flagged.length ? flagged.map(f=>`<div class="card">
    <div class="mcard-name" style="font-size:14px;">${escapeHtml(f.m.name)}</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Всего отзывов: ${f.totalReviews}</div>
    ${f.burstFound?`<div style="font-size:12.5px;color:var(--danger);margin-top:6px;">⚠️ Похоже на всплеск: ${f.burstCount} отзыва(ов) в пределах часа</div>`:''}
    ${f.noBookingCount>0?`<div style="font-size:12.5px;color:var(--danger);margin-top:4px;">⚠️ ${f.noBookingCount} отзыв(ов) без привязки к реальной записи</div>`:''}
    <div class="divider"></div>
    <button class="btn ghost small" onclick="adminEditMaster('${f.m.id}')">Открыть карточку мастера</button>
  </div>`).join('') : `<div class="empty"><div class="big">✅</div>Подозрительных паттернов не найдено.</div>`;

  document.getElementById('content').innerHTML = back + intro + rows;
}
window.renderAdminFraudCheck = renderAdminFraudCheck;

/* ============ ЗАЯВКИ НА РАЗМЕЩЕНИЕ ОБЪЯВЛЕНИЙ (от любого посетителя) ============ */
async function renderAdminAdRequests(){
  const keys = await sget('visitor-chat-index', true) || [];
  const rows = [];
  for(const key of keys){
    const chat = await loadVisitorChat(key);
    if(!chat.length) continue;
    const unread = chat.filter(msg=>msg.from==='visitor' && !msg.readByOwner).length;
    const last = chat[chat.length-1];
    const lastVisitorMsg = chat.slice().reverse().find(msg=>msg.from==='visitor');
    rows.push({ key, unread, last, name: lastVisitorMsg?lastVisitorMsg.visitorName:'Гость', role: lastVisitorMsg?lastVisitorMsg.visitorRole:null });
  }
  rows.sort((a,b)=>(b.last?b.last.createdAt:0)-(a.last?a.last.createdAt:0));

  const back = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='dashboard'; fillAdmin();">←</button><div style="font-weight:700">Заявки на объявления</div></div>`;
  const listHtml = rows.length ? rows.map(r=>{
    const preview = r.last ? escapeHtml(r.last.text.length>70 ? r.last.text.slice(0,70)+'…' : r.last.text) : '';
    const fromLabel = r.last && r.last.from==='owner' ? 'Вы: ' : '';
    return `<div class="card" style="cursor:pointer;" onclick="state.adminScreen='adrequest'; state.adminAdRequestKey='${r.key}'; fillAdmin();">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <div class="mcard-name" style="font-size:14px;">${escapeHtml(r.name)} ${r.role?`<span class="badge demo" style="margin-left:4px;">${r.role==='master'?'мастер':'клиент'}</span>`:''}</div>
        ${r.unread?`<span class="badge cancelled">${r.unread}</span>`:''}
      </div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${fromLabel}${preview}</div>
    </div>`;
  }).join('') : `<div class="empty"><div class="big">🗣️</div>Пока никто не обращался по поводу объявлений.</div>`;

  document.getElementById('content').innerHTML = back + listHtml;
}
window.renderAdminAdRequests = renderAdminAdRequests;

async function renderAdminAdRequestThread(key){
  const chat = await loadVisitorChat(key);
  let changed = false;
  chat.forEach(msg=>{ if(msg.from==='visitor' && !msg.readByOwner){ msg.readByOwner = true; changed = true; } });
  if(changed) await saveVisitorChat(key, chat);

  const lastVisitorMsg = chat.slice().reverse().find(msg=>msg.from==='visitor');
  const name = lastVisitorMsg ? lastVisitorMsg.visitorName : 'Гость';

  const bubbles = chat.length ? chat.map(msg=>`
    <div class="chat-msg ${msg.from==='owner'?'out':'in'}">
      <div class="chat-bubble">${escapeHtml(msg.text)}</div>
      <div class="chat-time">${new Date(msg.createdAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('') : `<div class="empty" style="padding:30px 10px;">Переписки пока нет.</div>`;

  document.getElementById('content').innerHTML = `
  <div class="backbar"><button class="backbtn" onclick="state.adminScreen='adrequests'; fillAdmin();">←</button><div style="font-weight:700">${escapeHtml(name)}</div></div>
  <div class="card" style="padding:12px;">
    <div class="chat-wrap">${bubbles}</div>
  </div>
  <div class="section-pad" style="display:flex;gap:8px;align-items:flex-end;">
    <textarea id="adReqInput" placeholder="Ответить…" style="flex:1;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:44px;max-height:120px;"></textarea>
    <button class="btn primary" style="width:auto;padding:0 18px;height:44px;" onclick="sendAdRequestReply('${key}')">➤</button>
  </div>`;
}
window.renderAdminAdRequestThread = renderAdminAdRequestThread;

async function sendAdRequestReply(key){
  const input = document.getElementById('adReqInput');
  const text = (input && input.value || '').trim();
  if(!text){ showToast('Введите текст ответа'); return; }
  const chat = await loadVisitorChat(key);
  chat.push({ id:uid(), from:'owner', text, createdAt:Date.now(), readByOwner:true, readByVisitor:false });
  await saveVisitorChat(key, chat);

  const lastVisitorMsg = chat.slice().reverse().find(msg=>msg.from==='visitor');
  if(lastVisitorMsg && lastVisitorMsg.visitorTelegramId){
    notifyTelegram(lastVisitorMsg.visitorTelegramId, `💬 Ответ от владельца платформы BeautyHub:\n${text}`);
  }
  showToast('Ответ отправлен');

/* ============ DASHBOARD С ДИНАМИКОЙ ============ */
function pluralDays(n){
  const mod10 = n%10, mod100 = n%100;
  if(mod10===1 && mod100!==11) return 'день';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'дня';
  return 'дней';
}
/* Простой бар-чарт на чистом SVG — без сторонних библиотек, чтобы не тянуть зависимости
   в отдающийся клиенту index.html. Один снимок статистики = один столбик. */
function renderTrendChart(snapshots, key, color){
  const w = 320, h = 84, pad = 3;
  const values = snapshots.map(s => Number(s[key]) || 0);
  const max = Math.max(1, ...values);
  const n = values.length;
  const barW = (w - pad*2) / n;
  const bars = values.map((v,i)=>{
    const bh = Math.max(2, (v/max) * (h - pad*2));
    const x = pad + i*barW;
    const y = h - pad - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,barW-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" style="fill:${color};"></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">${bars}</svg>`;
}
async function renderAdminTrends(){
  const keys = await slist('stats-daily:', true); // ['stats-daily:2026-07-01', ...]
  const dates = keys.map(k=>k.slice('stats-daily:'.length)).sort();
  const recentDates = dates.slice(-30);
  const snapshots = [];
  for(const d of recentDates){
    const s = await sget('stats-daily:'+d, true);
    if(s) snapshots.push(s);
  }

  // --- Когортный анализ удержания: по месяцу регистрации — сколько заплатили хотя бы раз,
  //     и сколько из них дошли до второй оплаты (реальное продление подписки). ---
  const allMasters = await loadAllMasters();
  const cohorts = {};
  allMasters.forEach(m=>{
    if(!m.createdAt) return;
    const month = new Date(m.createdAt).toISOString().slice(0,7); // YYYY-MM
    if(!cohorts[month]) cohorts[month] = { month, total:0, paid:0, renewed:0 };
    const c = cohorts[month];
    c.total++;
    const payCount = (m.paymentHistory||[]).length;
    if(payCount>=1) c.paid++;
    if(payCount>=2) c.renewed++;
  });
  const cohortMonths = Object.keys(cohorts).sort().slice(-6); // последние 6 месяцев
  const cohortRows = cohortMonths.map(mo=>{
    const c = cohorts[mo];
    const rate = c.paid ? Math.round((c.renewed/c.paid)*100) : null;
    const monthLabel = new Date(mo+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;">
      <span style="text-transform:capitalize;">${monthLabel}</span>
      <span style="color:var(--ink-soft);">${c.total} рег. · ${c.paid} оплат.${rate!==null?` · <b style="color:${rate>=50?'var(--teal)':'var(--danger)'};">${rate}% продлили</b>`:''}</span>
    </div>`;
  }).join('');
  const cohortCard = cohortMonths.length ? `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">🔁 Удержание по когортам регистрации</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;">% продлили — доля тех, кто заплатил хотя бы раз, среди них заплатил ещё раз (реальное продление подписки).</div>
    ${cohortRows}
  </div>` : '';

  const back = `<div class="backbar"><button class="backbtn" onclick="state.adminScreen='dashboard'; fillAdmin();">←</button><div style="font-weight:700">Динамика</div></div>`;

  if(!snapshots.length){
    document.getElementById('content').innerHTML = back + cohortCard + `<div class="empty"><div class="big">📈</div>Пока нет данных для графика.<br>Первый снимок статистики уже сохранён сегодня — откройте кабинет владельца завтра, и здесь появится вторая точка.</div>`;
    return;
  }

  const last = snapshots[snapshots.length-1];
  const first = snapshots[0];
  const deltaMasters = last.totalMasters - first.totalMasters;
  const deltaMrr = last.mrr - first.mrr;
  const summary = snapshots.length>1
    ? `<div class="pillnote" style="margin:0 18px 14px;">За последние ${snapshots.length} ${pluralDays(snapshots.length)}: мастеров ${deltaMasters>=0?'+':''}${deltaMasters}, MRR ${deltaMrr>=0?'+':''}${deltaMrr}₽.</div>`
    : `<div class="pillnote" style="margin:0 18px 14px;">Пока сохранён только один снимок — график начнёт складываться со второго дня.</div>`;

  document.getElementById('content').innerHTML = back + summary + cohortCard + `
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">💰 MRR, оценка (₽/мес)</div>
    ${renderTrendChart(snapshots, 'mrr', 'var(--rose-deep)')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.mrr}₽</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">👥 Всего мастеров</div>
    ${renderTrendChart(snapshots, 'totalMasters', 'var(--rose)')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.totalMasters}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">🆓 На пробном периоде</div>
    ${renderTrendChart(snapshots, 'onTrial', '#C9A15A')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.onTrial}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">🔴 Ожидают оплаты (churn-риск)</div>
    ${renderTrendChart(snapshots, 'inactive', 'var(--danger)')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.inactive}</div>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">⏳ На модерации</div>
    ${renderTrendChart(snapshots, 'pendingModeration', '#8C6BB1')}
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Сейчас: ${last.pendingModeration}</div>
  </div>
  <div class="section-pad" style="font-size:11.5px;color:var(--ink-soft);">Один столбик = один день. Данные копятся начиная с ${fmtDate(first.date)}. Снимок сохраняется автоматически при открытии этого кабинета — для полностью автономного сбора данных (даже если вы не заходите в приложение) настройте DAILY_DIGEST_SETUP.md.</div>`;
}

/* Ручное продление подписки владельцем — работает независимо от того, как мастер платил

async function adminExtendSubscription(masterId, days){
  const m = await loadMaster(masterId);
  if(!m) return;
  const base = (m.subscriptionActive && m.subscriptionUntil && !m.isTrial)
    ? new Date(m.subscriptionUntil+'T00:00:00')
    : new Date();
  base.setDate(base.getDate() + days);
  m.subscriptionUntil = base.toISOString().slice(0,10);
  m.subscriptionActive = true;
  m.isTrial = false;
  m.trialEndsAt = null;
  m.trialExpiredNotifiedAt = null;
  m.subscriptionReminderForUntil = null;
  m.paymentClaimStatus = null;
  m.paymentHistory = m.paymentHistory || [];
  m.paymentHistory.push({ method:'manual-admin', amount:null, confirmedAt:Date.now(), subscriptionUntil:m.subscriptionUntil });
  await saveMaster(m);
  showToast(`Подписка продлена вручную до ${m.subscriptionUntil}`);
  logAdminAction('extend_subscription', `${m.name} — +${days} дн. вручную, до ${m.subscriptionUntil}`);
  if(m.telegramId){
    notifyTelegram(m.telegramId, `✅ Владелец платформы вручную активировал вашу подписку BeautyHub до ${m.subscriptionUntil}.`);
  }
  fillAdmin();
}

async function adminApproveMaster(id){
  const m = await loadMaster(id);
  m.moderationStatus = 'approved';
  m.moderationReason = null;
  m.subscriptionActive = true;
  if(SUBSCRIPTION_ENABLED){
    // Пробный доступ на 24 часа: сразу появляется в каталоге, оплата потребуется по истечении
    m.isTrial = true;
    const REFERRAL_BONUS_HOURS = 72; // +3 дня обоим за приглашение коллеги
    const bonusHours = (m.referredByMasterId && !m.referralBonusGranted) ? REFERRAL_BONUS_HOURS : 0;
    m.trialEndsAt = Date.now() + (24 + bonusHours) * 3600000;
    m.subscriptionUntil = null;
    m.trialExpiredNotifiedAt = null;
    if(bonusHours){
      m.referralBonusGranted = true;
      await grantMasterReferralBonus(m.referredByMasterId, REFERRAL_BONUS_HOURS);
    }
    await saveMaster(m);
    showToast(bonusHours ? 'Мастер одобрен — пробный доступ 24ч + 3 дня бонус за приглашение коллеги' : 'Мастер одобрен — включён пробный доступ на 24 часа');
  } else {
    // Подписка временно отключена — доступ бесплатный и бессрочный, пока не включим оплату обратно
    m.isTrial = false;
    m.trialEndsAt = null;
    m.subscriptionUntil = null;
    m.trialExpiredNotifiedAt = null;
    await saveMaster(m);
    showToast('Мастер одобрен — доступ бесплатный, сразу виден в каталоге');
  }
  logAdminAction('approve_master', m.name);
  fillAdmin();
}
window.adminApproveMaster = adminApproveMaster;

/* Начисляет мастеру-пригласившему бонусные часы доступа — продлевает пробный период
   либо оплаченную подписку, а если доступ уже неактивен, выдаёт короткий бонусный пробный период. */
/* Журнал действий владельца/админов — кто и что сделал (одобрил, удалил, продлил вручную и т.п.).
   Полезно, когда с кабинетом работает не один человек. Храним последние 500 записей. */
async function logAdminAction(action, details){
  try{
    const log = await sget('audit-log', true) || [];
    log.push({
      at: Date.now(),
      actorId: state.tgUser ? String(state.tgUser.id) : 'browser-admin',
      actorName: state.tgUser ? [state.tgUser.first_name,state.tgUser.last_name].filter(Boolean).join(' ') : 'Тестовый вход',
      action, details
    });
    while(log.length > 500) log.shift();
    await sset('audit-log', log, true);
  }catch(e){ console.warn('logAdminAction failed:', e); }
}

async function grantMasterReferralBonus(masterId, hours){
  try{
    const m = await loadMaster(masterId);
    if(!m) return;
    if(m.isTrial && m.trialEndsAt){
      m.trialEndsAt += hours*3600000;
    } else if(m.subscriptionActive && m.subscriptionUntil){
      const d = new Date(m.subscriptionUntil+'T00:00:00');
      d.setDate(d.getDate() + Math.ceil(hours/24));
      m.subscriptionUntil = d.toISOString().slice(0,10);
    } else {
      m.subscriptionActive = true;
      m.isTrial = true;
      m.trialEndsAt = Date.now() + hours*3600000;
      m.trialExpiredNotifiedAt = null;
    }
    await saveMaster(m);
    if(m.telegramId){
      await notifyTelegram(m.telegramId, `🎁 Вам начислен бонус +${Math.round(hours/24)} дн. доступа — коллега зарегистрировался по вашей приглашительной ссылке на BeautyHub!`);
    }
  }catch(e){ console.warn('grantMasterReferralBonus failed:', e); }
}

async function adminRejectMaster(id){
  const reason = window.prompt('Укажите причину отклонения (мастер её увидит):', '');
  if(reason===null) return; // отменено
  const m = await loadMaster(id);
  m.moderationStatus = 'rejected';
  m.moderationReason = reason || 'Причина не указана';
  await saveMaster(m);
  showToast('Мастер отклонён');
  logAdminAction('reject_master', `${m.name} — ${m.moderationReason}`);
  fillAdmin();
}
window.adminRejectMaster = adminRejectMaster;

async function adminDeleteMaster(id){
  const m = await loadMaster(id);
  const sure = window.confirm(`Удалить мастера «${m?m.name:''}»? Это действие необратимо: удалятся профиль, записи и отзывы.`);
  if(!sure) return;
  await removeMasterFromIndex(id);
  await sdelete('master:'+id, true);
  await sdelete('bookings:'+id, true);
  await sdelete('reviews:'+id, true);
  showToast('Мастер удалён');
  logAdminAction('delete_master', m?m.name:id);
  fillAdmin();
}
window.adminDeleteMaster = adminDeleteMaster;

async function renderAdminEdit(id){
  const m = await loadMaster(id);
  if(!m){ state.adminEditingId=null; return fillAdmin(); }
  const history = (m.paymentHistory||[]).slice().reverse();
  const historyBlock = `<div class="card">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">История платежей</div>
    ${history.length ? history.map(h=>`
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;">
        <span>${h.method==='sbp'?'📱 СБП':h.method==='yookassa'?'💳 ЮKassa (онлайн)':'💳 Карта'} · ${new Date(h.confirmedAt).toLocaleDateString('ru-RU')}</span>
        <span style="color:var(--ink-soft)">до ${fmtDate(h.subscriptionUntil)}</span>
      </div>`).join('') : `<div style="font-size:12.5px;color:var(--ink-soft)">Платежей ещё не было</div>`}
  </div>`;
  document.getElementById('content').innerHTML = `
  <div class="backbar"><button class="backbtn" onclick="adminCancelEdit()">←</button><div style="font-weight:700">Редактирование мастера</div></div>
  <div class="card">
    <div class="field"><label>Имя</label><input id="admName" value="${escapeHtml(m.name)}"></div>
    <div class="field"><label>Специализация</label><select id="admSpec">${Object.entries(SPECS).map(([k,v])=>`<option value="${k}" ${m.specialization===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="field"><label>Город</label><input id="admCity" value="${escapeHtml(m.city)}"></div>
      <div class="field"><label>Адрес</label><input id="admAddress" value="${escapeHtml(m.address||'')}"></div>
    </div>
    <div class="field"><label>О себе</label><textarea id="admBio">${escapeHtml(m.bio||'')}</textarea></div>
    <div class="field"><label>Статус подписки</label>
      <select id="admSub">
        <option value="active" ${m.subscriptionActive?'selected':''}>Оплачено (видим в каталоге)</option>
        <option value="inactive" ${!m.subscriptionActive?'selected':''}>Не оплачено</option>
      </select>
    </div>
    <div class="field"><label>Статус модерации</label>
      <select id="admModeration">
        <option value="pending" ${m.moderationStatus==='pending'?'selected':''}>На проверке</option>
        <option value="approved" ${m.moderationStatus==='approved'?'selected':''}>Одобрен</option>
        <option value="rejected" ${m.moderationStatus==='rejected'?'selected':''}>Отклонён</option>
      </select>
    </div>
    <div class="field"><label>Теги / сегмент (через запятую)</label><input id="admTags" placeholder="перспективный, нужно дожать..." value="${escapeHtml((m.tags||[]).join(', '))}"></div>
    <button class="btn primary" onclick="adminSaveEdit('${id}')">Сохранить</button>
  </div>
  ${historyBlock}`;
}
function adminCancelEdit(){ state.adminEditingId=null; fillAdmin(); }
window.adminCancelEdit = adminCancelEdit;

async function adminSaveEdit(id){
  const m = await loadMaster(id);
  m.name = document.getElementById('admName').value.trim() || m.name;
  m.specialization = document.getElementById('admSpec').value;
  m.city = document.getElementById('admCity').value.trim() || m.city;
  m.address = document.getElementById('admAddress').value.trim();
  m.bio = document.getElementById('admBio').value.trim();
  const subVal = document.getElementById('admSub').value;
  m.subscriptionActive = subVal==='active';
  if(m.subscriptionActive){
    if(!m.subscriptionUntil || m.isTrial) m.subscriptionUntil = todayISO(30);
    m.isTrial = false;
    m.trialEndsAt = null;
  }
  m.moderationStatus = document.getElementById('admModeration').value;
  m.tags = document.getElementById('admTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  await saveMaster(m);
  state.adminEditingId=null;
  showToast('Изменения сохранены');
  fillAdmin();
}
window.adminSaveEdit = adminSaveEdit;

/* ============ GO ============ */
/* ============ SAFETY NET ============
   Если что-то всё же упадёт при загрузке (опечатка при редактировании и т.п.),
   показываем понятную ошибку вместо белого экрана. */
window.addEventListener('error', function(e){
  const app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = `<div style="padding:60px 24px;text-align:center;font-family:sans-serif;background:#FCEEF6;min-height:100vh;">
      <div style="font-size:40px;margin-bottom:14px;">⚠️</div>
      <div style="font-weight:700;font-size:16px;color:#34202C;margin-bottom:8px;">Ошибка при загрузке приложения</div>
      <div style="font-size:12.5px;color:#7C6670;word-break:break-word;">${(e.message||'').toString().replace(/</g,'&lt;')}</div>
    </div>`;
  }
});

/* То же самое, но для ошибок внутри async-функций (Promise), которые никто не
   поймал — например, если экран завис на "Загрузка..." из-за необработанного
   исключения. Показываем сообщение в контенте, не давая экрану виснуть молча. */
window.addEventListener('unhandledrejection', function(e){
  console.error('Необработанная ошибка:', e.reason);
  const content = document.getElementById('content');
  const target = content || document.getElementById('app');
  if(target){
    const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    target.innerHTML = `<div style="padding:50px 24px;text-align:center;">
      <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:700;font-size:15px;color:var(--ink,#34202C);margin-bottom:8px;">Что-то пошло не так</div>
      <div style="font-size:12.5px;color:var(--ink-soft,#7C6670);word-break:break-word;">${msg.toString().replace(/</g,'&lt;')}</div>
      <div style="margin-top:16px;"><button class="btn ghost small" onclick="render()">Попробовать снова</button></div>
    </div>`;
  }
});

init();
</script>
